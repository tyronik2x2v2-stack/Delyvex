<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Delyvex</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0b0812;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#100b1a;
  border-bottom:1px solid #2a1a3d;
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  color:#c084fc;
  font-size:26px;
  font-weight:800;
  cursor:pointer;
}

.nav-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:10px;
  padding:10px 15px;
  background:#8b5cf6;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}

button:hover{
  background:#a855f7;
}

button.secondary{
  background:#21152f;
}

button.danger{
  background:#7f1d1d;
}

main{
  max-width:1200px;
  margin:auto;
  padding:25px 20px 90px;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.hero{
  text-align:center;
  padding:45px 15px 25px;
}

.hero h1{
  margin:0 0 10px;
  color:#c084fc;
  font-size:42px;
}

.hero p{
  color:#999;
}

.card{
  background:#130d1f;
  border:1px solid #2a1a3d;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}

.search-box{
  max-width:700px;
  margin:0 auto 25px;
}

label{
  display:block;
  margin-bottom:6px;
  color:#d8b4fe;
  font-weight:600;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  background:#0d0915;
  color:#fff;
  border:1px solid #39234f;
  border-radius:10px;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#8b5cf6;
}

textarea{
  min-height:120px;
  resize:vertical;
}

.listings-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:18px;
}

.listing{
  overflow:hidden;
  background:#130d1f;
  border:1px solid #2a1a3d;
  border-radius:16px;
}

.listing-image{
  width:100%;
  height:180px;
  object-fit:cover;
  background:#21152f;
}

.listing-content{
  padding:16px;
}

.listing-game{
  display:inline-block;
  margin-bottom:10px;
  padding:5px 9px;
  border-radius:8px;
  background:#24133b;
  color:#c084fc;
  font-size:13px;
}

.listing-title{
  font-size:20px;
  font-weight:700;
  margin-bottom:8px;
}

.price{
  margin:12px 0;
  color:#c084fc;
  font-size:22px;
  font-weight:800;
}

.muted{
  color:#999;
}

.user-area{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#21152f;
  border:2px solid #8b5cf6;
}

.profile-head{
  display:flex;
  align-items:center;
  gap:15px;
}

.profile-big-avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
  background:#21152f;
  border:3px solid #8b5cf6;
}

.chat-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.chat-item{
  padding:15px;
  background:#180f26;
  border:1px solid #2b1940;
  border-radius:12px;
  cursor:pointer;
}

.chat-item:hover{
  border-color:#8b5cf6;
}

.chat-user{
  display:flex;
  align-items:center;
  gap:10px;
}

.chat-message{
  margin-top:10px;
  color:#bbb;
}

.chat-window{
  display:none;
}

.chat-window.active{
  display:block;
}

.messages-box{
  height:400px;
  overflow-y:auto;
  padding:15px;
  margin-bottom:15px;
  background:#0d0915;
  border:1px solid #28183c;
  border-radius:12px;
}

.message{
  max-width:75%;
  padding:10px 13px;
  margin-bottom:10px;
  background:#21152f;
  border-radius:12px;
}

.message.mine{
  margin-left:auto;
  background:#6d3fc0;
}

.message-time{
  margin-top:4px;
  color:#aaa;
  font-size:11px;
}

.hidden{
  display:none!important;
}

.bottom-nav{
  display:none;
}

hr{
  border:0;
  border-top:1px solid #2a1a3d;
  margin:25px 0;
}

@media(max-width:700px){

  .nav{
    padding:12px;
  }

  .nav-buttons{
    display:none;
  }

  .hero h1{
    font-size:32px;
  }

  .bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:200;
    display:flex;
    justify-content:space-around;
    padding:8px;
    background:#100b1a;
    border-top:1px solid #28183c;
  }

  .bottom-nav button{
    padding:8px;
    background:transparent;
    font-size:12px;
  }

  main{
    padding:15px 12px 85px;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">

    <div
      class="logo"
      onclick="showSection('home')"
    >
      Delyvex
    </div>

    <div class="nav-buttons">
      <button onclick="showSection('home')">
        Главная
      </button>

      <button onclick="showSection('sell')">
        ➕ Продать
      </button>

      <button onclick="showSection('messages')">
        💬 Чаты
      </button>

      <button onclick="showSection('profile')">
        👤 Профиль
      </button>
    </div>

    <div class="user-area">

      <img
        id="headerAvatar"
        class="avatar hidden"
        alt="avatar"
      >

      <span id="headerUsername">
        Гость
      </span>

      <button
        id="loginBtn"
        onclick="loginWithGoogle()"
      >
        Войти
      </button>

      <button
        id="logoutBtn"
        class="secondary hidden"
        onclick="logout()"
      >
        Выйти
      </button>

    </div>

  </div>
</header>


<main>

<!-- ГЛАВНАЯ -->

<section
  id="home"
  class="section active"
>

  <div class="hero">

    <h1>Delyvex</h1>

    <p>
      Маркетплейс игровых товаров
    </p>

  </div>


  <div class="card search-box">

    <label>
      Поиск по игре
    </label>

    <input
      id="gameSearch"
      type="search"
      placeholder="Minecraft, Fortnite, GTA V..."
      oninput="filterListings()"
    >

  </div>


  <div
    id="listingsContainer"
    class="listings-grid"
  ></div>

</section>


<!-- ПРОДАЖА -->

<section
  id="sell"
  class="section"
>

  <div class="card">

    <h2>
      Создать объявление
    </h2>

    <label>
      Игра
    </label>

    <input
      id="listingGame"
      type="text"
      placeholder="Например: Minecraft"
    >

    <label>
      Название
    </label>

    <input
      id="listingTitle"
      type="text"
      placeholder="Что продаёшь?"
    >

    <label>
      Описание
    </label>

    <textarea
      id="listingDescription"
      placeholder="Описание товара"
    ></textarea>

    <label>
      Цена
    </label>

    <input
      id="listingPrice"
      type="number"
      min="0"
      step="0.01"
      placeholder="10"
    >

    <label>
      Категория
    </label>

    <select id="listingCategory">

      <option value="Игровой предмет">
        Игровой предмет
      </option>

      <option value="Скин">
        Скин
      </option>

      <option value="Аккаунт">
        Аккаунт
      </option>

      <option value="Другое">
        Другое
      </option>

    </select>

    <label>
      Ссылка на изображение
    </label>

    <input
      id="listingImage"
      type="url"
      placeholder="https://..."
    >

    <button
      onclick="createListing()"
    >
      Опубликовать
    </button>

  </div>

</section>


<!-- ЧАТЫ -->

<section
  id="messages"
  class="section"
>

  <div id="chatListView">

    <div class="card">

      <h2>
        💬 Чаты
      </h2>

      <div
        id="conversations"
        class="chat-list"
      >
        <p class="muted">
          Загрузка...
        </p>
      </div>

    </div>

  </div>


  <div
    id="chatWindow"
    class="chat-window"
  >

    <div class="card">

      <button
        class="secondary"
        onclick="closeChat()"
      >
        ← Назад
      </button>

      <h2 id="chatTitle">
        Чат
      </h2>

      <div
        id="messagesBox"
        class="messages-box"
      ></div>

      <div
        style="display:flex;gap:10px;"
      >

        <input
          id="messageInput"
          type="text"
          placeholder="Написать сообщение..."
          onkeydown="if(event.key==='Enter')sendMessage()"
        >

        <button onclick="sendMessage()">
          Отправить
        </button>

      </div>

    </div>

  </div>

</section>


<!-- ПРОФИЛЬ -->

<section
  id="profile"
  class="section"
>

  <div class="card">

    <div class="profile-head">

      <img
        id="avatarPreview"
        class="profile-big-avatar"
        alt="Аватарка"
      >

      <div>

        <h2 id="profileUsername">
          Профиль
        </h2>

        <p
          id="profileEmail"
          class="muted"
        ></p>

      </div>

    </div>


    <hr>


    <h3>
      Аватарка
    </h3>

    <input
      type="file"
      id="avatarFile"
      accept="image/*"
    >

    <button
      onclick="uploadAvatar()"
    >
      Загрузить аватарку
    </button>


    <hr>


    <h3>
      Никнейм
    </h3>

    <input
      id="profileNickname"
      type="text"
      placeholder="Твой никнейм"
    >

    <button
      onclick="saveProfile()"
    >
      Сохранить профиль
    </button>


    <hr>


    <button
      class="danger"
      onclick="logout()"
    >
      Выйти
    </button>

  </div>

</section>


<!-- ВХОД -->

<section
  id="auth"
  class="section"
>

  <div class="card">

    <h2>
      Вход в Delyvex
    </h2>

    <p class="muted">
      Войди через Google, чтобы пользоваться
      продажами и чатами.
    </p>

    <button
      onclick="loginWithGoogle()"
    >
      Войти через Google
    </button>

  </div>

</section>

</main>


<!-- МОБИЛЬНАЯ НАВИГАЦИЯ -->

<div class="bottom-nav">

  <button onclick="showSection('home')">
    🏠<br>Главная
  </button>

  <button onclick="showSection('sell')">
    ➕<br>Продать
  </button>

  <button onclick="showSection('messages')">
    💬<br>Чаты
  </button>

  <button onclick="showSection('profile')">
    👤<br>Профиль
  </button>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://gisdufgixjfudblxydvm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_irNKt_PStZrQ2NCEdaD5sg_quCmigAn";

const sb =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const GITHUB_URL =
"https://tyronik2x2v2-stack.github.io/Delyvex/";


let currentUser = null;

let allListings = [];

let currentChatUser = null;

let currentChatListing = null;

let messagesChannel = null;


/* =====================================================
   НАВИГАЦИЯ
===================================================== */

function showSection(id){

  document
    .querySelectorAll(".section")
    .forEach(section => {

      section.classList.remove("active");

    });


  const section =
    document.getElementById(id);


  if(section){

    section.classList.add("active");

  }


  if(id === "messages"){

    if(!currentUser){

      showSection("auth");

      return;

    }

    loadConversations();

  }


  if(id === "profile"){

    if(!currentUser){

      showSection("auth");

      return;

    }

    loadProfile();

  }

}


/* =====================================================
   GOOGLE
===================================================== */

async function loginWithGoogle(){

  try{

    const result =
      await sb.auth.signInWithOAuth({

        provider:"google",

        options:{

          redirectTo:GITHUB_URL,

          skipBrowserRedirect:false,

          queryParams:{
            access_type:"offline",
            prompt:"select_account"
          }

        }

      });


    if(result.error){

      alert(
        "Ошибка входа:\n\n" +
        result.error.message
      );

    }

  }catch(error){

    alert(
      "Ошибка входа:\n\n" +
      error.message
    );

  }

}


/* =====================================================
   ВЫХОД
===================================================== */

async function logout(){

  await sb.auth.signOut();

  currentUser = null;

  updateAuthUI();

  showSection("home");

}


/* =====================================================
   AUTH
===================================================== */

sb.auth.onAuthStateChange(
  async (event,session) => {

    currentUser =
      session?.user || null;

    updateAuthUI();


    if(currentUser){

      await ensureProfile();

      await loadProfile();

    }

  }
);


async function initialize(){

  const {
    data:{
      session
    }
  } =
    await sb.auth.getSession();


  currentUser =
    session?.user || null;


  updateAuthUI();


  await loadListings();


  if(currentUser){

    await ensureProfile();

    await loadProfile();

  }

}


function updateAuthUI(){

  const loginBtn =
    document.getElementById(
      "loginBtn"
    );

  const logoutBtn =
    document.getElementById(
      "logoutBtn"
    );

  const username =
    document.getElementById(
      "headerUsername"
    );

  const avatar =
    document.getElementById(
      "headerAvatar"
    );


  if(currentUser){

    loginBtn.classList.add(
      "hidden"
    );

    logoutBtn.classList.remove(
      "hidden"
    );


    username.textContent =
      currentUser.user_metadata?.name ||
      currentUser.user_metadata?.full_name ||
      currentUser.email ||
      "Пользователь";


    const url =
      currentUser.user_metadata?.avatar_url ||
      currentUser.user_metadata?.picture;


    if(url){

      avatar.src = url;

      avatar.classList.remove(
        "hidden"
      );

    }

  }else{

    loginBtn.classList.remove(
      "hidden"
    );

    logoutBtn.classList.add(
      "hidden"
    );

    username.textContent =
      "Гость";

    avatar.classList.add(
      "hidden"
    );

  }

}


/* =====================================================
   ПРОФИЛЬ
===================================================== */

async function ensureProfile(){

  if(!currentUser){
    return;
  }


  const {
    data,
    error
  } =
    await sb
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();


  if(error){

    console.error(error);

    return;

  }


  if(!data){

    const nickname =
      currentUser.user_metadata?.name ||
      currentUser.user_metadata?.full_name ||
      currentUser.email?.split("@")[0] ||
      "Пользователь";


    const avatar =
      currentUser.user_metadata?.avatar_url ||
      currentUser.user_metadata?.picture ||
      null;


    const {
      error:insertError
    } =
      await sb
        .from("profiles")
        .insert({

          id:currentUser.id,

          nickname:nickname,

          avatar_url:avatar

        });


    if(insertError){

      console.error(
        "Profile create error:",
        insertError
      );

    }

  }

}


async function loadProfile(){

  if(!currentUser){
    return;
  }


  const {
    data,
    error
  } =
    await sb
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();


  if(error){

    console.error(
      "Profile load error:",
      error
    );

    return;

  }


  const nickname =
    data?.nickname ||
    currentUser.user_metadata?.name ||
    currentUser.user_metadata?.full_name ||
    currentUser.email?.split("@")[0] ||
    "Пользователь";


  document.getElementById(
    "profileUsername"
  ).textContent = nickname;


  document.getElementById(
    "profileEmail"
  ).textContent =
    currentUser.email || "";


  document.getElementById(
    "profileNickname"
  ).value = nickname;


  const avatar =
    data?.avatar_url ||
    currentUser.user_metadata?.avatar_url ||
    currentUser.user_metadata?.picture ||
    "";


  if(avatar){

    document.getElementById(
      "avatarPreview"
    ).src =
      avatar + "?t=" + Date.now();


    document.getElementById(
      "headerAvatar"
    ).src =
      avatar + "?t=" + Date.now();


    document.getElementById(
      "headerAvatar"
    ).classList.remove(
      "hidden"
    );

  }

}


/* =====================================================
   СОХРАНЕНИЕ ПРОФИЛЯ
===================================================== */

async function saveProfile(){

  if(!currentUser){

    alert(
      "Сначала войди в аккаунт."
    );

    return;

  }


  const nickname =
    document
      .getElementById(
        "profileNickname"
      )
      .value
      .trim();


  if(!nickname){

    alert(
      "Введите никнейм."
    );

    return;

  }


  const {
    error
  } =
    await sb
      .from("profiles")
      .upsert({

        id:currentUser.id,

        nickname:nickname

      });


  if(error){

    console.error(
      "Profile save error:",
      error
    );


    alert(
      "Ошибка сохранения профиля:\n\n" +
      error.message
    );

    return;

  }


  document.getElementById(
    "profileUsername"
  ).textContent =
    nickname;


  document.getElementById(
    "headerUsername"
  ).textContent =
    nickname;


  alert(
    "Профиль сохранён!"
  );

}


/* =====================================================
   АВАТАРКА
===================================================== */

async function uploadAvatar(){

  try{

    if(!currentUser){

      alert(
        "Сначала войди в аккаунт."
      );

      return;

    }


    const input =
      document.getElementById(
        "avatarFile"
      );


    const file =
      input.files[0];


    if(!file){

      alert(
        "Выбери изображение."
      );

      return;

    }


    if(file.size > 10 * 1024 * 1024){

      alert(
        "Размер файла не должен превышать 10 МБ."
      );

      return;

    }


    if(!file.type.startsWith("image/")){

      alert(
        "Можно загружать только изображения."
      );

      return;

    }


    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase() || "jpg";


    /*
      ВАЖНО:

      Путь:

      USER_ID/avatar.extension

      соответствует RLS Storage.
    */

    const filePath =
      `${currentUser.id}/avatar.${extension}`;


    const {
      error:uploadError
    } =
      await sb.storage
        .from("avatars")
        .upload(

          filePath,

          file,

          {
            upsert:true,

            contentType:file.type,

            cacheControl:"3600"
          }

        );


    if(uploadError){

      console.error(
        uploadError
      );


      alert(
        "Ошибка загрузки аватарки:\n\n" +
        uploadError.message
      );

      return;

    }


    const {
      data
    } =
      sb.storage
        .from("avatars")
        .getPublicUrl(
          filePath
        );


    const publicUrl =
      data.publicUrl;


    const {
      error:profileError
    } =
      await sb
        .from("profiles")
        .upsert({

          id:currentUser.id,

          avatar_url:publicUrl

        });


    if(profileError){

      alert(
        "Аватарка загружена, но профиль не обновился:\n\n" +
        profileError.message
      );

      return;

    }


    const url =
      publicUrl +
      "?t=" +
      Date.now();


    document.getElementById(
      "avatarPreview"
    ).src = url;


    document.getElementById(
      "headerAvatar"
    ).src = url;


    document.getElementById(
      "headerAvatar"
    ).classList.remove(
      "hidden"
    );


    input.value = "";


    alert(
      "Аватарка успешно обновлена!"
    );


  }catch(error){

    console.error(error);

    alert(
      "Ошибка загрузки аватарки:\n\n" +
      error.message
    );

  }

}


/* =====================================================
   ОБЪЯВЛЕНИЯ
===================================================== */

async function loadListings(){

  const {
    data,
    error
  } =
    await sb
      .from("listings")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(error);

    document.getElementById(
      "listingsContainer"
    ).innerHTML = `
      <div class="card">
        Ошибка загрузки объявлений:<br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

    return;

  }


  allListings =
    data || [];


  filterListings();

}


function filterListings(){

  const query =
    document.getElementById(
      "gameSearch"
    ).value
      .trim()
      .toLowerCase();


  if(!query){

    renderListings(
      allListings
    );

    return;

  }


  const filtered =
    allListings.filter(item => {

      const game =
        String(item.game || "")
          .toLowerCase();

      const title =
        String(item.title || "")
          .toLowerCase();

      const description =
        String(item.description || "")
          .toLowerCase();


      return (
        game.includes(query) ||
        title.includes(query) ||
        description.includes(query)
      );

    });


  renderListings(filtered);

}


function renderListings(items){

  const container =
    document.getElementById(
      "listingsContainer"
    );


  if(!items.length){

    container.innerHTML = `
      <div class="card">
        <h3>Ничего не найдено</h3>
        <p class="muted">
          Попробуй другое название игры.
        </p>
      </div>
    `;

    return;

  }


  container.innerHTML =
    items
      .map(listing => {

        const image =
          listing.image_url ||
          "https://placehold.co/600x400/130d1f/c084fc?text=Delyvex";


        return `
          <div class="listing">

            <img
              class="listing-image"
              src="${escapeAttr(image)}"
              alt=""
              onerror="this.src='https://placehold.co/600x400/130d1f/c084fc?text=Delyvex'"
            >

            <div class="listing-content">

              <div class="listing-game">
                🎮 ${escapeHTML(
                  listing.game ||
                  "Игра не указана"
                )}
              </div>

              <div class="listing-title">
                ${escapeHTML(
                  listing.title ||
                  "Без названия"
                )}
              </div>

              <p class="muted">
                ${escapeHTML(
                  listing.description ||
                  "Нет описания"
                )}
              </p>

              <div class="price">
                ${escapeHTML(
                  String(
                    listing.price ?? "—"
                  )
                )} €
              </div>

            </div>

          </div>
        `;

      })
      .join("");

}


/* =====================================================
   СОЗДАНИЕ ОБЪЯВЛЕНИЯ
===================================================== */

async function createListing(){

  if(!currentUser){

    alert(
      "Чтобы продавать, сначала войди."
    );

    showSection("auth");

    return;

  }


  const game =
    document
      .getElementById(
        "listingGame"
      )
      .value
      .trim();


  const title =
    document
      .getElementById(
        "listingTitle"
      )
      .value
      .trim();


  const description =
    document
      .getElementById(
        "listingDescription"
      )
      .value
      .trim();


  const price =
    document
      .getElementById(
        "listingPrice"
      )
      .value;


  const category =
    document
      .getElementById(
        "listingCategory"
      )
      .value;


  const image_url =
    document
      .getElementById(
        "listingImage"
      )
      .value
      .trim();


  if(!game){

    alert(
      "Укажи игру."
    );

    return;

  }


  if(!title){

    alert(
      "Укажи название."
    );

    return;

  }


  if(!description){

    alert(
      "Добавь описание."
    );

    return;

  }


  if(price === ""){

    alert(
      "Укажи цену."
    );

    return;

  }


  const {
    error
  } =
    await sb
      .from("listings")
      .insert({

        seller_id:
          currentUser.id,

        game:game,

        title:title,

        description:description,

        price:Number(price),

        category:category,

        image_url:
          image_url || null

      });


  if(error){

    console.error(error);

    alert(
      "Ошибка создания объявления:\n\n" +
      error.message
    );

    return;

  }


  document.getElementById(
    "listingGame"
  ).value = "";

  document.getElementById(
    "listingTitle"
  ).value = "";

  document.getElementById(
    "listingDescription"
  ).value = "";

  document.getElementById(
    "listingPrice"
  ).value = "";

  document.getElementById(
    "listingImage"
  ).value = "";


  await loadListings();

  showSection("home");


  alert(
    "Объявление опубликовано!"
  );

}


/* =====================================================
   ЧАТЫ
===================================================== */

async function loadConversations(){

  if(!currentUser){
    return;
  }


  const container =
    document.getElementById(
      "conversations"
    );


  const {
    data,
    error
  } =
    await sb
      .from("messages")
      .select("*")
      .or(
        `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    container.innerHTML =
      `<p>
        Ошибка загрузки чатов:<br><br>
        ${escapeHTML(error.message)}
      </p>`;

    return;

  }


  if(!data || !data.length){

    container.innerHTML =
      `<p class="muted">
        Пока нет сообщений.
      </p>`;

    return;

  }


  const users =
    new Map();


  data.forEach(message => {

    const other =
      message.sender_id === currentUser.id
        ? message.receiver_id
        : message.sender_id;


    if(!users.has(other)){

      users.set(
        other,
        message
      );

    }

  });


  const html =
    await Promise.all(

      [...users.entries()]
        .map(
          async ([userId,message]) => {

            const {
              data:profile
            } =
              await sb
                .from("profiles")
                .select("*")
                .eq("id",userId)
                .maybeSingle();


            return `
              <div
                class="chat-item"
                onclick="openChat(
                  '${escapeAttr(userId)}',
                  '${escapeAttr(
                    message.listing_id || ""
                  )}'
                )"
              >

                <div class="chat-user">

                  <img
                    class="avatar"
                    src="${
                      escapeAttr(
                        profile?.avatar_url ||
                        "https://placehold.co/100x100/21152f/c084fc?text=U"
                      )
                    }"
                  >

                  <strong>
                    ${escapeHTML(
                      profile?.nickname ||
                      "Пользователь"
                    )}
                  </strong>

                </div>

                <div class="chat-message">
                  ${escapeHTML(
                    message.message
                  )}
                </div>

                <small class="muted">
                  ${formatDate(
                    message.created_at
                  )}
                </small>

              </div>
            `;

          }
        )
    );


  container.innerHTML =
    html.join("");

}


async function openChat(
  userId,
  listingId
){

  currentChatUser =
    userId;

  currentChatListing =
    listingId || null;


  const {
    data:profile
  } =
    await sb
      .from("profiles")
      .select("*")
      .eq("id",userId)
      .maybeSingle();


  document.getElementById(
    "chatTitle"
  ).textContent =
    "Чат: " +
    (
      profile?.nickname ||
      "Пользователь"
    );


  document.getElementById(
    "chatListView"
  ).style.display =
    "none";


  document.getElementById(
    "chatWindow"
  ).classList.add("active");


  await loadMessages();

}


async function loadMessages(){

  if(
    !currentUser ||
    !currentChatUser
  ){
    return;
  }


  let query =
    sb
      .from("messages")
      .select("*")
      .or(
        `and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChatUser}),and(sender_id.eq.${currentChatUser},receiver_id.eq.${currentUser.id})`
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(currentChatListing){

    query =
      query.eq(
        "listing_id",
        currentChatListing
      );

  }


  const {
    data,
    error
  } =
    await query;


  if(error){

    console.error(error);

    return;

  }


  const box =
    document.getElementById(
      "messagesBox"
    );


  box.innerHTML =
    (data || [])
      .map(message => {

        const mine =
          message.sender_id === currentUser.id;


        return `
          <div class="message ${
            mine ? "mine" : ""
          }">

            ${escapeHTML(
              message.message
            )}

            <div class="message-time">
              ${formatDate(
                message.created_at
              )}
            </div>

          </div>
        `;

      })
      .join("");


  box.scrollTop =
    box.scrollHeight;

}


async function sendMessage(){

  if(
    !currentUser ||
    !currentChatUser
  ){
    return;
  }


  const input =
    document.getElementById(
      "messageInput"
    );


  const message =
    input.value.trim();


  if(!message){
    return;
  }


  const {
    error
  } =
    await sb
      .from("messages")
      .insert({

        listing_id:
          currentChatListing || null,

        sender_id:
          currentUser.id,

        receiver_id:
          currentChatUser,

        message:message

      });


  if(error){

    alert(
      "Ошибка отправки:\n\n" +
      error.message
    );

    return;

  }


  input.value = "";

  await loadMessages();

}


function closeChat(){

  currentChatUser = null;

  currentChatListing = null;


  document.getElementById(
    "chatWindow"
  ).classList.remove(
    "active"
  );


  document.getElementById(
    "chatListView"
  ).style.display =
    "block";


  loadConversations();

}


/* =====================================================
   ВСПОМОГАТЕЛЬНЫЕ
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttr(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");

}


function formatDate(date){

  if(!date){
    return "";
  }


  return new Date(date)
    .toLocaleString(
      "ru-RU",
      {
        day:"2-digit",
        month:"2-digit",
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}

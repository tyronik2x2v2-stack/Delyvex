<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Delyvex</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f6f8;
  color:#111;
}

header{
  height:70px;
  background:#fff;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:25px;
  font-weight:800;
  cursor:pointer;
}

nav{
  display:flex;
  gap:8px;
}

nav button,
.btn{
  border:0;
  background:#111;
  color:#fff;
  padding:10px 15px;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
}

.btn.secondary{
  background:#eee;
  color:#111;
}

.btn:hover,
nav button:hover{
  opacity:.85;
}

.user{
  display:flex;
  align-items:center;
  gap:8px;
}

#userName{
  font-weight:600;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

main{
  max-width:1100px;
  margin:30px auto;
  padding:0 15px;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.hero{
  background:#fff;
  padding:35px;
  border-radius:20px;
  margin-bottom:25px;
}

.hero h1{
  margin-top:0;
  font-size:36px;
}

.search{
  display:flex;
  gap:10px;
  margin:20px 0;
}

.search input{
  flex:1;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.card{
  background:#fff;
  border-radius:15px;
  overflow:hidden;
  border:1px solid #ddd;
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
  background:#eee;
}

.card-body{
  padding:15px;
}

.card h3{
  margin:0 0 8px;
}

.price{
  font-size:20px;
  font-weight:800;
  margin:10px 0;
}

.form{
  background:#fff;
  padding:25px;
  border-radius:18px;
  max-width:600px;
}

.form input,
.form textarea,
.form select{
  width:100%;
  padding:12px;
  margin:7px 0 15px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
}

.form textarea{
  min-height:120px;
  resize:vertical;
}

.profile-box{
  background:#fff;
  padding:25px;
  border-radius:18px;
}

.profile-header{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.profile-header img{
  width:80px;
  height:80px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.chat-layout{
  display:grid;
  grid-template-columns:320px 1fr;
  gap:15px;
  min-height:600px;
}

.conversations{
  background:#fff;
  border-radius:15px;
  padding:10px;
  border:1px solid #ddd;
}

.conversation{
  padding:12px;
  border-radius:12px;
  cursor:pointer;
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:5px;
}

.conversation:hover{
  background:#f1f1f1;
}

.conversation-avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
  flex-shrink:0;
}

.conversation-info{
  min-width:0;
}

.conversation-name{
  font-weight:700;
}

.conversation-title{
  font-size:13px;
  color:#666;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.conversation-last{
  font-size:13px;
  color:#888;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat{
  background:#fff;
  border-radius:15px;
  border:1px solid #ddd;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.chat-header{
  padding:15px;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  gap:12px;
}

.chat-header img{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.chat-header-name{
  font-weight:800;
}

.chat-header-title{
  color:#777;
  font-size:13px;
}

.messages{
  flex:1;
  padding:20px;
  overflow-y:auto;
  min-height:400px;
  max-height:500px;
}

.message{
  display:flex;
  gap:8px;
  margin-bottom:14px;
  align-items:flex-end;
}

.message.mine{
  justify-content:flex-end;
}

.message.mine .message-content{
  order:1;
  background:#111;
  color:#fff;
}

.message.mine .message-avatar{
  order:2;
}

.message-content{
  max-width:70%;
  background:#eee;
  padding:10px 13px;
  border-radius:14px;
}

.message-name{
  font-size:12px;
  font-weight:700;
  margin-bottom:4px;
  opacity:.75;
}

.message-text{
  word-break:break-word;
}

.message-time{
  font-size:10px;
  opacity:.55;
  margin-top:5px;
}

.message-avatar{
  width:32px;
  height:32px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.chat-input{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid #ddd;
}

.chat-input input{
  flex:1;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
}

.empty{
  color:#777;
  text-align:center;
  padding:40px 10px;
}

.notice{
  padding:15px;
  background:#fff4d6;
  border-radius:12px;
  margin-bottom:15px;
}

.mobile-nav{
  display:none;
}

@media(max-width:750px){

  header{
    padding:0 10px;
    height:auto;
    min-height:65px;
  }

  header nav{
    display:none;
  }

  .logo{
    font-size:21px;
  }

  .user{
    gap:5px;
  }

  #userName{
    display:none;
  }

  #messagesBtn{
    display:block;
    padding:8px 10px;
    font-size:13px;
  }

  #loginBtn,
  #logoutBtn{
    padding:8px 10px;
    font-size:13px;
  }

  main{
    margin:15px auto 80px;
  }

  .hero{
    padding:20px;
  }

  .hero h1{
    font-size:28px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .chat-layout{
    grid-template-columns:1fr;
  }

  .conversations{
    max-height:250px;
    overflow-y:auto;
  }

  .messages{
    min-height:350px;
    max-height:450px;
  }

  .message-content{
    max-width:78%;
  }

  .mobile-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:65px;
    background:#fff;
    border-top:1px solid #ddd;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:999;
  }

  .mobile-nav button{
    border:0;
    background:none;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo" onclick="showSection('home')">
    Delyvex
  </div>

  <nav>
    <button onclick="showSection('home')">Главная</button>
    <button onclick="showSection('sell')">Продать</button>
    <button onclick="showSection('messages')">💬 Сообщения</button>
    <button onclick="showSection('profile')">Профиль</button>
  </nav>

  <div class="user">

    <span id="userName"></span>

    <img
      id="headerAvatar"
      class="avatar"
      style="display:none"
      alt="avatar"
    >

    <button
      id="messagesBtn"
      class="btn secondary"
      onclick="showSection('messages')"
    >
      💬 Сообщения
    </button>

    <button
      id="loginBtn"
      class="btn"
      onclick="loginWithGoogle()"
    >
      Войти
    </button>

    <button
      id="logoutBtn"
      class="btn secondary"
      style="display:none"
      onclick="logout()"
    >
      Выйти
    </button>

  </div>

</header>


<main>

  <!-- HOME -->

  <section id="home" class="section active">

    <div class="hero">

      <h1>Покупай и продавай на Delyvex</h1>

      <p>
        Простая площадка для покупки и продажи товаров.
      </p>

      <div class="search">
        <input
          id="searchInput"
          placeholder="Поиск товаров..."
          oninput="loadListings()"
        >

        <button
          class="btn"
          onclick="showSection('sell')"
        >
          + Продать
        </button>
      </div>

    </div>

    <div id="listingsGrid" class="grid"></div>

  </section>


  <!-- SELL -->

  <section id="sell" class="section">

    <h2>Продать товар</h2>

    <div class="form">

      <label>Название</label>

      <input
        id="listingTitle"
        placeholder="Например: iPhone 13"
      >

      <label>Описание</label>

      <textarea
        id="listingDescription"
        placeholder="Опишите товар..."
      ></textarea>

      <label>Цена</label>

      <input
        id="listingPrice"
        type="number"
        step="0.01"
        placeholder="100"
      >

      <label>Изображение</label>

      <input
        id="listingImage"
        placeholder="Ссылка на изображение"
      >

      <button
        class="btn"
        onclick="createListing()"
      >
        Опубликовать
      </button>

    </div>

  </section>


  <!-- MESSAGES -->

  <section id="messages" class="section">

    <h2>💬 Сообщения</h2>

    <div
      id="loginNotice"
      class="notice"
      style="display:none"
    >
      Войдите в аккаунт, чтобы пользоваться сообщениями.
    </div>

    <div
      id="chatLayout"
      class="chat-layout"
    >

      <div class="conversations">

        <h3>Чаты</h3>

        <div id="conversationsList"></div>

      </div>


      <div class="chat">

        <div
          id="chatHeader"
          class="chat-header"
        >

          <div class="empty">
            Выберите чат
          </div>

        </div>


        <div
          id="messagesList"
          class="messages"
        >

          <div class="empty">
            Выберите чат слева
          </div>

        </div>


        <div class="chat-input">

          <input
            id="messageInput"
            placeholder="Напишите сообщение..."
            onkeydown="if(event.key==='Enter') sendMessage()"
          >

          <button
            class="btn"
            onclick="sendMessage()"
          >
            Отправить
          </button>

        </div>

      </div>

    </div>

  </section>


  <!-- PROFILE -->

  <section id="profile" class="section">

    <h2>Профиль</h2>

    <div class="profile-box">

      <div class="profile-header">

        <img
          id="profileAvatar"
          alt="avatar"
        >

        <div>
          <h3 id="profileName">Гость</h3>
          <div id="profileEmail"></div>
        </div>

      </div>

      <div class="form">

        <label>Никнейм</label>

        <input
          id="profileNickname"
          placeholder="Ваш никнейм"
        >

        <label>Ссылка на аватар</label>

        <input
          id="profileAvatarInput"
          placeholder="https://..."
        >

        <button
          class="btn"
          onclick="saveProfile()"
        >
          Сохранить профиль
        </button>

      </div>

    </div>

  </section>

</main>


<!-- MOBILE NAV -->

<div class="mobile-nav">

  <button onclick="showSection('home')">
    🏠
    <span>Главная</span>
  </button>

  <button onclick="showSection('sell')">
    ➕
    <span>Продать</span>
  </button>

  <button onclick="showSection('messages')">
    💬
    <span>Чаты</span>
  </button>

  <button onclick="showSection('profile')">
    👤
    <span>Профиль</span>
  </button>

</div>


<script>

const SUPABASE_URL =
"https://gisdufgixjfudblxydvm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_irNKt_PStZrQ2NCEdaD5sg_quCmigAn";

const sb =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const GITHUB_URL =
"https://tyronik2x2v2-stack.github.io/Delyvex/";


let currentUser = null;

let currentChat = {
  listingId:null,
  otherUserId:null
};

let currentChatProfiles = {
  me:null,
  other:null
};

let chatSubscription = null;


/* =========================
   NAVIGATION
========================= */

function showSection(id){

  document
    .querySelectorAll(".section")
    .forEach(section=>{
      section.classList.remove("active");
    });

  const section =
    document.getElementById(id);

  if(section){
    section.classList.add("active");
  }

  if(id === "home"){
    loadListings();
  }

  if(id === "messages"){
    loadConversations();
  }

  if(id === "profile"){
    loadProfile();
  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =========================
   AUTH
========================= */

async function loginWithGoogle(){

  try{

    const result =
      await sb.auth.signInWithOAuth({
        provider:"google",

        options:{
          redirectTo:GITHUB_URL,
          skipBrowserRedirect:false,

          queryParams:{
            access_type:"offline",
            prompt:"select_account"
          }
        }
      });

    if(result.error){

      console.error(
        "Google OAuth error:",
        result.error
      );

      alert(
        "Ошибка входа:\n\n"+
        result.error.message
      );
    }

  }catch(error){

    console.error(error);

    alert(
      "Ошибка входа:\n\n"+
      error.message
    );
  }
}


async function logout(){

  await sb.auth.signOut();

  currentUser = null;

  updateAuthUI();

  showSection("home");
}


async function checkAuth(){

  const {
    data:{
      session
    }
  } = await sb.auth.getSession();

  currentUser =
    session?.user || null;

  updateAuthUI();

  sb.auth.onAuthStateChange(
    async (event,session)=>{

      currentUser =
        session?.user || null;

      updateAuthUI();

    }
  );
}


/* =========================
   AUTH UI
========================= */

async function updateAuthUI(){

  const loginBtn =
    document.getElementById("loginBtn");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const messagesBtn =
    document.getElementById("messagesBtn");

  const userName =
    document.getElementById("userName");

  const headerAvatar =
    document.getElementById("headerAvatar");


  if(!currentUser){

    loginBtn.style.display="block";
    logoutBtn.style.display="none";

    messagesBtn.style.display="none";

    userName.textContent="";

    headerAvatar.style.display="none";

    return;
  }


  loginBtn.style.display="none";
  logoutBtn.style.display="block";

  messagesBtn.style.display="block";


  const profile =
    await getProfile(
      currentUser.id
    );


  userName.textContent =
    profileName(
      profile,
      currentUser
    );


  const avatar =
    profileAvatar(
      profile,
      currentUser
    );


  if(avatar){

    headerAvatar.src = avatar;

    headerAvatar.style.display="block";

  }else{

    headerAvatar.style.display="none";
  }
}


/* =========================
   PROFILES
========================= */

async function getProfile(userId){

  const {
    data,
    error
  } = await sb
    .from("profiles")
    .select("*")
    .eq("id",userId)
    .maybeSingle();

  if(error){

    console.error(
      "Profile error:",
      error
    );

    return null;
  }

  return data;
}


function profileName(profile,user){

  if(profile){

    return (
      profile.nickname ||
      profile.username ||
      profile.name ||
      profile.full_name ||
      user?.user_metadata?.full_name ||
      user?.email?.split("@")[0] ||
      "Пользователь"
    );
  }

  return (
    user?.user_metadata?.full_name ||
    user?.email?.split("@")[0] ||
    "Пользователь"
  );
}


function profileAvatar(profile,user){

  return (
    profile?.avatar_url ||
    profile?.avatar ||
    user?.user_metadata?.avatar_url ||
    user?.user_metadata?.picture ||
    ""
  );
}


/* =========================
   LISTINGS
========================= */

async function loadListings(){

  const grid =
    document.getElementById(
      "listingsGrid"
    );

  const search =
    document.getElementById(
      "searchInput"
    )?.value
    ?.trim()
    ?.toLowerCase() || "";


  let query =
    sb
      .from("listings")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );


  const {
    data,
    error
  } =
    await query;


  if(error){

    console.error(error);

    grid.innerHTML =
      `<div class="empty">
        Ошибка загрузки товаров
      </div>`;

    return;
  }


  const filtered =
    (data || []).filter(item=>{

      if(!search){
        return true;
      }

      return (
        String(item.title || "")
          .toLowerCase()
          .includes(search)
        ||
        String(item.description || "")
          .toLowerCase()
          .includes(search)
      );

    });


  if(filtered.length===0){

    grid.innerHTML =
      `<div class="empty">
        Товаров пока нет
      </div>`;

    return;
  }


  grid.innerHTML =
    filtered
      .map(item=>createListingHTML(item))
      .join("");
}


function createListingHTML(item){

  const image =
    item.image_url ||
    item.image ||
    "https://via.placeholder.com/600x400?text=Delyvex";


  const price =
    item.price != null
      ? `${item.price} €`
      : "Цена не указана";


  return `
    <div class="card">

      <img
        src="${escapeHTML(image)}"
        alt=""
      >

      <div class="card-body">

        <h3>
          ${escapeHTML(item.title || "Без названия")}
        </h3>

        <div>
          ${escapeHTML(
            item.description || ""
          )}
        </div>

        <div class="price">
          ${escapeHTML(price)}
        </div>

        <button
          class="btn"
          onclick="openChat(${Number(item.id)})"
        >
          💬 Написать продавцу
        </button>

      </div>

    </div>
  `;
}


/* =========================
   SELL
========================= */

async function createListing(){

  if(!currentUser){

    alert(
      "Сначала войдите в аккаунт."
    );

    return;
  }


  const title =
    document.getElementById(
      "listingTitle"
    ).value.trim();

  const description =
    document.getElementById(
      "listingDescription"
    ).value.trim();

  const price =
    document.getElementById(
      "listingPrice"
    ).value;

  const image =
    document.getElementById(
      "listingImage"
    ).value.trim();


  if(!title){

    alert(
      "Введите название товара."
    );

    return;
  }


  const {
    error
  } =
    await sb
      .from("listings")
      .insert({

        title:title,

        description:description,

        price:
          price
            ? Number(price)
            : null,

        image_url:image,

        seller_id:
          currentUser.id

      });


  if(error){

    console.error(error);

    alert(
      "Ошибка публикации:\n\n"+
      error.message
    );

    return;
  }


  alert(
    "Товар опубликован!"
  );


  document.getElementById(
    "listingTitle"
  ).value="";

  document.getElementById(
    "listingDescription"
  ).value="";

  document.getElementById(
    "listingPrice"
  ).value="";

  document.getElementById(
    "listingImage"
  ).value="";


  showSection("home");
}


/* =========================
   OPEN CHAT FROM LISTING
========================= */

async function openChat(listingId){

  if(!currentUser){

    alert(
      "Чтобы написать продавцу, сначала войдите."
    );

    return;
  }


  const {
    data:listing,
    error
  } =
    await sb
      .from("listings")
      .select("*")
      .eq("id",listingId)
      .single();


  if(error){

    alert(
      "Не удалось открыть товар."
    );

    return;
  }


  if(
    listing.seller_id ===
    currentUser.id
  ){

    alert(
      "Это ваш товар. Откройте раздел «Сообщения», чтобы посмотреть чаты с покупателями."
    );

    showSection("messages");

    return;
  }


  currentChat = {

    listingId:listingId,

    otherUserId:
      listing.seller_id

  };


  showSection("messages");

  await openCurrentChat();
}


/* =========================
   OPEN EXISTING CHAT
========================= */

async function openConversation(
  listingId,
  otherUserId
){

  if(!currentUser){
    return;
  }


  currentChat = {

    listingId:
      Number(listingId),

    otherUserId:
      otherUserId

  };


  await openCurrentChat();
}


async function openCurrentChat(){

  if(
    !currentUser ||
    !currentChat.listingId ||
    !currentChat.otherUserId
  ){

    return;
  }


  const me =
    await getProfile(
      currentUser.id
    );

  const other =
    await getProfile(
      currentChat.otherUserId
    );


  currentChatProfiles = {

    me:me,

    other:other

  };


  const otherUser =
    {
      id:
        currentChat.otherUserId
    };


  const name =
    profileName(
      other,
      otherUser
    );


  const avatar =
    profileAvatar(
      other,
      otherUser
    );


  const header =
    document.getElementById(
      "chatHeader"
    );


  header.innerHTML = `

    ${
      avatar
      ?
      `<img src="${escapeHTML(avatar)}">`
      :
      `<img src="https://via.placeholder.com/80">`
    }

    <div>

      <div class="chat-header-name">
        ${escapeHTML(name)}
      </div>

      <div class="chat-header-title">
        Чат по объявлению
      </div>

    </div>

  `;


  await loadChat();

  subscribeChat();
}


/* =========================
   LOAD CHAT
========================= */

async function loadChat(){

  const box =
    document.getElementById(
      "messagesList"
    );


  if(
    !currentUser ||
    !currentChat.listingId ||
    !currentChat.otherUserId
  ){

    box.innerHTML =
      `<div class="empty">
        Выберите чат
      </div>`;

    return;
  }


  const {
    data,
    error
  } =
    await sb
      .from("messages")
      .select("*")
      .eq(
        "listing_id",
        currentChat.listingId
      )
      .or(
        `and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChat.otherUserId}),and(sender_id.eq.${currentChat.otherUserId},receiver_id.eq.${currentUser.id})`
      )
      .order(
        "created_at",
        {ascending:true}
      );


  if(error){

    console.error(error);

    box.innerHTML =
      `<div class="empty">
        Ошибка загрузки сообщений
      </div>`;

    return;
  }


  if(!data || data.length===0){

    box.innerHTML =
      `<div class="empty">
        Сообщений пока нет. Напишите первым!
      </div>`;

    return;
  }


  const userIds =
    [
      ...new Set(
        data.flatMap(message=>[
          message.sender_id,
          message.receiver_id
        ])
      )
    ];


  const {
    data:profiles
  } =
    await sb
      .from("profiles")
      .select("*")
      .in("id",userIds);


  const profileMap = {};

  (profiles || []).forEach(profile=>{

    profileMap[profile.id] =
      profile;

  });


  box.innerHTML =
    data
      .map(message=>
        createMessageHTML(
          message,
          profileMap
        )
      )
      .join("");


  box.scrollTop =
    box.scrollHeight;
}


/* =========================
   MESSAGE HTML
========================= */

function createMessageHTML(
  message,
  profileMap
){

  const mine =
    message.sender_id ===
    currentUser.id;


  const senderProfile =
    profileMap[
      message.sender_id
    ];


  const receiverProfile =
    profileMap[
      message.receiver_id
    ];


  const user =
    mine
      ? currentUser
      : {
          id:message.sender_id
        };


  const name =
    profileName(
      senderProfile,
      user
    );


  const avatar =
    profileAvatar(
      senderProfile,
      user
    );


  const time =
    new Date(
      message.created_at
    ).toLocaleTimeString(
      "ru-RU",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );


  return `

    <div class="message ${mine ? "mine" : ""}">

      ${
        avatar
        ?
        `<img
          class="message-avatar"
          src="${escapeHTML(avatar)}"
        >`
        :
        `<img
          class="message-avatar"
          src="https://via.placeholder.com/50"
        >`
      }

      <div class="message-content">

        <div class="message-name">
          ${escapeHTML(name)}
        </div>

        <div class="message-text">
          ${escapeHTML(
            message.message
          )}
        </div>

        <div class="message-time">
          ${time}
        </div>

      </div>

    </div>

  `;
}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  if(!currentUser){

    alert(
      "Сначала войдите в аккаунт."
    );

    return;
  }


  if(
    !currentChat.listingId ||
    !currentChat.otherUserId
  ){

    alert(
      "Сначала выберите чат."
    );

    return;
  }


  const input =
    document.getElementById(
      "messageInput"
    );


  const text =
    input.value.trim();


  if(!text){
    return;
  }


  input.disabled=true;


  const {
    error
  } =
    await sb
      .from("messages")
      .insert({

        listing_id:
          currentChat.listingId,

        sender_id:
          currentUser.id,

        receiver_id:
          currentChat.otherUserId,

        message:text

      });


  input.disabled=false;


  if(error){

    console.error(error);

    alert(
      "Не удалось отправить сообщение:\n\n"+
      error.message
    );

    return;
  }


  input.value="";

  await loadChat();
}


/* =========================
   REALTIME CHAT
========================= */

function subscribeChat(){

  if(chatSubscription){

    sb.removeChannel(
      chatSubscription
    );

    chatSubscription=null;
  }


  if(
    !currentUser ||
    !currentChat.listingId
  ){

    return;
  }


  chatSubscription =
    sb
      .channel(
        "chat-" +
        currentChat.listingId +
        "-" +
        currentUser.id
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:
            `listing_id=eq.${currentChat.listingId}`
        },
        async payload=>{

          const message =
            payload.new;


          if(
            (
              message.sender_id ===
              currentUser.id &&
              message.receiver_id ===
              currentChat.otherUserId
            )
            ||
            (
              message.sender_id ===
              currentChat.otherUserId &&
              message.receiver_id ===
              currentUser.id
            )
          ){

            await loadChat();
          }

        }
      )
      .subscribe();
}


/* =========================
   LOAD CONVERSATIONS
========================= */

async function loadConversations(){

  const list =
    document.getElementById(
      "conversationsList"
    );


  if(!currentUser){

    document.getElementById(
      "loginNotice"
    ).style.display="block";

    list.innerHTML =
      `<div class="empty">
        Войдите, чтобы увидеть чаты.
      </div>`;

    return;
  }


  document.getElementById(
    "loginNotice"
  ).style.display="none";


  const {
    data:messages,
    error
  } =
    await sb
      .from("messages")
      .select("*")
      .or(
        `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
      )
      .order(
        "created_at",
        {ascending:false}
      );


  if(error){

    console.error(error);

    list.innerHTML =
      `<div class="empty">
        Ошибка загрузки чатов.
      </div>`;

    return;
  }


  if(!messages || messages.length===0){

    list.innerHTML =
      `<div class="empty">
        Пока нет сообщений.
      </div>`;

    return;
  }


  const conversations =
    new Map();


  for(const message of messages){

    const otherUserId =
      message.sender_id === currentUser.id
        ? message.receiver_id
        : message.sender_id;


    const key =
      `${message.listing_id}_${otherUserId}`;


    if(!conversations.has(key)){

      conversations.set(
        key,
        {
          listingId:
            message.listing_id,

          otherUserId:
            otherUserId,

          message:
            message.message,

          createdAt:
            message.created_at
        }
      );

    }

  }


  const conversationArray =
    Array.from(
      conversations.values()
    );


  const userIds =
    conversationArray.map(
      item=>item.otherUserId
    );


  const listingIds =
    conversationArray
      .map(
        item=>item.listingId
      )
      .filter(Boolean);


  const {
    data:profiles
  } =
    await sb
      .from("profiles")
      .select("*")
      .in(
        "id",
        userIds
      );


  const {
    data:listings
  } =
    listingIds.length
    ?
    await sb
      .from("listings")
      .select("*")
      .in(
        "id",
        listingIds
      )
    :
    {data:[]};


  const profileMap={};

  (profiles || []).forEach(profile=>{

    profileMap[profile.id]=profile;

  });


  const listingMap={};

  (listings || []).forEach(listing=>{

    listingMap[listing.id]=listing;

  });


  list.innerHTML =
    conversationArray
      .map(item=>{

        const profile =
          profileMap[
            item.otherUserId
          ];


        const user =
          {
            id:item.otherUserId
          };


        const name =
          profileName(
            profile,
            user
          );


        const avatar =
          profileAvatar(
            profile,
            user
          );


        const listing =
          listingMap[
            item.listingId
          ];


        const title =
          listing?.title ||
          "Объявление";


        const date =
          new Date(
            item.createdAt
          ).toLocaleString(
            "ru-RU",
            {
              day:"2-digit",
              month:"2-digit",
              hour:"2-digit",
              minute:"2-digit"
            }
          );


        return `

          <div
            class="conversation"
            data-listing-id="${Number(item.listingId)}"
            data-user-id="${escapeHTML(item.otherUserId)}"
            onclick="openConversationFromElement(this)"
          >

            ${
              avatar
              ?
              `<img
                class="conversation-avatar"
                src="${escapeHTML(avatar)}"
              >`
              :
              `<img
                class="conversation-avatar"
                src="https://via.placeholder.com/60"
              >`
            }

            <div class="conversation-info">

              <div class="conversation-name">
                ${escapeHTML(name)}
              </div>

              <div class="conversation-title">
                ${escapeHTML(title)}
              </div>

              <div class="conversation-last">
                ${escapeHTML(item.message)}
              </div>

              <div class="conversation-last">
                ${date}
              </div>

            </div>

          </div>

        `;

      })
      .join("");
}


async function openConversationFromElement(element){

  const listingId =
    element.dataset.listingId;

  const userId =
    element.dataset.userId;


  await openConversation(
    listingId,
    userId
  );
}

/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

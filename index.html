<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Delyvex</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0b0812;
  color:#fff;
  font-family:Arial,sans-serif;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
AUTH
========================= */

#authGate{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#0b0812;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.auth-box{
  width:100%;
  max-width:420px;
  background:#130d1f;
  border:1px solid #2b1b3d;
  border-radius:24px;
  padding:35px 25px;
  text-align:center;
}

.logo{
  font-size:36px;
  font-weight:900;
  color:#c084fc;
  margin-bottom:10px;
}

.auth-box p{
  color:#aaa;
  line-height:1.5;
  margin-bottom:25px;
}

.google-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:13px;
  background:#fff;
  color:#111;
  font-weight:700;
}

/* =========================
HEADER
========================= */

header{
  height:70px;
  background:#100b1a;
  border-bottom:1px solid #241733;
  display:flex;
  align-items:center;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:100;
}

.header-logo{
  color:#c084fc;
  font-size:24px;
  font-weight:900;
}

.header-nav{
  display:flex;
  gap:5px;
  margin-left:auto;
}

.nav-btn{
  background:transparent;
  color:#ddd;
  border:0;
  padding:10px 13px;
  border-radius:10px;
}

.nav-btn:hover{
  background:#21152e;
}

.header-profile{
  margin-left:10px;
}

.header-avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #8b5cf6;
}

/* =========================
MAIN
========================= */

main{
  max-width:1100px;
  margin:auto;
  padding:25px 18px 100px;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.page-title{
  font-size:28px;
  margin:0 0 20px;
}

/* =========================
SEARCH
========================= */

.search-box{
  display:flex;
  gap:10px;
  margin-bottom:25px;
}

.search-box input{
  flex:1;
  min-width:0;
  background:#130d1f;
  border:1px solid #30203f;
  color:#fff;
  border-radius:13px;
  padding:14px;
  outline:none;
}

/* =========================
BUTTONS
========================= */

.primary-btn{
  border:0;
  background:#8b5cf6;
  color:#fff;
  padding:13px 18px;
  border-radius:12px;
  font-weight:700;
}

.primary-btn:hover{
  background:#7c3aed;
}

.chat-btn{
  border:1px solid #8b5cf6;
  background:#241733;
  color:#fff;
  padding:13px 18px;
  border-radius:12px;
  font-weight:700;
}

.chat-btn:hover{
  background:#35204d;
}

/* =========================
CARDS
========================= */

.card{
  background:#130d1f;
  border:1px solid #241733;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
}

.listing-card{
  display:flex;
  gap:18px;
}

.listing-image{
  width:180px;
  height:180px;
  border-radius:14px;
  object-fit:cover;
  background:#0b0812;
  flex-shrink:0;
}

.listing-info{
  flex:1;
}

.listing-title{
  font-size:20px;
  font-weight:800;
  margin-bottom:8px;
}

.game-tag{
  display:inline-block;
  background:#28183b;
  color:#c084fc;
  border-radius:8px;
  padding:5px 9px;
  font-size:13px;
  margin-bottom:10px;
}

.description{
  color:#aaa;
  line-height:1.5;
}

.price{
  font-size:21px;
  font-weight:900;
  color:#c084fc;
  margin-top:10px;
}

/* =========================
SELLER
========================= */

.seller-info{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid #241733;
}

.seller-name{
  color:#fff;
  font-weight:700;
}

.seller-rating{
  color:#fbbf24;
  font-size:14px;
}

.listing-actions{
  display:flex;
  gap:8px;
  margin-top:14px;
  flex-wrap:wrap;
}

/* =========================
FORMS
========================= */

.form-card{
  max-width:650px;
  margin:auto;
}

.form-group{
  margin-bottom:17px;
}

.form-group label{
  display:block;
  margin-bottom:7px;
  color:#c084fc;
  font-weight:700;
}

.form-group input,
.form-group textarea{
  width:100%;
  background:#0b0812;
  color:#fff;
  border:1px solid #30203f;
  border-radius:12px;
  padding:13px;
  outline:none;
}

.form-group textarea{
  min-height:130px;
  resize:vertical;
}

.product-preview{
  width:100%;
  max-height:300px;
  object-fit:contain;
  background:#0b0812;
  border-radius:14px;
  margin-top:12px;
  border:1px solid #30203f;
}

/* =========================
PROFILE
========================= */

.profile-card{
  max-width:700px;
  margin:auto;
}

.profile-top{
  display:flex;
  align-items:center;
  gap:20px;
  margin-bottom:25px;
}

.profile-avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #8b5cf6;
}

.profile-name{
  font-size:24px;
  font-weight:800;
}

.profile-email{
  color:#999;
  margin-top:5px;
}

/* =========================
RATING
========================= */

.rating-box{
  background:#100b1a;
  border:1px solid #2b1b3d;
  border-radius:15px;
  padding:16px;
  margin-bottom:22px;
  text-align:center;
}

.rating-number{
  font-size:32px;
  font-weight:900;
  color:#c084fc;
}

.rating-stars{
  font-size:27px;
  color:#fbbf24;
  letter-spacing:3px;
  margin:5px 0;
}

.rating-count{
  color:#999;
}

/* =========================
AVATARS
========================= */

.avatar-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  margin-top:12px;
}

.avatar-option{
  width:100%;
  aspect-ratio:1;
  border-radius:50%;
  border:3px solid transparent;
  padding:3px;
  background:#0b0812;
  transition:.15s;
}

.avatar-option:hover{
  transform:scale(1.06);
  border-color:#8b5cf6;
}

.avatar-option.selected{
  border-color:#c084fc;
  box-shadow:0 0 18px rgba(168,85,247,.45);
}

.avatar-option img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  display:block;
}

.selected-avatar{
  display:flex;
  justify-content:center;
  margin:20px 0;
}

.selected-avatar img{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #8b5cf6;
}

/* =========================
CHATS
========================= */

.chat-item{
  background:#130d1f;
  border:1px solid #241733;
  padding:16px;
  border-radius:15px;
  cursor:pointer;
  margin-bottom:10px;
}

.chat-item:hover{
  border-color:#8b5cf6;
}

.chat-window{
  max-width:750px;
  margin:auto;
}

.chat-messages{
  min-height:350px;
  max-height:500px;
  overflow-y:auto;
  background:#100b1a;
  border:1px solid #241733;
  border-radius:16px;
  padding:15px;
  margin-bottom:12px;
}

.message{
  max-width:75%;
  padding:10px 13px;
  border-radius:14px;
  margin-bottom:10px;
  line-height:1.4;
}

.message.mine{
  margin-left:auto;
  background:#6d3cc7;
}

.message.theirs{
  background:#241733;
}

.chat-send{
  display:flex;
  gap:8px;
}

.chat-send input{
  flex:1;
  background:#130d1f;
  color:#fff;
  border:1px solid #30203f;
  border-radius:12px;
  padding:13px;
}

.empty{
  text-align:center;
  color:#777;
  padding:50px 20px;
}

/* =========================
MOBILE
========================= */

.mobile-nav{
  display:none;
}

@media(max-width:700px){

  header{
    height:60px;
    padding:0 15px;
  }

  .header-logo{
    font-size:21px;
  }

  .header-nav{
    display:none;
  }

  .header-profile{
    margin-left:auto;
  }

  main{
    padding:20px 13px 90px;
  }

  .listing-card{
    flex-direction:column;
  }

  .listing-image{
    width:100%;
    height:220px;
  }

  .avatar-grid{
    grid-template-columns:repeat(4,1fr);
  }

  .mobile-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:65px;
    background:#100b1a;
    border-top:1px solid #241733;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:500;
  }

  .mobile-nav button{
    background:none;
    border:0;
    color:#aaa;
    font-size:12px;
  }

  .mobile-nav button span{
    display:block;
    font-size:20px;
    margin-bottom:2px;
  }

  .search-box{
    flex-direction:column;
  }

}

</style>
</head>

<body>

<!-- AUTH -->

<div id="authGate">

  <div class="auth-box">

    <div class="logo">
      Delyvex
    </div>

    <p>
      Войди в аккаунт, чтобы пользоваться Delyvex
    </p>

    <button
      class="google-btn"
      onclick="loginWithGoogle()"
    >
      Продолжить через Google
    </button>

  </div>

</div>


<!-- HEADER -->

<header>

  <div class="header-logo">
    Delyvex
  </div>

  <div class="header-nav">

    <button
      class="nav-btn"
      onclick="showSection('home')"
    >
      Главная
    </button>

    <button
      class="nav-btn"
      onclick="showSection('sell')"
    >
      ➕ Продать
    </button>

    <button
      class="nav-btn"
      onclick="showSection('chats')"
    >
      💬 Чаты
    </button>

    <button
      class="nav-btn"
      onclick="showSection('profile')"
    >
      👤 Профиль
    </button>

  </div>

  <div class="header-profile">

    <img
      id="headerAvatar"
      class="header-avatar hidden"
      src=""
      alt=""
    >

  </div>

</header>


<main>

<!-- HOME -->

<section id="home" class="section active">

  <h1 class="page-title">
    Найти объявление
  </h1>

  <div class="search-box">

    <input
      id="searchInput"
      type="text"
      placeholder="Игра, название или описание..."
      oninput="searchListings()"
    >

    <button
      class="primary-btn"
      onclick="searchListings()"
    >
      Найти
    </button>

  </div>

  <div id="listingsContainer"></div>

</section>


<!-- SELL -->

<section id="sell" class="section">

  <h1 class="page-title">
    Продать
  </h1>

  <div class="card form-card">

    <div class="form-group">

      <label>
        Игра
      </label>

      <input
        id="sellGame"
        type="text"
        placeholder="Например: Minecraft"
      >

    </div>

    <div class="form-group">

      <label>
        Название товара
      </label>

      <input
        id="sellTitle"
        type="text"
        placeholder="Название товара"
      >

    </div>

    <div class="form-group">

      <label>
        Описание
      </label>

      <textarea
        id="sellDescription"
        placeholder="Опиши товар..."
      ></textarea>

    </div>

    <div class="form-group">

      <label>
        Цена
      </label>

      <input
        id="sellPrice"
        type="number"
        min="0"
        placeholder="100"
      >

    </div>

    <div class="form-group">

      <label>
        Картинка товара
      </label>

      <input
        id="sellImageFile"
        type="file"
        accept="image/*"
        onchange="previewProductImage()"
      >

      <img
        id="productImagePreview"
        class="product-preview hidden"
        alt="Предпросмотр"
      >

    </div>

    <button
      class="primary-btn"
      onclick="createListing()"
    >
      Опубликовать
    </button>

  </div>

</section>


<!-- CHATS -->

<section id="chats" class="section">

  <h1 class="page-title">
    Чаты
  </h1>

  <div id="chatsContainer"></div>

</section>


<!-- PROFILE -->

<section id="profile" class="section">

  <h1 class="page-title">
    Профиль
  </h1>

  <div class="card profile-card">

    <div class="profile-top">

      <img
        id="profileAvatar"
        class="profile-avatar"
        src=""
        alt=""
      >

      <div>

        <div
          id="profileNickname"
          class="profile-name"
        >
          Пользователь
        </div>

        <div
          id="profileEmail"
          class="profile-email"
        ></div>

      </div>

    </div>

    <div class="rating-box">

      <div
        id="profileRating"
        class="rating-number"
      >
        0.0
      </div>

      <div
        id="profileStars"
        class="rating-stars"
      >
        ☆☆☆☆☆
      </div>

      <div
        id="profileReviewCount"
        class="rating-count"
      >
        0 отзывов
      </div>

    </div>

    <div class="form-group">

      <label>
        Никнейм
      </label>

      <input
        id="nicknameInput"
        type="text"
        maxlength="30"
        placeholder="Введите никнейм"
      >

    </div>

    <div class="form-group">

      <label>
        Выбери аватар
      </label>

      <div
        id="avatarGrid"
        class="avatar-grid"
      ></div>

    </div>

    <div class="selected-avatar">

      <img
        id="selectedAvatarPreview"
        src=""
        alt=""
      >

    </div>

    <button
      class="primary-btn"
      onclick="saveProfile()"
    >
      Сохранить профиль
    </button>

    <button
      class="primary-btn"
      style="
        margin-top:10px;
        background:#241733;
      "
      onclick="logout()"
    >
      Выйти
    </button>

  </div>

</section>


<!-- CHAT WINDOW -->

<section id="chatWindow" class="section">

  <div class="chat-window">

    <button
      class="nav-btn"
      onclick="showSection('chats')"
    >
      ← Назад
    </button>

    <h2 id="chatTitle">
      Чат
    </h2>

    <div
      id="chatMessages"
      class="chat-messages"
    ></div>

    <div class="chat-send">

      <input
        id="chatInput"
        type="text"
        placeholder="Написать сообщение..."
        onkeydown="
          if(event.key==='Enter'){
            sendMessage()
          }
        "
      >

      <button
        class="primary-btn"
        onclick="sendMessage()"
      >
        Отправить
      </button>

    </div>

  </div>

</section>

</main>


<!-- MOBILE NAV -->

<div class="mobile-nav">

  <button onclick="showSection('home')">
    <span>⌂</span>
    Главная
  </button>

  <button onclick="showSection('sell')">
    <span>＋</span>
    Продать
  </button>

  <button onclick="showSection('chats')">
    <span>💬</span>
    Чаты
  </button>

  <button onclick="showSection('profile')">
    <span>👤</span>
    Профиль
  </button>

</div>


<script>

/* =========================
SUPABASE
========================= */

const SUPABASE_URL =
"https://gisdufgixjfudblxydvm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_irNKt_PStZrQ2NCEdaD5sg_quCmigAn";

const sb =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const GITHUB_URL =
"https://tyronik2x2v2-stack.github.io/Delyvex/";


/* =========================
STATE
========================= */

let currentUser = null;

let listings = [];

let selectedAvatar = null;

let selectedProductImage = null;

let currentChat = null;

let currentReceiver = null;

let currentListing = null;


/* =========================
AVATARS
========================= */

function makeAvatar(bg,face){

  const svg = `
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 100 100"
  >

    <circle
      cx="50"
      cy="50"
      r="48"
      fill="${bg}"
    />

    <circle
      cx="50"
      cy="39"
      r="20"
      fill="#ffffff"
    />

    <path
      d="M18 88
      C21 67 34 57 50 57
      C66 57 79 67 82 88"
      fill="#ffffff"
    />

    <circle
      cx="43"
      cy="39"
      r="3"
      fill="${face}"
    />

    <circle
      cx="57"
      cy="39"
      r="3"
      fill="${face}"
    />

    <path
      d="M43 48 Q50 53 57 48"
      stroke="${face}"
      stroke-width="3"
      fill="none"
      stroke-linecap="round"
    />

  </svg>`;

  return (
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(svg)
  );
}


const AVATARS = [

  makeAvatar("#8b5cf6","#4c1d95"),
  makeAvatar("#ec4899","#831843"),
  makeAvatar("#3b82f6","#1e3a8a"),
  makeAvatar("#10b981","#064e3b"),
  makeAvatar("#f59e0b","#78350f"),

  makeAvatar("#ef4444","#7f1d1d"),
  makeAvatar("#06b6d4","#164e63"),
  makeAvatar("#84cc16","#365314"),
  makeAvatar("#a855f7","#581c87"),
  makeAvatar("#f97316","#7c2d12"),

  makeAvatar("#14b8a6","#134e4a"),
  makeAvatar("#e11d48","#881337"),
  makeAvatar("#6366f1","#312e81"),
  makeAvatar("#0ea5e9","#0c4a6e"),
  makeAvatar("#7c3aed","#4c1d95"),

  makeAvatar("#db2777","#831843"),
  makeAvatar("#059669","#064e3b"),
  makeAvatar("#ca8a04","#713f12"),
  makeAvatar("#dc2626","#7f1d1d"),
  makeAvatar("#4f46e5","#312e81")

];

selectedAvatar =
AVATARS[0];


/* =========================
GOOGLE LOGIN
========================= */

async function loginWithGoogle(){

  try{

    const result =
      await sb.auth.signInWithOAuth({

        provider:"google",

        options:{
          redirectTo:GITHUB_URL,

          skipBrowserRedirect:false,

          queryParams:{
            access_type:"offline",
            prompt:"select_account"
          }

        }

      });

    if(result.error){

      alert(
        "Ошибка входа:\n\n" +
        result.error.message
      );

    }

  }catch(error){

    alert(
      "Ошибка входа:\n\n" +
      error.message
    );

  }

}


/* =========================
AUTH
========================= */

function showAuthGate(){

  document
    .getElementById("authGate")
    .classList.remove("hidden");

}

function hideAuthGate(){

  document
    .getElementById("authGate")
    .classList.add("hidden");

}


/* =========================
INITIALIZE
========================= */

async function initialize(){

  const {
    data,
    error
  } =
    await sb.auth.getSession();

  if(error){

    console.error(error);

    return;

  }

  if(!data.session){

    showAuthGate();

    return;

  }

  currentUser =
    data.session.user;

  hideAuthGate();

  await loadProfile();

  await loadListings();

  renderAvatars();

}


sb.auth.onAuthStateChange(
  async(event,session)=>{

    if(session){

      currentUser =
        session.user;

      hideAuthGate();

      await loadProfile();

      await loadListings();

      renderAvatars();

    }else{

      currentUser =
        null;

      showAuthGate();

    }

  }
);


/* =========================
NAVIGATION
========================= */

function showSection(section){

  if(!currentUser){

    showAuthGate();

    return;

  }

  document
    .querySelectorAll(".section")
    .forEach(
      el =>
        el.classList.remove("active")
    );

  const target =
    document.getElementById(section);

  if(target){

    target.classList.add("active");

  }

  if(section === "chats"){

    loadChats();

  }

  if(section === "profile"){

    loadProfile();

    renderAvatars();

  }

}


/* =========================
PROFILE
========================= */

async function loadProfile(){

  if(!currentUser){

    return;

  }

  const {
    data,
    error
  } =
    await sb
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(error){

    console.error(error);

  }

  const nickname =
    data?.nickname ||
    currentUser.user_metadata?.full_name ||
    currentUser.user_metadata?.name ||
    "Пользователь";

  let avatar =
    data?.avatar_url;

  if(
    !avatar ||
    !avatar.startsWith("data:image")
  ){

    avatar =
      AVATARS[0];

  }

  selectedAvatar =
    avatar;

  document.getElementById(
    "nicknameInput"
  ).value =
    nickname;

  document.getElementById(
    "profileNickname"
  ).textContent =
    nickname;

/* =========================
PROFILE RATING
========================= */

async function loadProfileRating(userId){

  const {
    data,
    error
  } =
    await sb
      .from("reviews")
      .select("rating")
      .eq(
        "seller_id",
        userId
      );

  if(error){

    console.error(error);

    return;

  }

  const reviews =
    data || [];

  const count =
    reviews.length;

  let average = 0;

  if(count){

    average =
      reviews.reduce(
        (sum,item)=>
          sum + Number(item.rating),
        0
      ) / count;

  }

  average =
    Math.round(
      average * 10
    ) / 10;

  const rounded =
    Math.round(average);

  const stars =
    "★".repeat(rounded) +
    "☆".repeat(
      5 - rounded
    );

  document.getElementById(
    "profileRating"
  ).textContent =
    average.toFixed(1);

  document.getElementById(
    "profileStars"
  ).textContent =
    stars;

  document.getElementById(
    "profileReviewCount"
  ).textContent =
    getReviewText(count);

}


/* =========================
REVIEW TEXT
========================= */

function getReviewText(count){

  if(count === 0){

    return "0 отзывов";

  }

  if(count === 1){

    return "1 отзыв";

  }

  if(
    count >= 2 &&
    count <= 4
  ){

    return `${count} отзыва`;

  }

  return `${count} отзывов`;

}


/* =========================
PRODUCT IMAGE
========================= */

function previewProductImage(){

  const input =
    document.getElementById(
      "sellImageFile"
    );

  const file =
    input.files[0];

  if(!file){

    selectedProductImage =
      null;

    return;

  }

  if(!file.type.startsWith("image/")){

    alert(
      "Можно выбрать только изображение."
    );

    input.value = "";

    return;

  }

  if(file.size > 5 * 1024 * 1024){

    alert(
      "Картинка должна быть меньше 5 МБ."
    );

    input.value = "";

    return;

  }

  const reader =
    new FileReader();

  reader.onload = function(){

    selectedProductImage =
      reader.result;

    const preview =
      document.getElementById(
        "productImagePreview"
      );

    preview.src =
      selectedProductImage;

    preview.classList.remove(
      "hidden"
    );

  };

  reader.readAsDataURL(file);

}

/* =========================
RENDER LISTINGS
========================= */

async function renderListings(items){

  const container =
    document.getElementById(
      "listingsContainer"
    );

  container.innerHTML = "";

  if(!items.length){

    container.innerHTML =
      `<div class="empty">
        Объявлений пока нет.
      </div>`;

    return;

  }


  /*
    Загружаем данные продавцов
    заранее, чтобы не делать
    запросы внутри каждого
    объявления.
  */

  const sellerIds =
    [
      ...new Set(
        items.map(
          item => item.seller_id
        )
      )
    ];


  const {
    data:profiles,
    error:profilesError
  } =
    await sb
      .from("profiles")
      .select(
        "id,nickname,avatar_url"
      )
      .in(
        "id",
        sellerIds
      );


  if(profilesError){

    console.error(
      profilesError
    );

  }


  const {
    data:reviews,
    error:reviewsError
  } =
    await sb
      .from("reviews")
      .select(
        "seller_id,rating"
      )
      .in(
        "seller_id",
        sellerIds
      );


  if(reviewsError){

    console.error(
      reviewsError
    );

  }


  const profileMap =
    new Map();

  (profiles || [])
    .forEach(profile=>{

      profileMap.set(
        profile.id,
        profile
      );

    });


  const reviewMap =
    new Map();


  (reviews || [])
    .forEach(review=>{

      if(
        !reviewMap.has(
          review.seller_id
        )
      ){

        reviewMap.set(
          review.seller_id,
          []
        );

      }

      reviewMap
        .get(review.seller_id)
        .push(
          Number(review.rating)
        );

    });


  items.forEach(listing=>{

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "card listing-card";


    const image =
      listing.image_url ||
      "https://placehold.co/600x400/130d1f/c084fc?text=Нет+фото";


    /*
      Данные продавца
    */

    const profile =
      profileMap.get(
        listing.seller_id
      );


    const sellerName =
      profile?.nickname ||
      "Продавец";


    const sellerReviews =
      reviewMap.get(
        listing.seller_id
      ) || [];


    const reviewCount =
      sellerReviews.length;


    let sellerRating = 0;


    if(reviewCount){

      sellerRating =
        sellerReviews.reduce(
          (sum,rating)=>
            sum + rating,
          0
        ) / reviewCount;

    }


    sellerRating =
      Math.round(
        sellerRating * 10
      ) / 10;


    const sellerAvatar =
      profile?.avatar_url ||
      AVATARS[0];


    /*
      Кнопки
    */

    let actions = "";


    if(
      currentUser &&
      listing.seller_id !== currentUser.id
    ){

      actions = `

        <div class="listing-actions">

          <button
            class="primary-btn"
            onclick="
              buyListing('${listing.id}')
            "
          >
            🛒 Купить
          </button>

          <button
            class="chat-btn"
            onclick="
              openChat(
                '${listing.id}',
                '${listing.seller_id}',
                '${escapeJs(
                  listing.title || "Чат"
                )}'
              )
            "
          >
            💬 Чат
          </button>

        </div>

      `;

    }else{

      actions = `

        <div
          style="
            margin-top:14px;
            color:#888;
          "
        >
          Это твоё объявление
        </div>

      `;

    }


    /*
      Карточка товара
    */

    card.innerHTML = `

      <img
        class="listing-image"
        src="${escapeHtml(image)}"
        alt="Товар"
      >

      <div class="listing-info">

        <div class="game-tag">
          ${escapeHtml(
            listing.game || "Игра"
          )}
        </div>


        <div class="listing-title">
          ${escapeHtml(
            listing.title ||
            "Без названия"
          )}
        </div>


        <div class="description">
          ${escapeHtml(
            listing.description ||
            ""
          )}
        </div>


        <div class="price">
          ${escapeHtml(
            String(
              listing.price ?? ""
            )
          )} ₽
        </div>


        <!-- ПРОДАВЕЦ -->

        <div class="seller-info">

          <img
            src="${escapeHtml(
              sellerAvatar
            )}"
            style="
              width:36px;
              height:36px;
              border-radius:50%;
              object-fit:cover;
              border:2px solid #8b5cf6;
            "
            alt="Аватар продавца"
          >

          <div>

            <div class="seller-name">
              👤 ${escapeHtml(
                sellerName
              )}
            </div>

            <div class="seller-rating">

              ⭐ ${sellerRating.toFixed(1)}

              ·

              ${getReviewText(
                reviewCount
              )}

            </div>

          </div>

        </div>


        ${actions}

      </div>

    `;


    container.appendChild(
      card
    );

  });

}


/* =========================
SEARCH
========================= */

async function searchListings(){

  const query =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  if(!query){

    await renderListings(
      listings
    );

    return;

  }


  const result =
    listings.filter(item=>{

      const game =
        String(
          item.game || ""
        ).toLowerCase();


      const title =
        String(
          item.title || ""
        ).toLowerCase();


      const description =
        String(
          item.description || ""
        ).toLowerCase();


      return(
        game.includes(query) ||
        title.includes(query) ||
        description.includes(query)
      );

    });


  await renderListings(
    result
  );

}

/* =========================
BUY
========================= */

async function buyListing(listingId){

  if(!currentUser){

    showAuthGate();

    return;

  }


  const listing =
    listings.find(
      item =>
        String(item.id) ===
        String(listingId)
    );


  if(!listing){

    alert(
      "Объявление не найдено."
    );

    return;

  }


  if(
    listing.seller_id ===
    currentUser.id
  ){

    alert(
      "Нельзя купить собственное объявление."
    );

    return;

  }


  const confirmed =
    confirm(
      `Купить "${listing.title}" за ${listing.price} ₽?`
    );


  if(!confirmed){

    return;

  }


  const {
    data:existing
  } =
    await sb
      .from("purchases")
      .select("id")
      .eq(
        "listing_id",
        listing.id
      )
      .eq(
        "buyer_id",
        currentUser.id
      )
      .maybeSingle();


  if(existing){

    alert(
      "Ты уже покупал этот товар."
    );

    return;

  }


  const {
    data:purchase,
    error
  } =
    await sb
      .from("purchases")
      .insert({

        listing_id:
          listing.id,

        buyer_id:
          currentUser.id,

        seller_id:
          listing.seller_id,

        price:
          Number(
            listing.price
          )

      })
      .select()
      .single();


  if(error){

    console.error(error);

    alert(
      "Ошибка покупки:\n\n" +
      error.message
    );

    return;

  }


  alert(
    "Покупка оформлена!"
  );


  await writeReview(
    purchase,
    listing
  );

}


/* =========================
REVIEW
========================= */

async function writeReview(
  purchase,
  listing
){

  const ratingText =
    prompt(
      "Оцени продавца от 1 до 5:"
    );


  if(
    ratingText === null
  ){

    return;

  }


  const rating =
    Number(
      ratingText
    );


  if(
    !Number.isInteger(rating) ||
    rating < 1 ||
    rating > 5
  ){

    alert(
      "Оценка должна быть от 1 до 5."
    );

    return;

  }


  const review =
    prompt(
      "Напиши отзыв о продавце:"
    );


  if(review === null){

    return;

  }


  const {
    error
  } =
    await sb
      .from("reviews")
      .insert({

        purchase_id:
          purchase.id,

        listing_id:
          listing.id,

        buyer_id:
          currentUser.id,

        seller_id:
          listing.seller_id,

        rating:
          rating,

        review:
          review.trim()

      });


  if(error){

    console.error(error);

    alert(
      "Ошибка сохранения отзыва:\n\n" +
      error.message
    );

    return;

  }


  alert(
    "⭐ Спасибо! Отзыв сохранён."
  );


  await loadProfileRating(
    currentUser.id
  );

  await loadListings();

}


/* =========================
CHATS
========================= */

async function loadChats(){

  if(!currentUser){

    return;

  }


  const container =
    document.getElementById(
      "chatsContainer"
    );


  container.innerHTML =
    `<div class="empty">
      Загрузка чатов...
    </div>`;


  const {
    data,
    error
  } =
    await sb
      .from("messages")
      .select("*")
      .or(
        `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(error);

    container.innerHTML =
      `<div class="empty">
        Ошибка загрузки чатов.
      </div>`;

    return;

  }


  if(!data?.length){

    container.innerHTML =
      `<div class="empty">
        У тебя пока нет чатов.
      </div>`;

    return;

  }


  const chats =
    new Map();


  data.forEach(message=>{

    const other =
      message.sender_id ===
      currentUser.id
        ? message.receiver_id
        : message.sender_id;


    if(!chats.has(other)){

      chats.set(
        other,
        message
      );

    }

  });


  container.innerHTML = "";


  chats.forEach(
    (message,otherId)=>{

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "chat-item";


      item.innerHTML = `

        <strong>
          💬 Чат
        </strong>

        <div
          style="
            color:#999;
            margin-top:6px;
          "
        >
          ${escapeHtml(
            message.message
          )}
        </div>

      `;


      item.onclick = ()=>{

        openChat(
          message.listing_id,
          otherId,
          "Чат"
        );

      };


      container.appendChild(
        item
      );

    }
  );

}


/* =========================
OPEN CHAT
========================= */

async function openChat(
  listingId,
  receiverId,
  title
){

  currentChat =
    listingId;

  currentReceiver =
    receiverId;

  currentListing =
    listingId;


  document.getElementById(
    "chatTitle"
  ).textContent =
    title || "Чат";


  showSection(
    "chatWindow"
  );


  await loadMessages();

}


/* =========================
LOAD MESSAGES
========================= */

async function loadMessages(){

  const container =
    document.getElementById(
      "chatMessages"
    );


  container.innerHTML =
    `<div class="empty">
      Загрузка...
    </div>`;


  const {
    data,
    error
  } =
    await sb
      .from("messages")
      .select("*")
      .eq(
        "listing_id",
        currentChat
      )
      .or(
        `and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentReceiver}),and(sender_id.eq.${currentReceiver},receiver_id.eq.${currentUser.id})`
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(error){

    console.error(error);

    container.innerHTML =
      `<div class="empty">
        Ошибка загрузки сообщений.
      </div>`;

    return;

  }


  container.innerHTML = "";


  if(!data?.length){

    container.innerHTML =
      `<div class="empty">
        Начни общение.
      </div>`;

    return;

  }


  data.forEach(message=>{

    const div =
      document.createElement(
        "div"
      );


    div.className =
      "message " +
      (
        message.sender_id ===
        currentUser.id
          ? "mine"
          : "theirs"
      );


    div.textContent =
      message.message;


    container.appendChild(
      div
    );

  });


  container.scrollTop =
    container.scrollHeight;

}


/* =========================
SEND MESSAGE
========================= */

async function sendMessage(){

  if(
    !currentUser ||
    !currentReceiver
  ){

    return;

  }


  const input =
    document.getElementById(
      "chatInput"
    );


  const message =
    input.value.trim();


  if(!message){

    return;

  }


  const {
    error
  } =
    await sb
      .from("messages")
      .insert({

        listing_id:
          currentListing,

        sender_id:
          currentUser.id,

        receiver_id:
          currentReceiver,

        message:
          message

      });


  if(error){

    console.error(error);

    alert(
      "Ошибка отправки:\n\n" +
      error.message
    );

    return;

  }


  input.value = "";

  await loadMessages();

}

LOGOUT
========================= */

async function logout(){

  await sb.auth.signOut();

  currentUser =
    null;

  showAuthGate();

}


/* =========================
HELPERS
========================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeJs(value){

  return String(value)
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'")
    .replaceAll("\n"," ");

}

<!-- АВАТАРКА -->
<div class="card">
  <h2>Аватарка</h2>

  <div style="display:flex;align-items:center;gap:15px;margin:15px 0;">
    <img
      id="avatarPreview"
      src=""
      alt="Аватарка"
      style="
        width:80px;
        height:80px;
        border-radius:50%;
        object-fit:cover;
        background:#1b1329;
        border:2px solid #8b5cf6;
      "
    >
  </div>

  <input
    type="file"
    id="avatarFile"
    accept="image/*"
  >

  <button
    onclick="uploadAvatar()"
    style="margin-top:10px;"
  >
    Загрузить аватарку
  </button>
</div>

<script>
async function uploadAvatar() {
  try {
    const fileInput = document.getElementById("avatarFile");
    const file = fileInput?.files?.[0];

    if (!file) {
      alert("Выбери изображение.");
      return;
    }

    // Максимум 10 МБ
    if (file.size > 10 * 1024 * 1024) {
      alert("Размер аватарки не должен превышать 10 МБ.");
      return;
    }

    // Только изображения
    if (!file.type.startsWith("image/")) {
      alert("Можно загружать только изображения.");
      return;
    }

    // Получаем текущего пользователя
    const {
      data: { user },
      error: userError
    } = await sb.auth.getUser();

    if (userError || !user) {
      alert("Сначала войди в аккаунт.");
      return;
    }

    /*
      ВАЖНО:
      Файл сохраняется именно так:

      ID_ПОЛЬЗОВАТЕЛЯ/avatar.jpg

      Это соответствует твоей RLS-политике.
    */

    const extension =
      file.name.split(".").pop()?.toLowerCase() || "jpg";

    const filePath = `${user.id}/avatar.${extension}`;

    // Загружаем файл в bucket avatars
    const { error: uploadError } = await sb.storage
      .from("avatars")
      .upload(filePath, file, {
        upsert: true,
        contentType: file.type,
        cacheControl: "3600"
      });

    if (uploadError) {
      console.error("Avatar upload error:", uploadError);

      alert(
        "Ошибка загрузки аватарки:\n\n" +
        uploadError.message
      );

      return;
    }

    // Получаем публичную ссылку
    const {
      data: { publicUrl }
    } = sb.storage
      .from("avatars")
      .getPublicUrl(filePath);

    // Сохраняем ссылку в профиль
    const { error: profileError } = await sb
      .from("profiles")
      .upsert({
        id: user.id,
        avatar_url: publicUrl
      });

    if (profileError) {
      console.error("Profile update error:", profileError);

      alert(
        "Аватарка загружена, но профиль не обновился:\n\n" +
        profileError.message
      );

      return;
    }

    // Показываем новую аватарку
    const avatarPreview =
      document.getElementById("avatarPreview");

    if (avatarPreview) {
      avatarPreview.src =
        publicUrl + "?t=" + Date.now();
    }

    // Очищаем выбор файла
    fileInput.value = "";

    alert("Аватарка успешно обновлена!");

  } catch (error) {
    console.error("Avatar error:", error);

    alert(
      "Ошибка загрузки аватарки:\n\n" +
      error.message
    );
  }
}
</script>

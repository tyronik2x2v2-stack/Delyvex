<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delyvex</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1020;
  color:white
}

header{
  height:70px;
  background:#111827;
  border-bottom:1px solid #293348;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:20
}

.logo{
  font-size:27px;
  font-weight:800;
  color:#7c5cff;
  cursor:pointer
}

nav{
  display:flex;
  gap:5px
}

nav button{
  background:none;
  border:0;
  color:#cbd5e1;
  padding:10px 13px;
  border-radius:9px;
  cursor:pointer
}

nav button:hover{
  background:#1e293b;
  color:white
}

.user{
  display:flex;
  align-items:center;
  gap:9px
}

.avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  object-fit:cover
}

button{
  cursor:pointer
}

.btn{
  border:0;
  border-radius:9px;
  padding:11px 16px;
  background:#7c5cff;
  color:white;
  font-weight:bold
}

.btn:hover{
  background:#6848ed
}

.secondary{
  background:#1e293b
}

.green{
  background:#16a34a
}

.red{
  background:#dc2626
}

main{
  max-width:1200px;
  margin:auto;
  padding:25px
}

.section{
  display:none
}

.section.active{
  display:block
}

.hero{
  text-align:center;
  padding:60px 10px 35px
}

.hero h1{
  font-size:clamp(38px,7vw,65px);
  margin:0 0 15px
}

.hero h1 span{
  color:#7c5cff
}

.hero p{
  color:#94a3b8;
  font-size:18px
}

.search{
  display:flex;
  gap:10px;
  max-width:800px;
  margin:30px auto
}

input,textarea,select{
  width:100%;
  padding:13px;
  border-radius:9px;
  border:1px solid #334155;
  background:#111827;
  color:white;
  outline:none
}

input:focus,textarea:focus,select:focus{
  border-color:#7c5cff
}

textarea{
  min-height:120px;
  resize:vertical
}

.categories{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:25px
}

.category{
  border:1px solid #334155;
  background:#111827;
  color:#cbd5e1;
  padding:9px 14px;
  border-radius:20px
}

.category.active{
  background:#7c5cff;
  color:white;
  border-color:#7c5cff
}

.listings{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:18px
}

.card{
  background:#111827;
  border:1px solid #273244;
  border-radius:15px;
  overflow:hidden
}

.card-image{
  width:100%;
  height:170px;
  object-fit:cover;
  background:#1e293b
}

.card-body{
  padding:17px
}

.card h3{
  margin:0 0 8px
}

.description{
  color:#94a3b8;
  min-height:42px;
  margin:10px 0
}

.meta{
  color:#64748b;
  font-size:13px
}

.price{
  color:#a78bfa;
  font-size:22px;
  font-weight:bold;
  margin:13px 0
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap
}

.actions .btn{
  flex:1
}

.form{
  max-width:650px;
  margin:30px auto;
  background:#111827;
  border:1px solid #273244;
  padding:25px;
  border-radius:15px
}

.group{
  margin-bottom:15px
}

.group label{
  display:block;
  margin-bottom:7px;
  color:#cbd5e1
}

.profile{
  max-width:700px;
  margin:auto;
  background:#111827;
  border:1px solid #273244;
  padding:25px;
  border-radius:15px
}

.profile-head{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:25px
}

.big-avatar{
  width:70px;
  height:70px;
  border-radius:50%;
  object-fit:cover
}

.empty{
  text-align:center;
  color:#64748b;
  padding:45px 10px
}

.loading{
  text-align:center;
  color:#94a3b8;
  padding:40px
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:100
}

.modal.show{
  display:flex
}

.modal-box{
  width:min(600px,100%);
  max-height:90vh;
  overflow:auto;
  background:#111827;
  border:1px solid #334155;
  border-radius:15px;
  padding:22px
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px
}

.chat-person{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:6px
}

.chat-person-avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  object-fit:cover
}

.chat-person-name{
  color:#cbd5e1;
  font-weight:bold
}

.close{
  background:none;
  border:0;
  color:#94a3b8;
  font-size:30px
}

.chat{
  height:400px;
  overflow-y:auto;
  background:#0b1020;
  padding:15px;
  border-radius:10px;
  margin-bottom:10px
}

.message-row{
  display:flex;
  gap:9px;
  align-items:flex-end;
  margin-bottom:13px
}

.message-row-mine{
  justify-content:flex-end
}

.message-avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  object-fit:cover;
  flex-shrink:0
}

.message-wrapper{
  max-width:75%;
  display:flex;
  flex-direction:column
}

.message-wrapper.mine-wrapper{
  align-items:flex-end
}

.message-wrapper.theirs-wrapper{
  align-items:flex-start
}

.message-name{
  font-size:12px;
  color:#94a3b8;
  margin-bottom:4px
}

.message{
  max-width:100%;
  padding:10px 13px;
  border-radius:12px;
  word-break:break-word
}

.mine{
  background:#7c5cff
}

.theirs{
  background:#1e293b
}

.time{
  display:block;
  opacity:.6;
  font-size:10px;
  margin-top:4px
}

.chat-input{
  display:flex;
  gap:8px
}

.conversation{
  background:#0f172a;
  border:1px solid #273244;
  border-radius:10px;
  padding:14px;
  margin-bottom:8px;
  cursor:pointer
}

.conversation:hover{
  border-color:#7c5cff
}

.conversation-head{
  display:flex;
  align-items:center;
  gap:10px
}

.conversation-avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  flex-shrink:0
}

.conversation-info{
  min-width:0;
  flex:1
}

.conversation-name{
  font-weight:bold;
  color:white;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.conversation-title{
  color:#a78bfa;
  font-size:13px;
  margin-top:3px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.conversation-message{
  color:#94a3b8;
  margin-top:9px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#111827;
  border:1px solid #334155;
  border-radius:10px;
  padding:14px 18px;
  display:none;
  z-index:200
}

.toast.show{
  display:block
}

@media(max-width:750px){

  header{
    padding:0 10px
  }

  nav{
    display:none
  }

  .search{
    flex-direction:column
  }

  main{
    padding:15px
  }

  .listings{
    grid-template-columns:1fr
  }

  .chat-input{
    flex-direction:column
  }

  .message-wrapper{
    max-width:80%
  }
}
</style>
</head>

<body>

<header>

  <div class="logo" onclick="showSection('home')">
    Delyvex
  </div>

  <nav>
    <button onclick="showSection('home')">
      Главная
    </button>

    <button onclick="showSection('sell')">
      Продать
    </button>

    <button onclick="showSection('messages')">
      💬 Сообщения
    </button>

    <button onclick="showSection('profile')">
      Профиль
    </button>
  </nav>

  <div class="user">

    <span id="userName"></span>

    <img
      id="headerAvatar"
      class="avatar"
      style="display:none"
    >

    <button
      id="loginBtn"
      class="btn"
      onclick="loginWithGoogle()"
    >
      Войти
    </button>

    <button
      id="logoutBtn"
      class="btn secondary"
      style="display:none"
      onclick="logout()"
    >
      Выйти
    </button>

  </div>

</header>


<main>

<!-- HOME -->

<section id="home" class="section active">

  <div class="hero">

    <h1>
      Добро пожаловать в
      <span>Delyvex</span>
    </h1>

    <p>
      Маркетплейс игровых товаров
    </p>

    <div class="search">

      <input
        id="search"
        placeholder="Поиск товаров..."
        oninput="renderListings()"
      >

      <button
        class="btn"
        onclick="renderListings()"
      >
        Найти
      </button>

    </div>

  </div>

  <div class="categories">

    <button
      class="category active"
      onclick="setCategory('Все',this)"
    >
      Все
    </button>

    <button
      class="category"
      onclick="setCategory('Roblox',this)"
    >
      Roblox
    </button>

    <button
      class="category"
      onclick="setCategory('Minecraft',this)"
    >
      Minecraft
    </button>

    <button
      class="category"
      onclick="setCategory('GTA',this)"
    >
      GTA
    </button>

    <button
      class="category"
      onclick="setCategory('CS2',this)"
    >
      CS2
    </button>

    <button
      class="category"
      onclick="setCategory('Другое',this)"
    >
      Другое
    </button>

  </div>

  <div
    id="listings"
    class="listings"
  >

    <div class="loading">
      Загрузка товаров...
    </div>

  </div>

</section>


<!-- SELL -->

<section id="sell" class="section">

  <div class="form">

    <h2>Продать товар</h2>

    <div
      id="sellLogin"
      class="empty"
      style="display:none"
    >
      Сначала войдите через Google.
    </div>

    <div id="sellForm">

      <div class="group">

        <label>Название</label>

        <input
          id="title"
          placeholder="Например: Robux 1000"
        >

      </div>

      <div class="group">

        <label>Описание</label>

        <textarea
          id="description"
          placeholder="Описание товара"
        ></textarea>

      </div>

      <div class="group">

        <label>Категория</label>

        <select id="category">

          <option>Roblox</option>
          <option>Minecraft</option>
          <option>GTA</option>
          <option>CS2</option>
          <option>Другое</option>

        </select>

      </div>

      <div class="group">

        <label>Цена (€)</label>

        <input
          id="price"
          type="number"
          min="0"
          step="0.01"
          placeholder="10"
        >

      </div>

      <div class="group">

        <label>URL изображения</label>

        <input
          id="image"
          placeholder="https://..."
        >

      </div>

      <button
        class="btn"
        onclick="createListing()"
      >
        Опубликовать
      </button>

    </div>

  </div>

</section>


<!-- MESSAGES -->

<section id="messages" class="section">

  <div class="form">

    <h2>Сообщения</h2>

    <div
      id="messageLogin"
      class="empty"
    >
      Войдите, чтобы посмотреть сообщения.
    </div>

    <div id="conversations"></div>

  </div>

</section>


<!-- PROFILE -->

<section id="profile" class="section">

  <div class="profile">

    <div
      id="profileLogin"
      class="empty"
    >

      <h2>Профиль</h2>

      <p>
        Войдите через Google.
      </p>

      <button
        class="btn"
        onclick="loginWithGoogle()"
      >
        Войти через Google
      </button>

    </div>

    <div
      id="profileContent"
      style="display:none"
    >

      <div class="profile-head">

        <img
          id="profileAvatar"
          class="big-avatar"
        >

        <div>

          <h2 id="profileName">
            Пользователь
          </h2>

          <div
            id="profileEmail"
            style="color:#64748b"
          ></div>

        </div>

      </div>

      <div class="group">

        <label>Имя</label>

        <input id="profileNameInput">

      </div>

      <div class="group">

        <label>Аватар URL</label>

        <input id="profileAvatarInput">

      </div>

      <button
        class="btn"
        onclick="saveProfile()"
      >
        Сохранить
      </button>

      <hr
        style="border-color:#273244;margin:25px 0"
      >

      <h3>Мои объявления</h3>

      <div id="myListings"></div>

    </div>

  </div>

</section>

</main>


<!-- CHAT -->

<div
  id="chatModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-head">

      <div>

        <h2 id="chatTitle">
          Чат
        </h2>

        <div
          id="chatSubtitle"
          class="chat-person"
        ></div>

      </div>

      <button
        class="close"
        onclick="closeChat()"
      >
        ×
      </button>

    </div>

    <div
      id="chatMessages"
      class="chat"
    ></div>

    <div class="chat-input">

      <input
        id="chatInput"
        placeholder="Напишите сообщение..."
        onkeydown="
          if(event.key==='Enter'){
            event.preventDefault();
            sendMessage();
          }
        "
      >

      <button
        class="btn"
        onclick="sendMessage()"
      >
        Отправить
      </button>

    </div>

  </div>

</div>


<div
  id="toast"
  class="toast"
></div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://gisdufgixjfudblxydvm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_irNKt_PStZrQ2NCEdaD5sg_quCmigAn";

const GITHUB_URL =
"https://tyronik2x2v2-stack.github.io/Delyvex/";

const sb =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   STATE
===================================================== */

let currentUser = null;

let currentProfile = null;

let allListings = [];

let selectedCategory = "Все";

let currentChat = {
  listingId:null,
  receiverId:null,
  title:null
};

let currentChatProfiles = {
  me:null,
  other:null
};

let chatChannel = null;


/* =====================================================
   GOOGLE LOGIN
===================================================== */

async function loginWithGoogle(){

  try{

    const result =
      await sb.auth.signInWithOAuth({

        provider:"google",

        options:{

          redirectTo:GITHUB_URL,

          skipBrowserRedirect:false,

          queryParams:{
            access_type:"offline",
            prompt:"select_account"
          }

        }

      });

    if(result.error){

      console.error(
        "Google OAuth error:",
        result.error
      );

      alert(
        "Ошибка входа через Google:\n\n"+
        result.error.message
      );

    }

  }catch(error){

    console.error(error);

    alert(
      "Ошибка входа:\n\n"+
      error.message
    );

  }

}


/* =====================================================
   INIT
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  async()=>{

    await loadSession();

    await loadListings();

    sb.auth.onAuthStateChange(
      async(event,session)=>{

        console.log(
          "Auth event:",
          event
        );

        currentUser =
          session?.user || null;

        if(currentUser){

          await loadProfile();

        }else{

          currentProfile=null;

        }

        updateUI();

        await loadListings();

      }
    );

  }
);


/* =====================================================
   SESSION
===================================================== */

async function loadSession(){

  const {
    data,
    error
  } =
  await sb.auth.getSession();

  if(error){

    console.error(error);

    return;

  }

  currentUser =
    data.session?.user || null;

  if(currentUser){

    await loadProfile();

  }

  updateUI();

}


/* =====================================================
   PROFILE
===================================================== */

async function loadProfile(){

  if(!currentUser) return;

  const {
    data,
    error
  } =
  await sb
    .from("profiles")
    .select("*")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(error){

    console.error(
      "Profile error:",
      error
    );

    return;

  }

  if(data){

    currentProfile=data;

    return;

  }

  const metadata =
    currentUser.user_metadata || {};

  const profile={

    id:currentUser.id,

    username:
      metadata.full_name ||
      metadata.name ||
      currentUser.email?.split("@")[0] ||
      "Пользователь",

    avatar_url:
      metadata.avatar_url ||
      metadata.picture ||
      ""

  };

  const result =
    await sb
      .from("profiles")
      .insert(profile)
      .select()
      .single();

  if(result.error){

    console.error(
      "Profile creation error:",
      result.error
    );

  }else{

    currentProfile =
      result.data || profile;

  }

}


/* =====================================================
   PROFILE HELPERS
===================================================== */

async function getProfile(userId){

  if(!userId) return null;

  if(
    currentUser &&
    String(userId)===String(currentUser.id) &&
    currentProfile
  ){

    return currentProfile;

  }

  const {
    data,
    error
  } =
  await sb
    .from("profiles")
    .select("id,username,avatar_url")
    .eq("id",userId)
    .maybeSingle();

  if(error){

    console.error(
      "Profile loading error:",
      error
    );

    return null;

  }

  return data || null;

}


function profileName(
  profile,
  fallback="Пользователь"
){

  return (
    profile?.username ||
    fallback
  );

}


function profileAvatar(profile){

  return (
    profile?.avatar_url ||
    "https://placehold.co/100x100/1e293b/ffffff?text=User"
  );

}


/* =====================================================
   UI
===================================================== */

function updateUI(){

  const login =
    document.getElementById(
      "loginBtn"
    );

  const logout =
    document.getElementById(
      "logoutBtn"
    );

  const name =
    document.getElementById(
      "userName"
    );

  const avatar =
    document.getElementById(
      "headerAvatar"
    );

  if(currentUser){

    login.style.display="none";

    logout.style.display="block";

    name.textContent =
      currentProfile?.username ||
      currentUser.user_metadata?.name ||
      currentUser.email ||
      "Пользователь";

    const photo =
      currentProfile?.avatar_url ||
      currentUser.user_metadata?.avatar_url ||
      currentUser.user_metadata?.picture ||
      "";

    if(photo){

      avatar.src=photo;

      avatar.style.display="block";

    }else{

      avatar.style.display="none";

    }

  }else{

    login.style.display="block";

    logout.style.display="none";

    name.textContent="";

    avatar.style.display="none";

  }

  updateSell();

  updateProfile();

  updateMessages();

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  if(chatChannel){

    await sb.removeChannel(
      chatChannel
    );

    chatChannel=null;

  }

  await sb.auth.signOut();

  currentUser=null;

  currentProfile=null;

  currentChatProfiles={
    me:null,
    other:null
  };

  showToast(
    "Вы вышли из аккаунта"
  );

  showSection("home");

}


/* =====================================================
   NAVIGATION
===================================================== */

function showSection(id){

  document
    .querySelectorAll(".section")
    .forEach(x=>
      x.classList.remove("active")
    );

  document
    .getElementById(id)
    ?.classList.add("active");

  if(id==="profile"){

    updateProfile();

    renderMyListings();

  }

  if(id==="messages"){

    updateMessages();

    loadConversations();

  }

}


/* =====================================================
   LISTINGS
===================================================== */

async function loadListings(){

  const {
    data,
    error
  } =
  await sb
    .from("listings")
    .select("*")
    .order(
      "created_at",
      {ascending:false}
    );

  if(error){

    console.error(
      "Listings error:",
      error
    );

    document.getElementById(
      "listings"
    ).innerHTML=`

      <div class="empty">
        Ошибка загрузки товаров.
        <br><br>
        ${escapeHtml(error.message)}
      </div>

    `;

    return;

  }

  allListings=data || [];

  renderListings();

}


function setCategory(
  category,
  button
){

  selectedCategory=category;

  document
    .querySelectorAll(".category")
    .forEach(x=>
      x.classList.remove("active")
    );

  button.classList.add("active");

  renderListings();

}


function renderListings(){

  const box =
    document.getElementById(
      "listings"
    );

  const search =
    (
      document.getElementById(
        "search"
      )?.value || ""
    )
    .toLowerCase()
    .trim();

  let items =
    [...allListings];

  if(
    selectedCategory!=="Все"
  ){

    items =
      items.filter(x=>
        x.category===
        selectedCategory
      );

  }

  if(search){

    items =
      items.filter(x=>

        String(x.title||"")
          .toLowerCase()
          .includes(search)

        ||

        String(x.description||"")
          .toLowerCase()
          .includes(search)

        ||

        String(x.category||"")
          .toLowerCase()
          .includes(search)

      );

  }

  if(!items.length){

    box.innerHTML=`

      <div class="empty">
        Товаров пока нет.
      </div>

    `;

    return;

  }

  box.innerHTML =
    items
      .map(createCard)
      .join("");

}

/* =====================================================
   LOAD CHAT
===================================================== */

async function loadChat(){

  if(
    !currentUser ||
    !currentChat.listingId ||
    !currentChat.receiverId
  ){

    return;

  }

  const box =
    document.getElementById(
      "chatMessages"
    );

  box.innerHTML=`

    <div class="loading">
      Загрузка сообщений...
    </div>

  `;

  const {
    data,
    error
  } =
  await sb
    .from("messages")
    .select("*")
    .eq(
      "listing_id",
      currentChat.listingId
    )
    .or(

      `and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChat.receiverId}),and(sender_id.eq.${currentChat.receiverId},receiver_id.eq.${currentUser.id})`

    )
    .order(
      "created_at",
      {ascending:true}
    );

  if(error){

    console.error(
      "Chat loading error:",
      error
    );

    box.innerHTML=`

      <div class="empty">

        Не удалось загрузить чат.

        <br><br>

        ${escapeHtml(error.message)}

      </div>

    `;

    return;

  }

  if(!data || !data.length){

    box.innerHTML=`

      <div class="empty">

        Сообщений пока нет.

        <br>

        Начните переписку!

      </div>

    `;

    return;

  }

  const userIds=[

    ...new Set(

      data.flatMap(message=>[

        message.sender_id,

        message.receiver_id

      ])

    )

  ];

  const {
    data:profiles,
    error:profilesError
  } =
  await sb
    .from("profiles")
    .select(
      "id,username,avatar_url"
    )
    .in(
      "id",
      userIds
    );

  if(profilesError){

    console.error(
      "Profiles error:",
      profilesError
    );

  }

  const profileMap =
    new Map();

  (profiles || [])
    .forEach(profile=>{

      profileMap.set(
        String(profile.id),
        profile
      );

    });

  box.innerHTML =
    data
      .map(message=>

        createMessageHTML(

          message,

          profileMap.get(
            String(
              message.sender_id
            )
          )

        )

      )
      .join("");

  box.scrollTop =
    box.scrollHeight;

}

/* =====================================================
   REALTIME CHAT
===================================================== */

function subscribeChat(){

  if(chatChannel){

    sb.removeChannel(
      chatChannel
    );

    chatChannel=null;

  }

  chatChannel =
    sb
      .channel(
        "delyvex-chat-"+
        currentChat.listingId+
        "-"+
        currentUser.id
      )

      .on(

        "postgres_changes",

        {

          event:"INSERT",

          schema:"public",

          table:"messages",

          filter:
            `listing_id=eq.${currentChat.listingId}`

        },

        async payload=>{

          const message =
            payload.new;

          const relevant =

            (

              String(
                message.sender_id
              )===
              String(
                currentUser.id
              )

              &&

              String(
                message.receiver_id
              )===
              String(
                currentChat.receiverId
              )

            )

            ||

            (

              String(
                message.sender_id
              )===
              String(
                currentChat.receiverId
              )

              &&

              String(
                message.receiver_id
              )===
              String(
                currentUser.id
              )

            );

          if(relevant){

            await loadChat();

          }

        }

      )

      .subscribe();

}

async function loadConversations(){

  const box =
    document.getElementById(
      "conversations"
    );

  if(!currentUser){

    box.innerHTML="";

    return;

  }

  const {
    data,
    error
  } =
  await sb
    .from("messages")
    .select("*")
    .or(

      `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`

    )
    .order(
      "created_at",
      {ascending:false}
    );

  if(error){

    console.error(
      "Conversations error:",
      error
    );

    box.innerHTML=`

      <div class="empty">

        Ошибка загрузки сообщений.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

    return;

  }

  if(!data || !data.length){

    box.innerHTML=`

      <div class="empty">
        Сообщений пока нет.
      </div>

    `;

    return;

  }

  const unique =
    new Map();

  for(
    const message of data
  ){

    const otherUser =

      String(
        message.sender_id
      )===
      String(
        currentUser.id
      )

      ?

      message.receiver_id

      :

      message.sender_id;

    const key =
      `${message.listing_id}-${otherUser}`;

    if(!unique.has(key)){

      unique.set(
        key,
        message
      );

    }

  }

  const messages =
    Array.from(
      unique.values()
    );

  const userIds=[

    ...new Set(

      messages.flatMap(
        message=>[

          message.sender_id,

          message.receiver_id

        ]
      )

    )

  ];

  const {
    data:profiles,
    error:profilesError
  } =
  await sb
    .from("profiles")
    .select(
      "id,username,avatar_url"
    )
    .in(
      "id",
      userIds
    );

  if(profilesError){

    console.error(
      "Conversation profiles error:",
      profilesError
    );

  }

  const profileMap =
    new Map();

  (profiles || [])
    .forEach(profile=>{

      profileMap.set(
        String(profile.id),
        profile
      );

    });

  box.innerHTML =
    messages
      .map(message=>{

        const mine =
          String(
            message.sender_id
          )===
          String(
            currentUser.id
          );

        const otherId =
          mine
            ? message.receiver_id
            : message.sender_id;

        const otherProfile =
          profileMap.get(
            String(otherId)
          );

        const listing =
          allListings.find(item=>
            String(item.id)===
            String(message.listing_id)
          );

        const title =
          listing?.title ||
          "Объявление";

        const name =
          profileName(
            otherProfile,
            "Пользователь"
          );

        const avatar =
          profileAvatar(
            otherProfile
          );

        return `

          <div
            class="conversation"
            data-listing-id="${escapeAttribute(
              message.listing_id
            )}"
            data-user-id="${escapeAttribute(
              otherId
            )}"
            onclick="
              openConversationFromElement(this)
            "
          >

            <div class="conversation-head">

              <img
                class="conversation-avatar"
                src="${escapeAttribute(avatar)}"
                onerror="
                  this.src='https://placehold.co/100x100/1e293b/ffffff?text=User'
                "
              >

              <div class="conversation-info">

                <div class="conversation-name">

                  ${escapeHtml(name)}

                </div>

                <div class="conversation-title">

                  ${escapeHtml(title)}

                </div>

              </div>

            </div>

            <div class="conversation-message">

              ${
                mine
                  ? "Вы: "
                  : ""
              }

              ${escapeHtml(
                message.message
              )}

            </div>

          </div>

        `;

      })
      .join("");

}


function openConversationFromElement(
  element
){

  const listingId =
    element.dataset.listingId;

  const userId =
    element.dataset.userId;

  const title =
    element
      .querySelector(
        ".conversation-title"
      )
      ?.textContent
      .trim() ||
    "Объявление";

  openConversation(
    listingId,
    userId,
    title
  );

}

/* =====================================================
   HELPERS
===================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


function escapeAttribute(value){

  return String(value ?? "")
    .replaceAll(
      "\\",
      "\\\\"
    )
    .replaceAll(
      "'",
      "\\'"
    )
    .replaceAll(
      '"',
      "&quot;"
    );

}


function showToast(text){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent=text;

  toast.classList.add("show");

  setTimeout(
    ()=>{
      toast.classList.remove("show");
    },
    3000
  );

}


/* =====================================================
   MODAL
===================================================== */

document
  .getElementById(
    "chatModal"
  )
  .addEventListener(
    "click",
    event=>{

      if(
        event.target.id===
        "chatModal"
      ){

        closeChat();

      }

    }
  );

</script>

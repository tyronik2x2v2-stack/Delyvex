<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Delyvex</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0812;color:#fff;font-family:Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

#authGate{
  position:fixed;inset:0;z-index:9999;background:#0b0812;
  display:flex;align-items:center;justify-content:center;padding:20px
}

.auth-box{
  width:100%;max-width:420px;background:#130d1f;
  border:1px solid #2b1b3d;border-radius:24px;padding:35px 25px;
  text-align:center
}

.logo{font-size:36px;font-weight:900;color:#c084fc;margin-bottom:10px}
.auth-box p{color:#aaa;line-height:1.5;margin-bottom:25px}

.google-btn{
  width:100%;padding:14px;border:0;border-radius:13px;
  background:#fff;color:#111;font-weight:700
}

header{
  height:70px;background:#100b1a;border-bottom:1px solid #241733;
  display:flex;align-items:center;padding:0 22px;position:sticky;top:0;z-index:100
}

.header-logo{color:#c084fc;font-size:24px;font-weight:900}
.header-nav{display:flex;gap:5px;margin-left:auto}
.nav-btn{background:transparent;color:#ddd;border:0;padding:10px 13px;border-radius:10px}
.nav-btn:hover{background:#21152e}
.header-profile{margin-left:10px}

.header-avatar{
  width:40px;height:40px;border-radius:50%;object-fit:cover;
  border:2px solid #8b5cf6
}

main{max-width:1100px;margin:auto;padding:25px 18px 100px}
.section{display:none}
.section.active{display:block}

.page-title{font-size:28px;margin:0 0 20px}

.search-box{display:flex;gap:10px;margin-bottom:20px}
.search-box input{
  flex:1;min-width:0;background:#130d1f;border:1px solid #30203f;
  color:#fff;border-radius:13px;padding:14px;outline:none
}

.primary-btn{
  border:0;background:#8b5cf6;color:#fff;padding:13px 18px;
  border-radius:12px;font-weight:700
}
.primary-btn:hover{background:#7c3aed}
.primary-btn:disabled{background:#332640;color:#777;cursor:not-allowed}

.chat-btn{
  border:1px solid #8b5cf6;background:#241733;color:#fff;
  padding:13px 18px;border-radius:12px;font-weight:700
}
.chat-btn:hover{background:#35204d}

.card{
  background:#130d1f;border:1px solid #241733;border-radius:18px;
  padding:18px;margin-bottom:15px
}

.home-balance{
  display:flex;align-items:center;justify-content:space-between;gap:15px;
  background:linear-gradient(135deg,#1b1029,#130d1f);
  border:1px solid #6d3cc7;border-radius:18px;padding:18px 20px;margin-bottom:20px
}

.home-balance-label{color:#aaa;font-size:14px}
.home-balance-value{color:#c084fc;font-size:28px;font-weight:900;margin-top:4px}

.listing-card{display:flex;gap:18px}
.listing-image{
  width:180px;height:180px;border-radius:14px;object-fit:cover;
  background:#0b0812;flex-shrink:0
}
.listing-info{flex:1}
.listing-title{font-size:20px;font-weight:800;margin-bottom:8px}

.game-tag{
  display:inline-block;background:#28183b;color:#c084fc;border-radius:8px;
  padding:5px 9px;font-size:13px;margin-bottom:10px
}

.description{color:#aaa;line-height:1.5}
.price{font-size:21px;font-weight:900;color:#c084fc;margin-top:10px}

.seller-info{
  display:flex;align-items:center;gap:10px;margin-top:14px;
  padding-top:12px;border-top:1px solid #241733
}

.seller-name{color:#fff;font-weight:700}
.seller-rating{color:#fbbf24;font-size:14px;margin-top:3px}
.listing-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

.insufficient{margin-top:10px;color:#fca5a5;font-size:14px;font-weight:700}

.form-card{max-width:650px;margin:auto}
.form-group{margin-bottom:17px}
.form-group label{display:block;margin-bottom:7px;color:#c084fc;font-weight:700}

.form-group input,
.form-group textarea{
  width:100%;background:#0b0812;color:#fff;border:1px solid #30203f;
  border-radius:12px;padding:13px;outline:none
}

.form-group textarea{min-height:130px;resize:vertical}

.product-preview{
  width:100%;max-height:300px;object-fit:contain;background:#0b0812;
  border-radius:14px;margin-top:12px;border:1px solid #30203f
}

.profile-card{max-width:700px;margin:auto}
.profile-top{display:flex;align-items:center;gap:20px;margin-bottom:25px}

.profile-avatar{
  width:100px;height:100px;border-radius:50%;object-fit:cover;
  border:3px solid #8b5cf6
}

.profile-name{font-size:24px;font-weight:800}
.profile-email{color:#999;margin-top:5px}

.rating-box{
  background:#100b1a;border:1px solid #2b1b3d;border-radius:15px;
  padding:16px;margin-bottom:22px;text-align:center
}

.rating-number{font-size:32px;font-weight:900;color:#c084fc}
.rating-stars{font-size:27px;color:#fbbf24;letter-spacing:3px;margin:5px 0}
.rating-count{color:#999}

.avatar-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:12px}

.avatar-option{
  width:100%;aspect-ratio:1;border-radius:50%;border:3px solid transparent;
  padding:3px;background:#0b0812
}

.avatar-option:hover{transform:scale(1.06);border-color:#8b5cf6}
.avatar-option.selected{border-color:#c084fc}
.avatar-option img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}

.selected-avatar{display:flex;justify-content:center;margin:20px 0}
.selected-avatar img{
  width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid #8b5cf6
}

.balance-card{
  background:linear-gradient(135deg,#1b1029,#130d1f);
  border:1px solid #6d3cc7;border-radius:18px;padding:22px;margin-bottom:20px
}

.balance-label{color:#aaa}
.balance-value{font-size:34px;font-weight:900;color:#c084fc;margin:8px 0 15px}

.topup-box{
  margin-top:15px;padding:17px;background:#100b1a;
  border:1px solid #2b1b3d;border-radius:15px
}

.topup-info{
  color:#aaa;font-size:14px;line-height:1.5;margin-bottom:14px
}

.order-card{
  background:#130d1f;border:1px solid #241733;border-radius:16px;
  padding:17px;margin-bottom:12px
}

.order-title{font-size:18px;font-weight:800}
.status{
  display:inline-block;padding:6px 9px;border-radius:8px;
  background:#28183b;color:#c084fc;font-size:13px;margin-top:8px
}

.small{color:#999;font-size:14px;margin-top:7px}

.review-box{margin-top:14px;padding-top:14px;border-top:1px solid #2b1b3d}

.withdraw-box{
  background:#100b1a;border:1px solid #2b1b3d;border-radius:15px;
  padding:17px;margin-top:15px
}

.withdraw-result{
  margin-top:12px;padding:12px;background:#0b0812;
  border-radius:10px;color:#aaa
}

.chat-item{
  background:#130d1f;border:1px solid #241733;padding:16px;
  border-radius:15px;cursor:pointer;margin-bottom:10px
}

.chat-item:hover{border-color:#8b5cf6}

.chat-window{max-width:750px;margin:auto}

.chat-messages{
  min-height:350px;max-height:500px;overflow-y:auto;
  background:#100b1a;border:1px solid #241733;border-radius:16px;
  padding:15px;margin-bottom:12px
}

.message{
  max-width:75%;padding:10px 13px;border-radius:14px;
  margin-bottom:10px;line-height:1.4
}

.message.mine{margin-left:auto;background:#6d3cc7}
.message.theirs{background:#241733}

.system-message{
  max-width:90%;margin:12px auto;text-align:center;background:#1d1230;
  border:1px solid #6d3cc7;color:#d8b4fe;padding:12px 15px;
  border-radius:13px;font-size:14px
}

.chat-send{display:flex;gap:8px}

.chat-send input{
  flex:1;background:#130d1f;color:#fff;border:1px solid #30203f;
  border-radius:12px;padding:13px
}

.empty{text-align:center;color:#777;padding:50px 20px}

.mobile-nav{display:none}

@media(max-width:700px){
  header{height:60px;padding:0 15px}
  .header-logo{font-size:21px}
  .header-nav{display:none}
  .header-profile{margin-left:auto}
  main{padding:20px 13px 90px}
  .listing-card{flex-direction:column}
  .listing-image{width:100%;height:220px}
  .avatar-grid{grid-template-columns:repeat(4,1fr)}
  .search-box{flex-direction:column}
  .home-balance{align-items:flex-start;flex-direction:column}

  .mobile-nav{
    position:fixed;bottom:0;left:0;right:0;height:65px;
    background:#100b1a;border-top:1px solid #241733;
    display:flex;justify-content:space-around;align-items:center;z-index:500
  }

  .mobile-nav button{
    background:none;border:0;color:#aaa;font-size:12px
  }

  .mobile-nav button span{
    display:block;font-size:20px;margin-bottom:2px
  }
}
</style>
</head>

<body>

<div id="authGate">
  <div class="auth-box">
    <div class="logo">Delyvex</div>
    <p>Войди в аккаунт, чтобы пользоваться Delyvex</p>
    <button class="google-btn" onclick="loginWithGoogle()">
      Продолжить через Google
    </button>
  </div>
</div>

<header>

  <div class="header-logo">Delyvex</div>

  <div class="header-nav">

    <button class="nav-btn" onclick="showSection('home')">Главная</button>
    <button class="nav-btn" onclick="showSection('sell')">➕ Продать</button>
    <button class="nav-btn" onclick="showSection('chats')">💬 Чаты</button>
    <button class="nav-btn" onclick="showSection('orders')">📦 Заказы</button>
    <button class="nav-btn" onclick="showSection('balance')">💰 Баланс</button>
    <button class="nav-btn" onclick="showSection('profile')">👤 Профиль</button>

  </div>

  <div class="header-profile">
    <img id="headerAvatar" class="header-avatar hidden" src="" alt="">
  </div>

</header>

<main>

<section id="home" class="section active">

  <h1 class="page-title">Найти объявление</h1>

  <div class="home-balance">

    <div>
      <div class="home-balance-label">Твой баланс</div>

      <div id="homeBalance" class="home-balance-value">
        0.00 ₽
      </div>
    </div>

    <button class="primary-btn" onclick="showSection('balance')">
      💰 Баланс
    </button>

  </div>

  <div class="search-box">

    <input
      id="searchInput"
      type="text"
      placeholder="Игра, название или описание..."
      oninput="searchListings()"
    >

    <button class="primary-btn" onclick="searchListings()">
      Найти
    </button>

  </div>

  <div id="listingsContainer"></div>

</section>


<section id="sell" class="section">

  <h1 class="page-title">Продать</h1>

  <div class="card form-card">

    <div class="form-group">
      <label>Игра</label>
      <input id="sellGame" type="text" placeholder="Например: Minecraft">
    </div>

    <div class="form-group">
      <label>Название товара</label>
      <input id="sellTitle" type="text" placeholder="Название товара">
    </div>

    <div class="form-group">
      <label>Описание</label>
      <textarea id="sellDescription" placeholder="Опиши товар..."></textarea>
    </div>

    <div class="form-group">
      <label>Цена</label>
      <input id="sellPrice" type="number" min="0" placeholder="100">
    </div>

    <div class="form-group">

      <label>Картинка товара</label>

      <input
        id="sellImageFile"
        type="file"
        accept="image/*"
        onchange="previewProductImage()"
      >

      <img
        id="productImagePreview"
        class="product-preview hidden"
        alt="Предпросмотр"
      >

    </div>

    <button class="primary-btn" onclick="createListing()">
      Опубликовать
    </button>

  </div>

</section>


<section id="chats" class="section">

  <h1 class="page-title">Чаты</h1>

  <div id="chatsContainer"></div>

</section>


<section id="orders" class="section">

  <h1 class="page-title">Мои заказы</h1>

  <div id="ordersContainer"></div>

</section>


<section id="balance" class="section">

  <h1 class="page-title">Баланс</h1>

  <div id="balanceContainer"></div>

</section>


<section id="profile" class="section">

  <h1 class="page-title">Профиль</h1>

  <div class="card profile-card">

    <div class="profile-top">

      <img id="profileAvatar" class="profile-avatar" src="" alt="">

      <div>

        <div id="profileNickname" class="profile-name">
          Пользователь
        </div>

        <div id="profileEmail" class="profile-email"></div>

      </div>

    </div>

    <div class="rating-box">

      <div id="profileRating" class="rating-number">
        0.0
      </div>

      <div id="profileStars" class="rating-stars">
        ☆☆☆☆☆
      </div>

      <div id="profileReviewCount" class="rating-count">
        0 отзывов
      </div>

    </div>

    <div class="form-group">

      <label>Никнейм</label>

      <input
        id="nicknameInput"
        type="text"
        maxlength="30"
        placeholder="Введите никнейм"
      >

    </div>

    <div class="form-group">

      <label>Выбери аватар</label>

      <div id="avatarGrid" class="avatar-grid"></div>

    </div>

    <div class="selected-avatar">

      <img id="selectedAvatarPreview" src="" alt="">

    </div>

    <button class="primary-btn" onclick="saveProfile()">
      Сохранить профиль
    </button>

    <button
      class="primary-btn"
      style="margin-top:10px;background:#241733"
      onclick="logout()"
    >
      Выйти
    </button>

  </div>

</section>


<section id="chatWindow" class="section">

  <div class="chat-window">

    <button class="nav-btn" onclick="showSection('chats')">
      ← Назад
    </button>

    <h2 id="chatTitle">Чат</h2>

    <div id="chatMessages" class="chat-messages"></div>

    <div class="chat-send">

      <input
        id="chatInput"
        type="text"
        placeholder="Написать сообщение..."
        onkeydown="if(event.key==='Enter'){sendMessage()}"
      >

      <button class="primary-btn" onclick="sendMessage()">
        Отправить
      </button>

    </div>

  </div>

</section>

</main>


<div class="mobile-nav">

  <button onclick="showSection('home')">
    <span>⌂</span>
    Главная
  </button>

  <button onclick="showSection('sell')">
    <span>＋</span>
    Продать
  </button>

  <button onclick="showSection('chats')">
    <span>💬</span>
    Чаты
  </button>

  <button onclick="showSection('orders')">
    <span>📦</span>
    Заказы
  </button>

  <button onclick="showSection('profile')">
    <span>👤</span>
    Профиль
  </button>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://gisdufgixjfudblxydvm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_irNKt_PStZrQ2NCEdaD5sg_quCmigAn";

const sb =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const GITHUB_URL =
"https://tyronik2x2v2-stack.github.io/Delyvex/";


/* =========================================
   STATE
========================================= */

let currentUser = null;
let listings = [];
let currentBalance = 0;
let selectedAvatar = null;
let selectedProductImage = null;
let currentChat = null;
let currentReceiver = null;
let currentListing = null;
let appInitialized = false;
let listingsLoading = false;
let listingsRenderToken = 0;


/* =========================================
   AVATARS
========================================= */

function makeAvatar(bg,face){

  const svg = `
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="48" fill="${bg}"/>
    <circle cx="50" cy="39" r="20" fill="#ffffff"/>
    <path d="M18 88 C21 67 34 57 50 57 C66 57 79 67 82 88" fill="#ffffff"/>
    <circle cx="43" cy="39" r="3" fill="${face}"/>
    <circle cx="57" cy="39" r="3" fill="${face}"/>
    <path d="M43 48 Q50 53 57 48" stroke="${face}" stroke-width="3" fill="none" stroke-linecap="round"/>
  </svg>`;

  return "data:image/svg+xml;charset=UTF-8,"+
    encodeURIComponent(svg);
}

const AVATARS = [
  makeAvatar("#8b5cf6","#4c1d95"),
  makeAvatar("#ec4899","#831843"),
  makeAvatar("#3b82f6","#1e3a8a"),
  makeAvatar("#10b981","#064e3b"),
  makeAvatar("#f59e0b","#78350f"),
  makeAvatar("#ef4444","#7f1d1d"),
  makeAvatar("#06b6d4","#164e63"),
  makeAvatar("#84cc16","#365314"),
  makeAvatar("#a855f7","#581c87"),
  makeAvatar("#f97316","#7c2d12"),
  makeAvatar("#14b8a6","#134e4a"),
  makeAvatar("#e11d48","#881337"),
  makeAvatar("#6366f1","#312e81"),
  makeAvatar("#0ea5e9","#0c4a6e"),
  makeAvatar("#7c3aed","#4c1d95"),
  makeAvatar("#db2777","#831843"),
  makeAvatar("#059669","#064e3b"),
  makeAvatar("#ca8a04","#713f12"),
  makeAvatar("#dc2626","#7f1d1d"),
  makeAvatar("#4f46e5","#312e81")
];

selectedAvatar = AVATARS[0];


/* =========================================
   AUTH
========================================= */

async function loginWithGoogle(){

  try{

    const result =
      await sb.auth.signInWithOAuth({

        provider:"google",

        options:{
          redirectTo:GITHUB_URL,
          skipBrowserRedirect:false,
          queryParams:{
            access_type:"offline",
            prompt:"select_account"
          }
        }

      });

    if(result.error){

      alert(
        "Ошибка входа:\n\n"+
        result.error.message
      );

    }

  }catch(error){

    alert(
      "Ошибка входа:\n\n"+
      error.message
    );

  }

}

function showAuthGate(){

  document
    .getElementById("authGate")
    .classList.remove("hidden");

}

function hideAuthGate(){

  document
    .getElementById("authGate")
    .classList.add("hidden");

}


/* =========================================
   INITIALIZE
========================================= */

async function initialize(){

  if(appInitialized) return;

  const {
    data,
    error
  } =
    await sb.auth.getSession();

  if(error){

    console.error(error);
    return;

  }

  if(!data.session){

    showAuthGate();
    return;

  }

  currentUser =
    data.session.user;

  hideAuthGate();

  await ensureBalance();
  await loadProfile();
  await loadBalance();
  await loadListings();

  renderAvatars();

  appInitialized = true;

  await checkExpiredOrders();

  /*
    Проверяем, не вернулся ли пользователь
    после оплаты YooKassa.
  */
  await checkReturnedTopup();

}


sb.auth.onAuthStateChange(
  (event,session)=>{

    if(event==="SIGNED_OUT"){

      currentUser = null;
      appInitialized = false;
      listings = [];
      currentBalance = 0;

      showAuthGate();

      return;

    }

    if(
      session &&
      currentUser &&
      currentUser.id === session.user.id
    ){

      return;

    }

    if(session){

      currentUser =
        session.user;

      hideAuthGate();

      if(!appInitialized){
        initialize();
      }

    }

  }
);


/* =========================================
   BALANCE
========================================= */

async function ensureBalance(){

  if(!currentUser) return;

  const {
    data,
    error
  } =
    await sb.rpc(
      "get_my_balance"
    );

  if(error){

    console.error(error);
    currentBalance = 0;
    updateBalanceUI();
    return;

  }

  currentBalance =
    Number(data || 0);

  updateBalanceUI();

}


async function loadBalance(){

  if(!currentUser) return;

  const {
    data,
    error
  } =
    await sb.rpc(
      "get_my_balance"
    );

  if(error){

    console.error(error);
    currentBalance = 0;
    updateBalanceUI();
    return;

  }

  currentBalance =
    Number(data || 0);

  updateBalanceUI();

}


function updateBalanceUI(){

  const home =
    document.getElementById("homeBalance");

  if(home){

    home.textContent =
      currentBalance.toFixed(2)+" ₽";

  }

}


function canAfford(price){

  return currentBalance >= Number(price);

}


/* =========================================
   NAVIGATION
========================================= */

function showSection(section){

  if(!currentUser){

    showAuthGate();
    return;

  }

  document
    .querySelectorAll(".section")
    .forEach(
      element =>
        element.classList.remove("active")
    );

  const target =
    document.getElementById(section);

  if(target){
    target.classList.add("active");
  }

  if(section==="home"){

    loadBalance();
    searchListings();

  }

  if(section==="chats"){
    loadChats();
  }

  if(section==="orders"){
    loadOrders();
  }

  if(section==="balance"){
    loadBalancePage();
  }

  if(section==="profile"){
    loadProfile();
    renderAvatars();
  }

}


/* =========================================
   PROFILE
========================================= */

async function loadProfile(){

  if(!currentUser) return;

  const {
    data,
    error
  } =
    await sb
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(error){
    console.error(error);
  }

  const nickname =
    data?.nickname ||
    currentUser.user_metadata?.full_name ||
    currentUser.user_metadata?.name ||
    "Пользователь";

  let avatar =
    data?.avatar_url;

  if(
    !avatar ||
    !avatar.startsWith("data:image")
  ){
    avatar = AVATARS[0];

   RATING
========================================= */

async function loadProfileRating(userId){

  const {
    data,
    error
  } =
    await sb
      .from("reviews")
      .select("rating")
      .eq("seller_id",userId);

  if(error){

    console.error(error);
    return;

  }

  const reviews = data || [];
  const count = reviews.length;

  let average = 0;

  if(count){

    average =
      reviews.reduce(
        (sum,item)=>sum+Number(item.rating),
        0
      ) / count;

  }

  average =
    Math.round(average*10)/10;

  const rounded = Math.round(average);

  const stars =
    "★".repeat(rounded)+
    "☆".repeat(5-rounded);

  document.getElementById("profileRating").textContent =
    average.toFixed(1);

  document.getElementById("profileStars").textContent =
    stars;

  document.getElementById("profileReviewCount").textContent =
    getReviewText(count);

}


function getReviewText(count){

  if(count===0) return "0 отзывов";
  if(count===1) return "1 отзыв";

  if(count>=2 && count<=4)
    return count+" отзыва";

  return count+" отзывов";

}

async function loadListings(){

  if(listingsLoading)
    return;

  listingsLoading = true;

  const container =
    document.getElementById("listingsContainer");

  container.innerHTML =
    `<div class="empty">Загрузка объявлений...</div>`;

  try{

    const {
      data,
      error
    } =
      await sb
        .from("listings")
        .select("*")
        .order("created_at",{ascending:false});

    if(error){

      console.error(error);

      container.innerHTML =
        `<div class="empty">Ошибка загрузки объявлений.</div>`;

      return;

    }

    const unique = [];
    const seen = new Set();

    (data||[]).forEach(listing=>{

      const id = String(listing.id);

      if(seen.has(id))
        return;

      seen.add(id);
      unique.push(listing);

    });

    listings = unique;

    await renderListings(listings);

  }finally{

    listingsLoading = false;

  }

}


async function renderListings(items){

  const token =
    ++listingsRenderToken;

  const container =
    document.getElementById("listingsContainer");

  container.innerHTML = "";

  if(!items?.length){

    container.innerHTML =
      `<div class="empty">Объявлений пока нет.</div>`;

    return;

  }

  const uniqueItems = [];
  const seen = new Set();

  items.forEach(listing=>{

    const id = String(listing.id);

    if(seen.has(id))
      return;

    seen.add(id);
    uniqueItems.push(listing);

  });

  const sellerIds =
    [...new Set(
      uniqueItems.map(x=>x.seller_id)
    )];

  let profiles = [];
  let reviews = [];

  if(sellerIds.length){

    const {
      data:profileData
    } =
      await sb
        .from("profiles")
        .select("id,nickname,avatar_url")
        .in("id",sellerIds);

    profiles = profileData || [];

    const {
      data:reviewData
    } =
      await sb
        .from("reviews")
        .select("seller_id,rating")
        .in("seller_id",sellerIds);

    reviews = reviewData || [];

  }

  if(token !== listingsRenderToken)
    return;

  const profileMap = new Map();

  profiles.forEach(
    p=>profileMap.set(p.id,p)
  );

  const reviewMap = new Map();

  reviews.forEach(r=>{

    if(!reviewMap.has(r.seller_id)){
      reviewMap.set(r.seller_id,[]);
    }

    reviewMap
      .get(r.seller_id)
      .push(Number(r.rating));

  });

  uniqueItems.forEach(listing=>{

    if(token !== listingsRenderToken)
      return;

    const profile =
      profileMap.get(listing.seller_id);

    const sellerName =
      profile?.nickname || "Продавец";

    const sellerAvatar =
      profile?.avatar_url || AVATARS[0];

    const ratings =
      reviewMap.get(listing.seller_id) || [];

    const reviewCount = ratings.length;

    let rating = 0;

    if(reviewCount){

      rating =
        ratings.reduce((a,b)=>a+b,0) /
        reviewCount;

    }

    rating =
      Math.round(rating*10)/10;

    const price =
      Number(listing.price || 0);

    const image =
      listing.image_url ||
      "https://placehold.co/600x400/130d1f/c084fc?text=Нет+фото";

    const card =
      document.createElement("div");

    card.className =
      "card listing-card";

    let actions = "";

    if(
      currentUser &&
      listing.seller_id !== currentUser.id
    ){

      const affordable =
        canAfford(price);

      actions = `

        <div class="listing-actions">

          <button
            class="primary-btn"
            ${affordable ? "" : "disabled"}
            onclick="
              buyListing('${escapeJs(listing.id)}')
            "
          >
            🛒 ${
              affordable
                ? "Купить"
                : "Недостаточно средств"
            }
          </button>

          <button
            class="chat-btn"
            onclick="
              openChat(
                '${escapeJs(listing.id)}',
                '${escapeJs(listing.seller_id)}',
                '${escapeJs(listing.title || "Чат")}'
              )
            "
          >
            💬 Чат
          </button>

        </div>

        ${
          affordable
            ? ""
            : `
              <div class="insufficient">
                Баланс:
                ${currentBalance.toFixed(2)} ₽
                · Цена:
                ${price.toFixed(2)} ₽
              </div>
            `
        }

      `;

    }else{

      actions = `
        <div style="margin-top:14px;color:#888">
          Это твоё объявление
        </div>
      `;

    }

    card.innerHTML = `

      <img
        class="listing-image"
        src="${escapeHtml(image)}"
        alt="Товар"
      >

      <div class="listing-info">

        <div class="game-tag">
          ${escapeHtml(listing.game || "Игра")}
        </div>

        <div class="listing-title">
          ${escapeHtml(listing.title || "Без названия")}
        </div>

        <div class="description">
          ${escapeHtml(listing.description || "")}
        </div>

        <div class="price">
          ${price.toFixed(2)} ₽
        </div>

        <div class="seller-info">

          <img
            src="${escapeHtml(sellerAvatar)}"
            style="
              width:36px;
              height:36px;
              border-radius:50%;
              object-fit:cover;
              border:2px solid #8b5cf6;
            "
          >

          <div>

            <div class="seller-name">
              👤 ${escapeHtml(sellerName)}
            </div>

            <div class="seller-rating">
              ⭐ ${rating.toFixed(1)}
              · ${getReviewText(reviewCount)}
            </div>

          </div>

        </div>

        ${actions}

      </div>

    `;

    if(token === listingsRenderToken){
      container.appendChild(card);
    }

  });

}


async function searchListings(){

      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  if(!query){

    await renderListings(listings);
    return;

  }

  const result =
    listings.filter(item=>{

      const game =
        String(item.game || "").toLowerCase();

      const title =
        String(item.title || "").toLowerCase();

      const description =
        String(item.description || "").toLowerCase();

      return(
        game.includes(query) ||
        title.includes(query) ||
        description.includes(query)
      );

    });

  await renderListings(result);

}

async function buyListing(listingId){

  if(!currentUser){

    showAuthGate();
    return;

  }

  const listing =
    listings.find(
      item =>
        String(item.id) === String(listingId)
    );

  if(!listing){

    alert("Объявление не найдено.");
    return;

  }

  const price =
    Number(listing.price || 0);

  if(listing.seller_id === currentUser.id){

    alert("Нельзя купить собственный товар.");
    return;

  }

  if(currentBalance < price){

    alert(
      `Недостаточно средств.\n\n`+
      `Твой баланс: ${currentBalance.toFixed(2)} ₽\n`+
      `Цена товара: ${price.toFixed(2)} ₽`
    );

    await loadBalance();
    await renderListings(listings);
    return;

  }

  const confirmed =
    confirm(
      `Купить "${listing.title}" за ${price.toFixed(2)} ₽?\n\n`+
      `После покупки продавец получит уведомление в чате.`
    );

  if(!confirmed)
    return;

  const {
    data,
    error
  } =
    await sb.rpc(
      "create_test_purchase",
      {
        p_listing_id:Number(listingId)
      }
    );

  if(error){

    console.error(error);

    alert(
      error.message ||
      "Ошибка покупки."
    );

    await loadBalance();
    await renderListings(listings);
    return;

  }

  if(!data?.success){

    alert("Не удалось создать заказ.");
    return;

  }

  currentBalance =
    Number(data.balance || 0);

  updateBalanceUI();

  /*
    Автоматическое сообщение продавцу
    после успешной покупки.
  */

  try{

    const nickname =
      await getCurrentNickname();

    await sb
      .from("messages")
      .insert({

        listing_id:Number(listingId),
        sender_id:currentUser.id,
        receiver_id:listing.seller_id,
        message:
          `SYSTEM_PURCHASE|${nickname}|${listing.title || "товар"}`

      });

  }catch(messageError){

    console.error(
      "Не удалось создать системное сообщение:",
      messageError
    );

  }

  await renderListings(listings);

  alert(
    "✅ Покупка оформлена!\n\n"+
    `Списано: ${price.toFixed(2)} ₽\n`+
    `Остаток: ${currentBalance.toFixed(2)} ₽`
  );

  showSection("orders");

  await loadOrders();

}

async function loadOrders(){

  if(!currentUser)
    return;

  await checkExpiredOrders();

  const container =
    document.getElementById("ordersContainer");

  container.innerHTML =
    `<div class="empty">Загрузка заказов...</div>`;

  const {
    data,
    error
  } =
    await sb
      .from("purchases")
      .select("*")
      .or(
        `buyer_id.eq.${currentUser.id},seller_id.eq.${currentUser.id}`
      )
      .order("created_at",{ascending:false});

  if(error){

    console.error(error);

    container.innerHTML =
      `<div class="empty">Ошибка загрузки заказов.</div>`;

    return;

  }

  if(!data?.length){

    container.innerHTML =
      `<div class="empty">Заказов пока нет.</div>`;

    return;

  }

  container.innerHTML = "";

  for(const order of data){

    const isBuyer =
      order.buyer_id === currentUser.id;

    const isSeller =
      order.seller_id === currentUser.id;

    const {
      data:listing
    } =
      await sb
        .from("listings")
        .select("id,title,game,image_url,seller_id")
        .eq("id",order.listing_id)
        .maybeSingle();

    if(!listing)
      continue;

    const card =
      document.createElement("div");

    card.className = "order-card";

    let buttons = "";

    if(
      isBuyer &&
      order.status === "waiting_confirmation"
    ){

      buttons = `

        <button
          class="primary-btn"
          style="margin-top:13px"
          onclick="confirmOrder('${order.id}')"
        >
          ✅ Подтвердить получение
        </button>

      `;

    }

    if(
      isSeller &&
      order.status === "completed"
    ){

      buttons = `

        <div style="
          margin-top:12px;
          color:#86efac;
          font-weight:700;
        ">
          💰 Деньги начислены на баланс
        </div>

      `;

    }

    let reviewButton = "";

    if(
      isBuyer &&
      order.status === "completed"
    ){

      const {
        data:existingReview,
        error:reviewCheckError
      } =
        await sb
          .from("reviews")
          .select("id")
          .eq("purchase_id",order.id)
          .maybeSingle();

      if(reviewCheckError){
        console.error(reviewCheckError);
      }

      if(!existingReview){

        reviewButton = `

          <div class="review-box">

            <button
              class="primary-btn"
              onclick="
                writeReview(
                  ${JSON.stringify(order.id)},
                  ${JSON.stringify(listing.id)}
                )
              "
            >
              ⭐ Оставить отзыв
            </button>

          </div>

        `;

      }else{

        reviewButton = `

          <div class="review-box">

            <div style="
              color:#86efac;
              font-weight:700;
            ">
              ⭐ Ты уже оставил отзыв
            </div>

          </div>

        `;

      }

    }

    let timer = "";

    if(
      isBuyer &&
      order.status === "waiting_confirmation" &&
      order.auto_confirm_at
    ){

      timer = `

        <div class="small">
          Автоподтверждение:
          ${formatDate(new Date(order.auto_confirm_at))}
        </div>

      `;

    }

    card.innerHTML = `

      <div class="order-title">
        ${escapeHtml(listing.title || "Товар")}
      </div>

      <div class="small">
        ${escapeHtml(listing.game || "Игра")}
      </div>

      <div style="
        color:#c084fc;
        font-size:20px;
        font-weight:800;
        margin-top:9px;
      ">
        ${Number(order.price).toFixed(2)} ₽
      </div>

      <div class="status">
        ${getOrderStatusText(order.status)}
      </div>

      <div class="small">
        ${
          isBuyer
            ? "Покупатель: ты"
            : "Продавец: ты"
        }
      </div>

      ${timer}
      ${buttons}
      ${reviewButton}

    `;

    container.appendChild(card);

  }

}


function getOrderStatusText(status){

  const map = {

    waiting_payment:"⏳ Ожидается оплата",
    waiting_confirmation:"📦 Ожидает подтверждения",
    completed:"✅ Завершён",
    cancelled:"❌ Отменён",
    refunded:"↩️ Возврат"

  };

  return map[status] || status;

}


function formatDate(date){

  return date.toLocaleString(
    "ru-RU",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}

/* =========================================

========================================= */

async function checkExpiredOrders(){

  if(!currentUser)
    return;

  const {
    data,
    error
  } =
    await sb
      .from("purchases")
      .select("id,auto_confirm_at,status")
      .eq("buyer_id",currentUser.id)
      .eq("status","waiting_confirmation")
      .not("auto_confirm_at","is",null);

  if(error){

    console.error(error);
    return;

  }

  const now = Date.now();

  for(const order of data || []){

    const deadline =
      new Date(order.auto_confirm_at).getTime();

    if(now >= deadline){

      const {
        error:completeError
      } =
        await sb.rpc(
          "complete_purchase",
          {
            p_purchase_id:Number(order.id),
            p_is_auto:true
          }
        );

      if(completeError){

        console.error(
          "Auto confirm:",
          completeError
        );

      }

    }

  }

}

async function writeReview(purchaseId,listingId){

  if(!currentUser)
    return;

  const {
    data:existingReview,
    error:checkError
  } =
    await sb
      .from("reviews")
      .select("id")
      .eq("purchase_id",Number(purchaseId))
      .maybeSingle();

  if(checkError){
    console.error(checkError);
  }

  if(existingReview){

    alert("Ты уже оставил отзыв на этот заказ.");
    return;

  }

  const {
    data:purchase,
    error:purchaseError
  } =
    await sb
      .from("purchases")
      .select("*")
      .eq("id",Number(purchaseId))
      .eq("buyer_id",currentUser.id)
      .maybeSingle();

  if(purchaseError || !purchase){

    alert("Заказ не найден.");
    return;

  }

  if(purchase.status !== "completed"){

    alert(
      "Оставить отзыв можно только после завершения заказа."
    );

    return;

  }

  const ratingText =
    prompt("Оцени продавца от 1 до 5:");

  if(ratingText === null)
    return;

  const rating =
    Number(ratingText);

  if(
    !Number.isInteger(rating) ||
    rating < 1 ||
    rating > 5
  ){

    alert("Оценка должна быть от 1 до 5.");
    return;

  }

  const review =
    prompt("Напиши отзыв о продавце:");

  if(review === null)
    return;

  const {
    error
  } =
    await sb
      .from("reviews")
      .insert({

        purchase_id:Number(purchaseId),
        listing_id:Number(listingId),
        buyer_id:currentUser.id,
        seller_id:purchase.seller_id,
        rating:rating,
        review:review.trim()

      });

  if(error){

    alert(

  }

  alert("⭐ Спасибо! Отзыв сохранён.");

/*
  Создаём платёж через Supabase Edge Function.
*/

async function startTopup(){

  if(!currentUser){

    showAuthGate();
    return;

  }

  const input =
    document.getElementById("topupAmount");

  if(!input)
    return;

  const amount =
    Number(input.value);

  if(
    !Number.isFinite(amount) ||
    amount < 10 ||
    amount > 100000
  ){

    alert(
      "Сумма должна быть от 10 до 100000 ₽."
    );

    return;

  }

  const button =
    input
      .closest(".topup-box")
      ?.querySelector("button");

  if(button){

    button.disabled = true;
    button.textContent = "Создаём платёж...";

  }

  try{

    const {
      data:sessionData
    } =
      await sb.auth.getSession();

    const accessToken =
      sessionData?.session?.access_token;

    if(!accessToken){

      alert(
        "Сессия закончилась. Войди в аккаунт снова."
      );

      return;

    }

    const response =
      await fetch(
        `${SUPABASE_URL}/functions/v1/create-topup`,
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json",
            "Authorization":
              `Bearer ${accessToken}`,
            "apikey":
              SUPABASE_KEY
          },

          body:JSON.stringify({
            amount:
              Math.round(amount*100)/100
          })
        }
      );

    const result =
      await response.json();

    if(!response.ok){

      throw new Error(
        result?.error ||
        "Не удалось создать платёж."
      );

    }

    if(!result?.confirmation_url){

      throw new Error(
        "Платёж создан, но ссылка на оплату не получена."
      );

    }

    /*
      Сохраняем ID, чтобы после возврата
      на сайт проверить пополнение.
    */

    sessionStorage.setItem(
      "delyvex_topup_id",
      String(result.topup_id || "")
    );

    sessionStorage.setItem(
      "delyvex_payment_id",
      String(result.payment_id || "")
    );

    window.location.href =
      result.confirmation_url;

  }catch(error){

    console.error(error);

    alert(
      "Ошибка создания платежа:\n\n"+
      error.message
    );

    if(button){

      button.disabled = false;
      button.textContent = "Перейти к оплате";

    }

  }

}


/*
  Вызывается после возврата пользователя
  с YooKassa.

  Пока webhook не будет настроен,
  эта функция просто обновляет баланс.
*/

async function checkReturnedTopup(){

  const topupId =
    sessionStorage.getItem(
      "delyvex_topup_id"
    );

  const paymentId =
    sessionStorage.getItem(
      "delyvex_payment_id"
    );

  if(!topupId && !paymentId)
    return;

  /*
    Удаляем данные сразу, чтобы повторный
    заход не запускал проверку бесконечно.
  */

  sessionStorage.removeItem(
    "delyvex_topup_id"
  );

  sessionStorage.removeItem(
    "delyvex_payment_id"
  );

  await new Promise(
    resolve =>
      setTimeout(resolve,1500)
  );

  await loadBalance();

  /*
    Если баланс уже пополнился через webhook,
    показываем уведомление.
  */

  if(
    paymentId ||
    topupId
  ){

    console.log(
      "Возврат после оплаты:",
      {
        topupId,
        paymentId
      }
    );

  }

}


/* =========================================
   WITHDRAW
========================================= */

function showWithdrawForm(){

  const area =
    document.getElementById("withdrawArea");

  if(!area)
    return;

  area.innerHTML = `

    <div class="withdraw-box">

      <div class="form-group">

        <label>
          Сумма вывода
        </label>

        <input
          id="withdrawAmount"
          type="number"
          min="21"
          step="0.01"
          placeholder="Например: 500"
          oninput="calculateWithdraw()"
        >

      </div>

      <div
        id="withdrawCalculation"
        class="withdraw-result"
      >
        Комиссия: 20 ₽
      </div>

      <button
        class="primary-btn"
        style="margin-top:10px"
        onclick="createWithdrawal()"
      >
        Создать заявку
      </button>

    </div>

  `;

}


function calculateWithdraw(){

  const input =
    document.getElementById("withdrawAmount");

  const result =
    document.getElementById("withdrawCalculation");

  if(!input || !result)
    return;

  const amount =
    Number(input.value);

  if(!amount){

    result.textContent =
      "Комиссия: 20 ₽";

    return;

  }

  if(amount <= 20){

    result.textContent =
      "Минимальная сумма должна быть больше 20 ₽.";

    return;

  }

  const payout =
    amount - 20;

  result.innerHTML = `

    Сумма вывода:
    <b>${amount.toFixed(2)} ₽</b>
    <br>

    Комиссия:
    <b>20.00 ₽</b>
    <br>

    К выплате:
    <b style="color:#c084fc">
      ${payout.toFixed(2)} ₽
    </b>

  `;

}


async function createWithdrawal(){

  const input =
    document.getElementById("withdrawAmount");

  if(!input)
    return;

  const amount =
    Number(input.value);

  if(!amount || amount <= 20){

    alert(
      "Сумма вывода должна быть больше 20 ₽."
    );

    return;

  }

  const ok =
    confirm(
      `Создать заявку на вывод ${amount.toFixed(2)} ₽?\n\n`+
      `Комиссия: 20 ₽\n`+
      `К выплате: ${(amount-20).toFixed(2)} ₽`
    );

  if(!ok)
    return;

  const {
    data,
    error
  } =
    await sb.rpc(
      "create_withdrawal",
      {
        p_amount:amount
      }
    );

  if(error){

    alert(
      "Ошибка создания заявки:\n\n"+
      error.message
    );

    return;

  }

  alert(
    "✅ Заявка создана!\n\n"+
    "К выплате: "+
    Number(
      data?.payout_amount ||
      amount-20
    ).toFixed(2)+
    " ₽"
  );

  await loadBalancePage();

}


/* =========================================
   CHATS
========================================= */

async function loadChats(){

  if(!currentUser)
    return;

  const container =
    document.getElementById("chatsContainer");

  container.innerHTML =
    `<div class="empty">Загрузка чатов...</div>`;

  const {
    data,
    error
  } =
    await sb
      .from("messages")
      .select("*")
      .or(
        `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
      )
      .order("created_at",{ascending:false});

  if(error){

    console.error(error);

    container.innerHTML =
      `<div class="empty">Ошибка загрузки чатов.</div>`;

    return;

  }

  if(!data?.length){

    container.innerHTML =
      `<div class="empty">У тебя пока нет чатов.</div>`;

    return;

  }

  const chats =
    new Map();

  data.forEach(message=>{

    const other =
      message.sender_id === currentUser.id
        ? message.receiver_id
        : message.sender_id;

    if(!chats.has(other)){
      chats.set(other,message);
    }

  });

  container.innerHTML = "";

  chats.forEach((message,otherId)=>{

    const item =
      document.createElement("div");

    item.className = "chat-item";

    const isSystem =
      String(message.message || "")
        .startsWith("SYSTEM_PURCHASE|");

    item.innerHTML = `

      <strong>💬 Чат</strong>

      <div style="
        color:#999;
        margin-top:6px;
      ">
        ${
          isSystem
            ? formatSystemMessage(message.message)
            : escapeHtml(message.message)
        }
      </div>

    `;

    item.onclick = ()=>{

      openChat(
        message.listing_id,
        otherId,
        "Чат"
      );

    };

    container.appendChild(item);

  });

}


async function openChat(
  listingId,
  receiverId,
  title
){

  currentChat = listingId;
  currentReceiver = receiverId;
  currentListing = listingId;

  document.getElementById("chatTitle").textContent =
    title || "Чат";

  showSection("chatWindow");

  await loadMessages();

}


function formatSystemMessage(message){

  const parts =
    String(message).split("|");

  if(parts[0] !== "SYSTEM_PURCHASE"){

    return escapeHtml(message);

  }

  const nickname =
    parts[1] || "Пользователь";

  const title =
    parts.slice(2).join("|") || "товар";

  return `
    🛒
    <b>${escapeHtml(nickname)}</b>
    купил товар
    <b>«${escapeHtml(title)}»</b>
  `;

}


async function loadMessages(){

  const container =
    document.getElementById("chatMessages");

  container.innerHTML =
    `<div class="empty">Загрузка...</div>`;

  const {
    data,
    error
  } =
    await sb
      .from("messages")
      .select("*")
      .eq("listing_id",currentChat)
      .or(
        `and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentReceiver}),and(sender_id.eq.${currentReceiver},receiver_id.eq.${currentUser.id})`
      )
      .order("created_at",{ascending:true});

  if(error){

    console.error(error);

    container.innerHTML =
      `<div class="empty">Ошибка загрузки сообщений.</div>`;

    return;

  }

  container.innerHTML = "";

  if(!data?.length){

    container.innerHTML =
      `<div class="empty">Начни общение.</div>`;

    return;

  }

  data.forEach(message=>{

    const text =
      String(message.message || "");

    if(text.startsWith("SYSTEM_PURCHASE|")){

      const div =
        document.createElement("div");

      div.className =
        "system-message";

      div.innerHTML =
        formatSystemMessage(text);

      container.appendChild(div);

      return;

    }

    const div =
      document.createElement("div");

    div.className =
      "message "+
      (
        message.sender_id === currentUser.id
          ? "mine"
          : "theirs"
      );

    div.textContent = text;

    container.appendChild(div);

  });

  container.scrollTop =
    container.scrollHeight;

}


async function sendMessage(){

  if(
    !currentUser ||
    !currentReceiver
  )
    return;

  const input =
    document.getElementById("chatInput");

  const message =
    input.value.trim();

  if(!message)
    return;

  const {
    error
  } =
    await sb
      .from("messages")
      .insert({

        listing_id:currentListing,
        sender_id:currentUser.id,
        receiver_id:currentReceiver,
        message:message

      });

  if(error){

    alert(
      "Ошибка отправки:\n\n"+
      error.message
    );

    return;

  }

  input.value = "";

  await loadMessages();

}

  await sb.auth.signOut();

  listings = [];
  currentBalance = 0;
  appInitialized = false;

  listingsRenderToken++;

  showAuthGate();

}


/* =========================================
   HELPERS
========================================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeJs(value){

  return String(value)
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'")
    .replaceAll("\n"," ")
    .replaceAll("\r"," ");

}

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delyvex</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f6f8;
  color:#111;
}

header{
  height:70px;
  background:#fff;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:25px;
  font-weight:bold;
  cursor:pointer;
}

nav{
  display:flex;
  gap:8px;
}

nav button{
  border:0;
  background:transparent;
  padding:10px 13px;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
}

nav button:hover{
  background:#eee;
}

.user{
  display:flex;
  align-items:center;
  gap:8px;
}

.btn{
  border:0;
  background:#111;
  color:#fff;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.btn:hover{
  opacity:.9;
}

.btn.secondary{
  background:#eee;
  color:#111;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  object-fit:cover;
  border:1px solid #ddd;
}

.container{
  max-width:1100px;
  margin:30px auto;
  padding:0 20px 80px;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

h1{
  margin-top:0;
}

.card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  padding:18px;
  margin-bottom:15px;
}

.search-box{
  margin-bottom:20px;
}

.listings{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:16px;
}

.listing{
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  overflow:hidden;
}

.listing img{
  width:100%;
  height:190px;
  object-fit:cover;
  background:#eee;
}

.listing-content{
  padding:15px;
}

.listing-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:8px;
}

.listing-game{
  display:inline-block;
  background:#eee;
  color:#333;
  padding:5px 9px;
  border-radius:999px;
  font-size:12px;
  margin-bottom:8px;
}

.price{
  font-size:18px;
  font-weight:bold;
  margin:10px 0;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
  margin-top:6px;
  margin-bottom:15px;
  background:#fff;
}

textarea{
  min-height:110px;
  resize:vertical;
}

label{
  display:block;
  font-weight:bold;
  margin-top:10px;
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.profile-box{
  max-width:600px;
}

.profile-avatar-preview{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  border:1px solid #ddd;
  display:block;
  margin-bottom:15px;
  background:#eee;
}

.conversation{
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  padding:14px;
  margin-bottom:10px;
  cursor:pointer;
  display:flex;
  gap:12px;
  align-items:center;
}

.conversation:hover{
  background:#f8f8f8;
}

.conversation-avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:#eee;
  flex-shrink:0;
}

.conversation-info{
  flex:1;
  min-width:0;
}

.conversation-name{
  font-weight:bold;
  margin-bottom:4px;
}

.conversation-listing{
  font-size:13px;
  color:#777;
  margin-bottom:4px;
}

.conversation-message{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#555;
}

.conversation-date{
  font-size:12px;
  color:#999;
}

.chat{
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  overflow:hidden;
}

.chat-header{
  padding:15px;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  gap:12px;
}

.chat-messages{
  height:450px;
  overflow-y:auto;
  padding:15px;
  background:#f7f7f7;
}

.message{
  max-width:75%;
  padding:10px 13px;
  border-radius:12px;
  margin-bottom:8px;
  word-wrap:break-word;
}

.message.mine{
  margin-left:auto;
  background:#111;
  color:#fff;
  border-bottom-right-radius:3px;
}

.message.theirs{
  margin-right:auto;
  background:#fff;
  border:1px solid #ddd;
  border-bottom-left-radius:3px;
}

.message-time{
  font-size:10px;
  opacity:.6;
  margin-top:4px;
}

.chat-input{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid #ddd;
}

.chat-input textarea{
  margin:0;
  min-height:45px;
  max-height:120px;
}

.empty{
  text-align:center;
  color:#777;
  padding:30px;
}

.mobile-nav{
  display:none;
}

@media(max-width:800px){
  header{
    padding:0 12px;
  }

  header nav{
    display:none;
  }

  .user #userName{
    display:none;
  }

  .container{
    margin-top:20px;
  }

  .form-row{
    grid-template-columns:1fr;
  }

  .mobile-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:62px;
    background:#fff;
    border-top:1px solid #ddd;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:200;
  }

  .mobile-nav button{
    border:0;
    background:transparent;
    font-size:12px;
    padding:7px;
    cursor:pointer;
  }

  .message{
    max-width:88%;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo" onclick="showSection('home')">
    Delyvex
  </div>

  <nav>

    <button onclick="showSection('home')">
      Главная
    </button>

    <button onclick="showSection('sell')">
      ➕ Продать
    </button>

    <button onclick="showSection('messages')">
      💬 Чаты
    </button>

    <button onclick="showSection('profile')">
      👤 Профиль
    </button>

  </nav>

  <div class="user">

    <span id="userName"></span>

    <img
      id="headerAvatar"
      class="avatar"
      style="display:none"
      alt="avatar"
    >

    <button
      id="messagesBtn"
      class="btn secondary"
      onclick="showSection('messages')"
      style="display:none"
    >
      💬 Чаты
    </button>

    <button
      id="loginBtn"
      class="btn"
      onclick="loginWithGoogle()"
    >
      Войти
    </button>

    <button
      id="logoutBtn"
      class="btn secondary"
      style="display:none"
      onclick="logout()"
    >
      Выйти
    </button>

  </div>

</header>


<div class="container">

  <!-- ГЛАВНАЯ -->

  <section id="home" class="section active">

    <h1>Объявления</h1>

    <div class="card search-box">

      <label>
        Поиск по игре
      </label>

      <input
        id="gameSearch"
        type="search"
        placeholder="Например: Minecraft, Fortnite, GTA V..."
        oninput="filterListings()"
      >

    </div>

    <div
      id="listings"
      class="listings"
    ></div>

  </section>


  <!-- ПРОДАЖА -->

  <section id="sell" class="section">

    <h1>Продать товар</h1>

    <div class="card">

      <label>
        Игра
      </label>

      <input
        id="listingGame"
        type="text"
        placeholder="Например: Minecraft"
      >

      <label>
        Название
      </label>

      <input
        id="listingTitle"
        type="text"
        placeholder="Например: аккаунт Minecraft"
      >

      <label>
        Описание
      </label>

      <textarea
        id="listingDescription"
        placeholder="Расскажи о товаре..."
      ></textarea>

      <div class="form-row">

        <div>

          <label>
            Цена
          </label>

          <input
            id="listingPrice"
            type="number"
            placeholder="0"
          >

        </div>

        <div>

          <label>
            Категория
          </label>

          <input
            id="listingCategory"
            type="text"
            placeholder="Аккаунты"
          >

        </div>

      </div>

      <label>
        Ссылка на изображение товара
      </label>

      <input
        id="listingImage"
        type="text"
        placeholder="https://..."
      >

      <button
        class="btn"
        onclick="createListing()"
      >
        Опубликовать
      </button>

    </div>

  </section>


  <!-- ЧАТЫ -->

  <section id="messages" class="section">

    <h1>Чаты</h1>

    <div id="conversations"></div>

    <div
      id="chatContainer"
      style="display:none"
    >

      <div class="chat">

        <div class="chat-header">

          <button
            class="btn secondary"
            onclick="closeChat()"
          >
            ←
          </button>

          <img
            id="chatAvatar"
            class="conversation-avatar"
            alt="avatar"
          >

          <div>

            <div
              id="chatName"
              class="conversation-name"
            ></div>

            <div
              id="chatListing"
              class="conversation-listing"
            ></div>

          </div>

        </div>

        <div
          id="chatMessages"
          class="chat-messages"
        ></div>

        <div class="chat-input">

          <textarea
            id="messageInput"
            placeholder="Написать сообщение..."
            onkeydown="handleMessageKey(event)"
          ></textarea>

          <button
            class="btn"
            onclick="sendMessage()"
          >
            Отправить
          </button>

        </div>

      </div>

    </div>

  </section>


  <!-- ПРОФИЛЬ -->

  <section id="profile" class="section">

    <h1>Профиль</h1>

    <div class="card profile-box">

      <img
        id="profileAvatarPreview"
        class="profile-avatar-preview"
        alt="avatar"
        style="display:none"
      >

      <label>
        Аватарка
      </label>

      <input
        id="profileAvatarFile"
        type="file"
        accept="image/*"
      >

      <div
        style="
          font-size:13px;
          color:#777;
          margin-top:-8px;
          margin-bottom:15px;
        "
      >
        Максимальный размер: 10 МБ
      </div>

      <label>
        Никнейм
      </label>

      <input
        id="profileNameInput"
        type="text"
        placeholder="Твой никнейм"
      >

      <button
        class="btn"
        onclick="saveProfile()"
      >
        Сохранить
      </button>

    </div>

  </section>

</div>


<!-- МОБИЛЬНАЯ НАВИГАЦИЯ -->

<div class="mobile-nav">

  <button onclick="showSection('home')">
    🏠<br>
    Главная
  </button>

  <button onclick="showSection('sell')">
    ➕<br>
    Продать
  </button>

  <button onclick="showSection('messages')">
    💬<br>
    Чаты
  </button>

  <button onclick="showSection('profile')">
    👤<br>
    Профиль
  </button>

</div>


<script>

const SUPABASE_URL =
  "https://gisdufgixjfudblxydvm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_irNKt_PStZrQ2NCEdaD5sg_quCmigAn";

const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const GITHUB_URL =
  "https://tyronik2x2v2-stack.github.io/Delyvex/";


let currentUser = null;
let currentChat = null;
let chatChannel = null;

let allListings = [];


/* =========================
   НАВИГАЦИЯ
========================= */

function showSection(section){

  document
    .querySelectorAll(".section")
    .forEach(el=>{
      el.classList.remove("active");
    });

  const target =
    document.getElementById(section);

  if(target){
    target.classList.add("active");
  }

  if(section === "home"){
    loadListings();
  }

  if(section === "messages"){
    loadConversations();
  }

  if(section === "profile"){
    loadProfile();
  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =========================
   GOOGLE LOGIN
========================= */

async function loginWithGoogle(){

  try{

    const result =
      await sb.auth.signInWithOAuth({

        provider:"google",

        options:{
          redirectTo:GITHUB_URL,

          skipBrowserRedirect:false,

          queryParams:{
            access_type:"offline",
            prompt:"select_account"
          }
        }

      });

    if(result.error){

      console.error(
        "Google OAuth error:",
        result.error
      );

      alert(
        "Ошибка входа через Google:\n\n" +
        result.error.message
      );
    }

  }catch(error){

    console.error(error);

    alert(
      "Ошибка входа:\n\n" +
      error.message
    );
  }
}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await sb.auth.signOut();

  currentUser = null;

  currentChat = null;

  if(chatChannel){
    await sb.removeChannel(chatChannel);
    chatChannel = null;
  }

  updateAuthUI();

  showSection("home");
}


/* =========================
   AUTH
========================= */

async function checkAuth(){

  const {
    data,
    error
  } = await sb.auth.getSession();

  if(error){
    console.error(error);
    return;
  }

  currentUser =
    data.session
      ? data.session.user
      : null;

  updateAuthUI();

  if(currentUser){

    loadProfile();
    loadListings();

  }else{

    loadListings();

  }

}


sb.auth.onAuthStateChange(
  async(event, session)=>{

    currentUser =
      session
        ? session.user
        : null;

    updateAuthUI();

    if(currentUser){

      await loadProfile();

      await loadListings();

    }

  }
);


/* =========================
   AUTH UI
========================= */

async function updateAuthUI(){

  const loginBtn =
    document.getElementById("loginBtn");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const userName =
    document.getElementById("userName");

  const headerAvatar =
    document.getElementById("headerAvatar");

  const messagesBtn =
    document.getElementById("messagesBtn");


  if(!currentUser){

    loginBtn.style.display =
      "inline-block";

    logoutBtn.style.display =
      "none";

    messagesBtn.style.display =
      "none";

    userName.textContent = "";

    headerAvatar.style.display =
      "none";

    return;
  }


  loginBtn.style.display =
    "none";

  logoutBtn.style.display =
    "inline-block";

  messagesBtn.style.display =
    "inline-block";


  const profile =
    await getProfile(
      currentUser.id
    );


  userName.textContent =
    profile?.username ||
    currentUser.user_metadata?.full_name ||
    currentUser.email ||
    "";


  if(profile?.avatar_url){

    headerAvatar.src =
      profile.avatar_url;

    headerAvatar.style.display =
      "block";

  }else{

    headerAvatar.style.display =
      "none";

  }

}


/* =========================
   PROFILE
========================= */

async function getProfile(userId){

  const {
    data,
    error
  } = await sb
    .from("profiles")
    .select("*")
    .eq("id",userId)
    .maybeSingle();

  if(error){

    console.error(
      "Profile error:",
      error
    );

    return null;
  }

  return data;
}


async function getProfileName(userId){

  const profile =
    await getProfile(userId);

  if(profile?.username){
    return profile.username;
  }

  return "Пользователь";
}


async function getProfileAvatar(userId){

  const profile =
    await getProfile(userId);

  return profile?.avatar_url || "";
}


/* =========================
   LISTINGS
========================= */

async function loadListings(){

  const container =
    document.getElementById("listings");

  if(!container){
    return;
  }


  container.innerHTML =
    '<div class="empty">Загрузка...</div>';


  const {
    data,
    error
  } = await sb
    .from("listings")
    .select("*")
    .order(
      "created_at",
      {ascending:false}
    );


  if(error){

    console.error(error);

    container.innerHTML =
      '<div class="empty">Ошибка загрузки объявлений.</div>';

    return;
  }


  allListings =
    data || [];


  renderListings(
    allListings
  );
}


/* =========================
   ФИЛЬТР ПО ИГРЕ
========================= */

function filterListings(){

  const input =
    document.getElementById(
      "gameSearch"
    );


  const query =
    input
      ? input.value.trim().toLowerCase()
      : "";


  if(!query){

    renderListings(
      allListings
    );

    return;
  }


  const filtered =
    allListings.filter(item=>{

      const game =
        String(
          item.game || ""
        ).toLowerCase();


      const title =
        String(
          item.title || ""
        ).toLowerCase();


      const description =
        String(
          item.description || ""
        ).toLowerCase();


      return (
        game.includes(query) ||
        title.includes(query) ||
        description.includes(query)
      );

    });


  renderListings(
    filtered
  );
}


/* =========================
   RENDER LISTINGS
========================= */

function renderListings(items){

  const container =
    document.getElementById(
      "listings"
    );


  if(!items || items.length === 0){

    container.innerHTML =
      '<div class="empty">По этому запросу объявлений нет.</div>';

    return;
  }


  container.innerHTML =
    items
      .map(listingHTML)
      .join("");
}


/* =========================
   LISTING HTML
========================= */

function listingHTML(item){

  const image =
    item.image_url ||
    "https://via.placeholder.com/600x400?text=Delyvex";


  const price =
    item.price != null
      ? `${item.price} €`
      : "Цена не указана";


  return `
    <div class="listing">

      <img
        src="${escapeHTML(image)}"
        alt=""
        onerror="
          this.src='https://via.placeholder.com/600x400?text=Delyvex'
        "
      >

      <div class="listing-content">

        ${
          item.game
          ? `
            <div class="listing-game">
              🎮 ${escapeHTML(item.game)}
            </div>
          `
          : ""
        }

        <div class="listing-title">
          ${escapeHTML(item.title || "Без названия")}
        </div>

        <div>
          ${escapeHTML(item.description || "")}
        </div>

        <div class="price">
          ${escapeHTML(price)}
        </div>

        ${
          currentUser &&
          currentUser.id !== item.user_id
          ? `
            <button
              class="btn"
              onclick="openChat(
                '${item.id}',
                '${item.user_id}',
                '${escapeJS(item.title || "")}'
              )"
            >
              💬 Написать продавцу
            </button>
          `
          : ""
        }

      </div>

    </div>
  `;
}


/* =========================
   CREATE LISTING
========================= */

async function createListing(){

  if(!currentUser){

    alert(
      "Сначала войди в аккаунт."
    );

    return;
  }


  const game =
    document
      .getElementById("listingGame")
      .value
      .trim();


  const title =
    document
      .getElementById("listingTitle")
      .value
      .trim();


  const description =
    document
      .getElementById("listingDescription")
      .value
      .trim();


  const priceValue =
    document
      .getElementById("listingPrice")
      .value;


  const category =
    document
      .getElementById("listingCategory")
      .value
      .trim();


  const image =
    document
      .getElementById("listingImage")
      .value
      .trim();


  if(!game){

    alert(
      "Напиши название игры."
    );

    return;
  }


  if(!title){

    alert(
      "Введите название товара."
    );

    return;
  }


  const price =
    priceValue
      ? Number(priceValue)
      : null;


  const {
    error
  } = await sb
    .from("listings")
    .insert({

      user_id:
        currentUser.id,

      game,

      title,

      description,

      price,

      category,

      image_url:
        image || null

    });


  if(error){

    console.error(error);

    alert(
      "Ошибка создания объявления:\n\n" +
      error.message
    );

    return;
  }


  document
    .getElementById("listingGame")
    .value = "";


  document
    .getElementById("listingTitle")
    .value = "";


  document
    .getElementById("listingDescription")
    .value = "";


  document
    .getElementById("listingPrice")
    .value = "";


  document
    .getElementById("listingCategory")
    .value = "";


  document
    .getElementById("listingImage")
    .value = "";


  const search =
    document.getElementById(
      "gameSearch"
    );


  if(search){
    search.value = "";
  }


  alert(
    "Объявление опубликовано!"
  );


  showSection("home");
}


/* =========================
   OPEN CHAT
========================= */

async function openChat(
  listingId,
  receiverId,
  listingTitle
){

  if(!currentUser){

    alert(
      "Сначала войди в аккаунт."
    );

    return;
  }


  currentChat = {

    listingId:
      Number(listingId),

    receiverId,

    listingTitle,

    partnerId:
      receiverId

  };


  showSection("messages");

  openCurrentChat();
}


async function openConversation(
  listingId,
  partnerId,
  listingTitle
){

  if(!currentUser){
    return;
  }


  currentChat = {

    listingId:
      Number(listingId),

    receiverId:
      partnerId,

    listingTitle,

    partnerId

  };


  openCurrentChat();
}


async function openConversationFromElement(
  element
){

  const listingId =
    element.dataset.listingId;

  const partnerId =
    element.dataset.partnerId;

  const listingTitle =
    element.dataset.listingTitle;


  openConversation(
    listingId,
    partnerId,
    listingTitle
  );
}


/* =========================
   OPEN CURRENT CHAT
========================= */

async function openCurrentChat(){

  if(!currentChat){
    return;
  }


  const conversations =
    document.getElementById(
      "conversations"
    );

  const chatContainer =
    document.getElementById(
      "chatContainer"
    );


  conversations.style.display =
    "none";

  chatContainer.style.display =
    "block";


  const name =
    await getProfileName(
      currentChat.partnerId
    );


  const avatar =
    await getProfileAvatar(
      currentChat.partnerId
    );


  document.getElementById(
    "chatName"
  ).textContent = name;


  document.getElementById(
    "chatListing"
  ).textContent =
    currentChat.listingTitle ||
    "";


  const chatAvatar =
    document.getElementById(
      "chatAvatar"
    );


  chatAvatar.src =
    avatar ||
    "https://via.placeholder.com/100";


  await loadChat();

  subscribeChat();
}


function closeChat(){

  currentChat = null;

  if(chatChannel){

    sb.removeChannel(
      chatChannel
    );

    chatChannel = null;
  }


  document.getElementById(
    "chatContainer"
  ).style.display =
    "none";


  document.getElementById(
    "conversations"
  ).style.display =
    "block";


  loadConversations();
}


/* =========================
   LOAD CHAT
========================= */

async function loadChat(){

  if(!currentChat ||
     !currentUser){

    return;
  }


  const {
    data,
    error
  } = await sb
    .from("messages")
    .select("*")
    .eq(
      "listing_id",
      currentChat.listingId
    )
    .or(
      `and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChat.partnerId}),and(sender_id.eq.${currentChat.partnerId},receiver_id.eq.${currentUser.id})`
    )
    .order(
      "created_at",
      {ascending:true}
    );


  if(error){

    console.error(error);

    return;
  }


  const container =
    document.getElementById(
      "chatMessages"
    );


  if(!data || data.length === 0){

    container.innerHTML =
      '<div class="empty">Начни диалог 👋</div>';

    return;
  }


  container.innerHTML =
    data
      .map(messageHTML)
      .join("");


  container.scrollTop =
    container.scrollHeight;
}


function messageHTML(message){

  const mine =
    message.sender_id ===
    currentUser.id;


  const date =
    new Date(
      message.created_at
    ).toLocaleTimeString(
      "ru-RU",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );


  return `
    <div class="message ${mine ? "mine" : "theirs"}">

      <div>
        ${escapeHTML(message.message)}
      </div>

      <div class="message-time">
        ${date}
      </div>

    </div>
  `;
}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  if(!currentUser ||
     !currentChat){

    return;
  }


  const input =
    document.getElementById(
      "messageInput"
    );


  const text =
    input.value.trim();


  if(!text){
    return;
  }


  const {
    error
  } = await sb
    .from("messages")
    .insert({

      listing_id:
        currentChat.listingId,

      sender_id:
        currentUser.id,

      receiver_id:
        currentChat.partnerId,

      message:text

    });


  if(error){

    console.error(error);

    alert(
      "Не удалось отправить сообщение:\n\n" +
      error.message
    );

    return;
  }


  input.value = "";

  await loadChat();
}


function handleMessageKey(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();
  }
}


/* =========================
   REALTIME CHAT
========================= */

function subscribeChat(){

  if(chatChannel){

    sb.removeChannel(
      chatChannel
    );

    chatChannel = null;
  }


  if(!currentChat){
    return;
  }


  chatChannel =
    sb
      .channel(
        "chat-" +
        currentChat.listingId +
        "-" +
        currentUser.id +
        "-" +
        currentChat.partnerId
      )
      .on(

        "postgres_changes",

        {
          event:"INSERT",
          schema:"public",
          table:"messages"
        },

        payload=>{

          const message =
            payload.new;


          if(
            message.listing_id ===
            currentChat.listingId &&

            (
              (
                message.sender_id ===
                currentUser.id &&

                message.receiver_id ===
                currentChat.partnerId
              )
              ||
              (
                message.sender_id ===
                currentChat.partnerId &&

                message.receiver_id ===
                currentUser.id
              )
            )
          ){

            loadChat();
          }

        }

      )
      .subscribe();
}


/* =========================
   CONVERSATIONS
========================= */

async function loadConversations(){

  if(!currentUser){

    document.getElementById(
      "conversations"
    ).innerHTML =
      `
        <div class="card empty">
          Войди в аккаунт, чтобы увидеть чаты.
        </div>
      `;

    return;
  }


  const {
    data,
    error
  } = await sb
    .from("messages")
    .select("*")
    .or(
      `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
    )
    .order(
      "created_at",
      {ascending:false}
    );


  if(error){

    console.error(error);

    document.getElementById(
      "conversations"
    ).innerHTML =
      `
        <div class="empty">
          Ошибка загрузки чатов.
        </div>
      `;

    return;
  }


  const unique = new Map();


  for(const message of data || []){

    const partnerId =
      message.sender_id === currentUser.id
        ? message.receiver_id
        : message.sender_id;


    const key =
      `${message.listing_id}_${partnerId}`;


    if(!unique.has(key)){

      unique.set(
        key,
        message
      );
    }
  }


  if(unique.size === 0){

    document.getElementById(
      "conversations"
    ).innerHTML =
      `
        <div class="card empty">
          У тебя пока нет сообщений.
        </div>
      `;

    return;
  }


  const html = [];


  for(const message of unique.values()){

    const partnerId =
      message.sender_id === currentUser.id
        ? message.receiver_id
        : message.sender_id;


    const profile =
      await getProfile(
        partnerId
      );


    const listing =
      await sb
        .from("listings")
        .select("title")
        .eq(
          "id",
          message.listing_id
        )
        .maybeSingle();


    const name =
      profile?.username ||
      "Пользователь";


    const avatar =
      profile?.avatar_url ||
      "https://via.placeholder.com/100";


    const date =
      new Date(
        message.created_at
      ).toLocaleDateString(
        "ru-RU"
      );


    html.push(`

      <div
        class="conversation"
        data-listing-id="${message.listing_id}"
        data-partner-id="${partnerId}"
        data-listing-title="${escapeHTML(listing.data?.title || "")}"
        onclick="openConversationFromElement(this)"
      >

        <img
          class="conversation-avatar"
          src="${escapeHTML(avatar)}"
          alt="avatar"
        >

        <div class="conversation-info">

          <div class="conversation-name">
            ${escapeHTML(name)}
          </div>

          <div class="conversation-listing">
            ${escapeHTML(
              listing.data?.title ||
              "Объявление"
            )}
          </div>

          <div class="conversation-message">
            ${escapeHTML(
              message.message
            )}
          </div>

        </div>

        <div class="conversation-date">
          ${date}
        </div>

      </div>

    `);
  }


  document.getElementById(
    "conversations"
  ).innerHTML =
    html.join("");
}


/* =========================
   PROFILE LOAD
========================= */

async function loadProfile(){

  if(!currentUser){
    return;
  }


  const profile =
    await getProfile(
      currentUser.id
    );


  const nameInput =
    document.getElementById(
      "profileNameInput"
    );


  const avatarPreview =
    document.getElementById(
      "profileAvatarPreview"
    );


  if(profile){

    nameInput.value =
      profile.username ||
      "";


    if(profile.avatar_url){

      avatarPreview.src =
        profile.avatar_url;

      avatarPreview.style.display =
        "block";

    }else{

      avatarPreview.style.display =
        "none";
    }

  }else{

    nameInput.value = "";

    avatarPreview.style.display =
      "none";
  }
}


/* =========================
   SAVE PROFILE
========================= */

async function saveProfile(){

  if(!currentUser){

    alert(
      "Сначала войди в аккаунт."
    );

    return;
  }


  const nameInput =
    document.getElementById(
      "profileNameInput"
    );


  const fileInput =
    document.getElementById(
      "profileAvatarFile"
    );


  const username =
    nameInput.value.trim();


  const file =
    fileInput.files[0];


  const MAX_SIZE =
    10 * 1024 * 1024;


  if(file){

    if(file.size > MAX_SIZE){

      alert(
        "Аватарка слишком большая.\n\n" +
        "Максимальный размер — 10 МБ."
      );

      fileInput.value = "";

      return;
    }


    if(!file.type.startsWith("image/")){

      alert(
        "Можно загружать только изображения."
      );

      fileInput.value = "";

      return;
    }
  }


  let avatarUrl = null;


  const oldProfile =
    await getProfile(
      currentUser.id
    );


  avatarUrl =
    oldProfile?.avatar_url ||
    null;


  if(file){

    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();


    const filePath =
      `${currentUser.id}/${Date.now()}.${extension}`;


    const {
      error: uploadError
    } = await sb
      .storage
      .from("avatars")
      .upload(
        filePath,
        file,
        {
          cacheControl:"3600",
          upsert:true,
          contentType:file.type
        }
      );


    if(uploadError){

      console.error(
        "Avatar upload error:",
        uploadError
      );

      alert(
        "Ошибка загрузки аватарки:\n\n" +
        uploadError.message
      );

      return;
    }


    const {
      data: publicUrlData
    } =
      sb
        .storage
        .from("avatars")
        .getPublicUrl(
          filePath
        );


    avatarUrl =
      publicUrlData.publicUrl;
  }


  const {
    error
  } = await sb
    .from("profiles")
    .upsert({

      id:
        currentUser.id,

      username,

      avatar_url:
        avatarUrl

    });


  if(error){

    console.error(error);

    alert(
      "Ошибка сохранения профиля:\n\n" +
      error.message
    );

    return;
  }


  alert(
    "Профиль сохранён!"
  );


  fileInput.value = "";


  await loadProfile();

  await updateAuthUI();
}


/* =========================
   HTML SECURITY
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function escapeJS(value){

  return String(value ?? "")
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'")
    .replaceAll("\n","\\n")
    .replaceAll("\r","\\r");
}

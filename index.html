<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Delyvex</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0b0812;
  color:#fff;
  font-family:Arial,sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* AUTH */

#authGate{
  position:fixed;
  inset:0;
  background:#0b0812;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:20px;
}

.auth-box{
  width:100%;
  max-width:420px;
  background:#130d1f;
  border:1px solid #2b1b3d;
  border-radius:24px;
  padding:35px 25px;
  text-align:center;
  box-shadow:0 20px 70px rgba(0,0,0,.45);
}

.logo{
  font-size:32px;
  font-weight:900;
  color:#c084fc;
  margin-bottom:10px;
}

.auth-box p{
  color:#aaa;
  margin-bottom:25px;
}

.google-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:13px;
  background:#fff;
  color:#111;
  font-weight:700;
  cursor:pointer;
}

.google-btn:hover{
  opacity:.9;
}

/* HEADER */

header{
  height:70px;
  background:#100b1a;
  border-bottom:1px solid #241733;
  display:flex;
  align-items:center;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:100;
}

.header-logo{
  color:#c084fc;
  font-size:24px;
  font-weight:900;
}

.header-nav{
  display:flex;
  gap:8px;
  margin-left:auto;
  align-items:center;
}

.nav-btn{
  background:transparent;
  color:#ddd;
  border:0;
  padding:10px 13px;
  border-radius:10px;
}

.nav-btn:hover{
  background:#21152e;
  color:#fff;
}

.header-profile{
  display:flex;
  align-items:center;
  gap:8px;
  margin-left:10px;
}

.header-avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #8b5cf6;
}

/* CONTENT */

main{
  max-width:1100px;
  margin:auto;
  padding:25px 18px 100px;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.page-title{
  font-size:28px;
  margin:0 0 20px;
}

/* SEARCH */

.search-box{
  display:flex;
  gap:10px;
  margin-bottom:25px;
}

.search-box input{
  flex:1;
  min-width:0;
  background:#130d1f;
  border:1px solid #30203f;
  color:#fff;
  border-radius:13px;
  padding:14px;
  outline:none;
}

.search-box input:focus{
  border-color:#8b5cf6;
}

.primary-btn{
  border:0;
  background:#8b5cf6;
  color:#fff;
  padding:13px 18px;
  border-radius:12px;
  font-weight:700;
}

.primary-btn:hover{
  background:#7c3aed;
}

/* CARDS */

.card{
  background:#130d1f;
  border:1px solid #241733;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
}

.listing-card{
  display:flex;
  gap:18px;
}

.listing-image{
  width:130px;
  height:130px;
  border-radius:14px;
  object-fit:cover;
  background:#0b0812;
}

.listing-info{
  flex:1;
}

.listing-title{
  font-size:20px;
  font-weight:800;
  margin-bottom:8px;
}

.game-tag{
  display:inline-block;
  background:#28183b;
  color:#c084fc;
  border-radius:8px;
  padding:5px 9px;
  font-size:13px;
  margin-bottom:10px;
}

.price{
  font-size:21px;
  font-weight:900;
  color:#c084fc;
  margin-top:10px;
}

.description{
  color:#aaa;
  line-height:1.5;
}

/* FORMS */

.form-card{
  max-width:650px;
  margin:auto;
}

.form-group{
  margin-bottom:17px;
}

.form-group label{
  display:block;
  margin-bottom:7px;
  color:#c084fc;
  font-weight:700;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  background:#0b0812;
  color:#fff;
  border:1px solid #30203f;
  border-radius:12px;
  padding:13px;
  outline:none;
}

.form-group textarea{
  min-height:130px;
  resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
  border-color:#8b5cf6;
}

/* PROFILE */

.profile-card{
  max-width:700px;
  margin:auto;
}

.profile-top{
  display:flex;
  align-items:center;
  gap:20px;
  margin-bottom:25px;
}

.profile-avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #8b5cf6;
}

.profile-name{
  font-size:24px;
  font-weight:800;
}

.profile-email{
  color:#999;
  margin-top:5px;
}

/* AVATARS */

.avatar-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  margin-top:12px;
}

.avatar-option{
  aspect-ratio:1;
  border-radius:50%;
  border:3px solid transparent;
  padding:3px;
  background:#0b0812;
  transition:.15s;
}

.avatar-option:hover{
  transform:scale(1.06);
  border-color:#8b5cf6;
}

.avatar-option.selected{
  border-color:#c084fc;
  box-shadow:0 0 18px rgba(168,85,247,.45);
}

.avatar-option img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  display:block;
}

.selected-avatar{
  display:flex;
  justify-content:center;
  margin:20px 0;
}

.selected-avatar img{
  width:90px;
  height:90px;
  border-radius:50%;
  border:3px solid #8b5cf6;
}

/* CHAT */

.chat-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.chat-item{
  background:#130d1f;
  border:1px solid #241733;
  padding:16px;
  border-radius:15px;
  cursor:pointer;
}

.chat-item:hover{
  border-color:#8b5cf6;
}

.chat-window{
  max-width:750px;
  margin:auto;
}

.chat-messages{
  min-height:350px;
  max-height:500px;
  overflow-y:auto;
  background:#100b1a;
  border:1px solid #241733;
  border-radius:16px;
  padding:15px;
  margin-bottom:12px;
}

.message{
  max-width:75%;
  padding:10px 13px;
  border-radius:14px;
  margin-bottom:10px;
  line-height:1.4;
}

.message.mine{
  margin-left:auto;
  background:#6d3cc7;
}

.message.theirs{
  background:#241733;
}

.chat-send{
  display:flex;
  gap:8px;
}

.chat-send input{
  flex:1;
  background:#130d1f;
  color:#fff;
  border:1px solid #30203f;
  border-radius:12px;
  padding:13px;
}

/* MOBILE NAV */

.mobile-nav{
  display:none;
}

/* EMPTY */

.empty{
  text-align:center;
  color:#777;
  padding:50px 20px;
}

/* MOBILE */

@media(max-width:700px){

  header{
    height:60px;
    padding:0 15px;
  }

  .header-logo{
    font-size:21px;
  }

  .header-nav{
    display:none;
  }

  .header-profile{
    margin-left:auto;
  }

  main{
    padding:20px 13px 90px;
  }

  .listing-card{
    flex-direction:column;
  }

  .listing-image{
    width:100%;
    height:190px;
  }

  .avatar-grid{
    grid-template-columns:repeat(4,1fr);
  }

  .mobile-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:65px;
    background:#100b1a;
    border-top:1px solid #241733;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:500;
  }

  .mobile-nav button{
    background:none;
    border:0;
    color:#aaa;
    font-size:12px;
  }

  .mobile-nav button span{
    display:block;
    font-size:20px;
    margin-bottom:2px;
  }

  .search-box{
    flex-direction:column;
  }

  .profile-top{
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<!-- AUTH -->

<div id="authGate">

  <div class="auth-box">

    <div class="logo">
      Delyvex
    </div>

    <p>
      Войди в аккаунт, чтобы пользоваться Delyvex
    </p>

    <button
      class="google-btn"
      onclick="loginWithGoogle()"
    >
      Продолжить через Google
    </button>

  </div>

</div>


<!-- HEADER -->

<header>

  <div class="header-logo">
    Delyvex
  </div>

  <div class="header-nav">

    <button
      class="nav-btn"
      onclick="showSection('home')"
    >
      Главная
    </button>

    <button
      class="nav-btn"
      onclick="showSection('sell')"
    >
      ➕ Продать
    </button>

    <button
      class="nav-btn"
      onclick="showSection('chats')"
    >
      💬 Чаты
    </button>

    <button
      class="nav-btn"
      onclick="showSection('profile')"
    >
      👤 Профиль
    </button>

  </div>

  <div class="header-profile">

    <img
      id="headerAvatar"
      class="header-avatar hidden"
      src=""
      alt=""
    >

  </div>

</header>


<!-- MAIN -->

<main>

  <!-- HOME -->

  <section
    id="home"
    class="section active"
  >

    <h1 class="page-title">
      Найти объявление
    </h1>

    <div class="search-box">

      <input
        id="searchInput"
        type="text"
        placeholder="Игра, название или описание..."
        oninput="searchListings()"
      >

      <button
        class="primary-btn"
        onclick="searchListings()"
      >
        Найти
      </button>

    </div>

    <div id="listingsContainer"></div>

  </section>


  <!-- SELL -->

  <section
    id="sell"
    class="section"
  >

    <h1 class="page-title">
      Продать
    </h1>

    <div class="card form-card">

      <div class="form-group">

        <label>
          Игра
        </label>

        <input
          id="sellGame"
          type="text"
          placeholder="Например: Minecraft"
        >

      </div>


      <div class="form-group">

        <label>
          Название
        </label>

        <input
          id="sellTitle"
          type="text"
          placeholder="Название товара"
        >

      </div>


      <div class="form-group">

        <label>
          Описание
        </label>

        <textarea
          id="sellDescription"
          placeholder="Опиши товар..."
        ></textarea>

      </div>


      <div class="form-group">

        <label>
          Цена
        </label>

        <input
          id="sellPrice"
          type="number"
          min="0"
          placeholder="100"
        >

      </div>


      <div class="form-group">

        <label>
          Ссылка на изображение
        </label>

        <input
          id="sellImage"
          type="text"
          placeholder="https://..."
        >

      </div>


      <button
        class="primary-btn"
        onclick="createListing()"
      >
        Опубликовать
      </button>

    </div>

  </section>


  <!-- CHATS -->

  <section
    id="chats"
    class="section"
  >

    <h1 class="page-title">
      Чаты
    </h1>

    <div id="chatsContainer"></div>

  </section>


  <!-- PROFILE -->

  <section
    id="profile"
    class="section"
  >

    <h1 class="page-title">
      Профиль
    </h1>

    <div class="card profile-card">

      <div class="profile-top">

        <img
          id="profileAvatar"
          class="profile-avatar"
          src=""
          alt=""
        >

        <div>

          <div
            id="profileNickname"
            class="profile-name"
          >
            Пользователь
          </div>

          <div
            id="profileEmail"
            class="profile-email"
          >
          </div>

        </div>

      </div>


      <div class="form-group">

        <label>
          Никнейм
        </label>

        <input
          id="nicknameInput"
          type="text"
          maxlength="30"
          placeholder="Введите никнейм"
        >

      </div>


      <div class="form-group">

        <label>
          Выбери аватар
        </label>

        <div
          id="avatarGrid"
          class="avatar-grid"
        ></div>

      </div>


      <div class="selected-avatar">

        <img
          id="selectedAvatarPreview"
          src=""
          alt="Выбранный аватар"
        >

      </div>


      <button
        class="primary-btn"
        onclick="saveProfile()"
      >
        Сохранить профиль
      </button>


      <button
        class="primary-btn"
        style="margin-top:10px;background:#241733;"
        onclick="logout()"
      >
        Выйти
      </button>

    </div>

  </section>


  <!-- CHAT WINDOW -->

  <section
    id="chatWindow"
    class="section"
  >

    <div class="chat-window">

      <button
        class="nav-btn"
        onclick="showSection('chats')"
      >
        ← Назад
      </button>

      <h2 id="chatTitle">
        Чат
      </h2>

      <div
        id="chatMessages"
        class="chat-messages"
      ></div>

      <div class="chat-send">

        <input
          id="chatInput"
          type="text"
          placeholder="Написать сообщение..."
          onkeydown="if(event.key==='Enter')sendMessage()"
        >

        <button
          class="primary-btn"
          onclick="sendMessage()"
        >
          Отправить
        </button>

      </div>

    </div>

  </section>

</main>


<!-- MOBILE NAV -->

<div class="mobile-nav">

  <button onclick="showSection('home')">
    <span>⌂</span>
    Главная
  </button>

  <button onclick="showSection('sell')">
    <span>＋</span>
    Продать
  </button>

  <button onclick="showSection('chats')">
    <span>💬</span>
    Чаты
  </button>

  <button onclick="showSection('profile')">
    <span>👤</span>
    Профиль
  </button>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://gisdufgixjfudblxydvm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_irNKt_PStZrQ2NCEdaD5sg_quCmigAn";

const sb =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const GITHUB_URL =
"https://tyronik2x2v2-stack.github.io/Delyvex/";


/* =========================
   20 AVATARS
========================= */

const AVATARS = [
  "https://api.dicebear.com/9.x/adventurer/svg?seed=Alex",
  "https://api.dicebear.com/9.x/adventurer/svg?seed=Max",
  "https://api.dicebear.com/9.x/adventurer/svg?seed=Leo",
  "https://api.dicebear.com/9.x/adventurer/svg?seed=Sam",
  "https://api.dicebear.com/9.x/adventurer/svg?seed=Kai",

  "https://api.dicebear.com/9.x/adventurer/svg?seed=Noah",
  "https://api.dicebear.com/9.x/adventurer/svg?seed=Ryan",
  "https://api.dicebear.com/9.x/adventurer/svg?seed=Jack",
  "https://api.dicebear.com/9.x/adventurer/svg?seed=Tom",
  "https://api.dicebear.com/9.x/adventurer/svg?seed=Oliver",

  "https://api.dicebear.com/9.x/adventurer/svg?seed=Daniel",
  "https://api.dicebear.com/9.x/adventurer/svg?seed=Chris",
  "https://api.dicebear.com/9.x/adventurer/svg?seed=David",
  "https://api.dicebear.com/9.x/adventurer/svg?seed=James",
  "https://api.dicebear.com/9.x/adventurer/svg?seed=Lucas",

  "https://api.dicebear.com/9.x/adventurer/svg?seed=Adam",
  "https://api.dicebear.com/9.x/adventurer/svg?seed=Ethan",
  "https://api.dicebear.com/9.x/adventurer/svg?seed=Ben",
  "https://api.dicebear.com/9.x/adventurer/svg?seed=Victor",
  "https://api.dicebear.com/9.x/adventurer/svg?seed=Mark"
];


/* =========================
   STATE
========================= */

let currentUser = null;
let listings = [];
let selectedAvatar = AVATARS[0];

let currentChat = null;
let currentReceiver = null;
let currentListing = null;


/* =========================
   GOOGLE LOGIN
========================= */

async function loginWithGoogle(){

  try{

    const result =
      await sb.auth.signInWithOAuth({

        provider:"google",

        options:{
          redirectTo:GITHUB_URL,

          skipBrowserRedirect:false,

          queryParams:{
            access_type:"offline",
            prompt:"select_account"
          }

        }

      });


    if(result.error){

      console.error(
        result.error
      );

      alert(
        "Ошибка входа через Google:\n\n" +
        result.error.message
      );

    }

  }catch(error){

    console.error(error);

    alert(
      "Ошибка входа:\n\n" +
      error.message
    );

  }

}


/* =========================
   AUTH GATE
========================= */

function showAuthGate(){

  document
    .getElementById("authGate")
    .classList.remove("hidden");

}


function hideAuthGate(){

  document
    .getElementById("authGate")
    .classList.add("hidden");

}


/* =========================
   INITIALIZE
========================= */

async function initialize(){

  const {
    data,
    error
  } =
    await sb.auth.getSession();


  if(error){

    console.error(error);

    return;

  }


  if(!data.session){

    showAuthGate();

    return;

  }


  currentUser =
    data.session.user;

  hideAuthGate();

  await loadProfile();

  await loadListings();

  renderAvatars();

}


sb.auth.onAuthStateChange(
  async (event,session)=>{

    if(session){

      currentUser =
        session.user;

      hideAuthGate();

      await loadProfile();

      await loadListings();

      renderAvatars();

    }else{

      currentUser = null;

      showAuthGate();

    }

  }
);


/* =========================
   SECTIONS
========================= */

function showSection(section){

  if(!currentUser){

    showAuthGate();

    return;

  }


  document
    .querySelectorAll(".section")
    .forEach(el=>{
      el.classList.remove("active");
    });


  const target =
    document.getElementById(section);


  if(target){

    target.classList.add("active");

  }


  if(section === "chats"){

    loadChats();

  }


  if(section === "profile"){

    loadProfile();

    renderAvatars();

  }

}


/* =========================
   PROFILE
========================= */

async function loadProfile(){

  if(!currentUser){

    return;

  }


  const {
    data,
    error
  } =
    await sb
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();


  if(error){

    console.error(error);

    return;

  }


  let nickname =
    data?.nickname ||
    currentUser.user_metadata?.full_name ||
    currentUser.user_metadata?.name ||
    "Пользователь";


  let avatar =
    data?.avatar_url ||
    currentUser.user_metadata?.avatar_url ||
    AVATARS[0];


  document
    .getElementById("nicknameInput")
    .value = nickname;


  document
    .getElementById("profileNickname")
    .textContent = nickname;


  document
    .getElementById("profileEmail")
    .textContent =
      currentUser.email || "";


  document
    .getElementById("profileAvatar")
    .src = avatar;


  document
    .getElementById("headerAvatar")
    .src = avatar;


  document
    .getElementById("headerAvatar")
    .classList.remove("hidden");


  selectedAvatar = avatar;


  document
    .getElementById("selectedAvatarPreview")
    .src = avatar;


  renderAvatars();

}


/* =========================
   AVATAR SELECTOR
========================= */

function renderAvatars(){

  const grid =
    document.getElementById("avatarGrid");


  if(!grid){

    return;

  }


  grid.innerHTML = "";


  AVATARS.forEach(
    (avatar,index)=>{

      const button =
        document.createElement("button");


      button.type = "button";

      button.className =
        "avatar-option" +
        (
          selectedAvatar === avatar
            ? " selected"
            : ""
        );


      const img =
        document.createElement("img");


      img.src = avatar;

      img.alt =
        "Аватар " + (index + 1);


      button.appendChild(img);


      button.onclick = ()=>{

        selectedAvatar =
          avatar;


        document
          .getElementById(
            "selectedAvatarPreview"
          )
          .src = avatar;


        renderAvatars();

      };


      grid.appendChild(button);

    }
  );

}


/* =========================
   SAVE PROFILE
========================= */

async function saveProfile(){

  if(!currentUser){

    showAuthGate();

    return;

  }


  const nickname =
    document
      .getElementById("nicknameInput")
      .value
      .trim();


  if(!nickname){

    alert(
      "Введите никнейм."
    );

    return;

  }


  const {
    error
  } =
    await sb
      .from("profiles")
      .upsert({

        id:currentUser.id,

        nickname:nickname,

        avatar_url:selectedAvatar

      });


  if(error){

    console.error(error);

    alert(
      "Ошибка сохранения профиля:\n\n" +
      error.message
    );

    return;

  }


  document
    .getElementById("profileNickname")
    .textContent =
      nickname;


  document
    .getElementById("profileAvatar")
    .src =
      selectedAvatar;


  document
    .getElementById("headerAvatar")
    .src =
      selectedAvatar;


  document
    .getElementById("headerAvatar")
    .classList.remove("hidden");


  alert(
    "Профиль успешно сохранён!"
  );

}


/* =========================
   LISTINGS
========================= */

async function loadListings(){

  const {
    data,
    error
  } =
    await sb
      .from("listings")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(error);

    return;

  }


  listings =
    data || [];


  renderListings(
    listings
  );

}


function renderListings(items){

  const container =
    document
      .getElementById(
        "listingsContainer"
      );


  container.innerHTML = "";


  if(!items.length){

    container.innerHTML =
      `<div class="empty">
        Объявлений пока нет.
      </div>`;

    return;

  }


  items.forEach(listing=>{

    const card =
      document.createElement("div");


    card.className =
      "card listing-card";


    const image =
      listing.image_url ||
      "https://placehold.co/600x400/130d1f/c084fc?text=Delyvex";


    card.innerHTML = `

      <img
        class="listing-image"
        src="${escapeHtml(image)}"
        alt=""
      >

      <div class="listing-info">

        <div class="game-tag">
          ${escapeHtml(listing.game || "Игра")}
        </div>

        <div class="listing-title">
          ${escapeHtml(listing.title || "Без названия")}
        </div>

        <div class="description">
          ${escapeHtml(listing.description || "")}
        </div>

        <div class="price">
          ${escapeHtml(String(listing.price ?? ""))} ₽
        </div>

        ${
          listing.seller_id &&
          listing.seller_id !== currentUser?.id
          ?
          `<button
            class="primary-btn"
            style="margin-top:12px;"
            onclick="openChat(
              '${listing.id}',
              '${listing.seller_id}',
              '${escapeJs(listing.title || "")}'
            )"
          >
            Написать продавцу
          </button>`
          :
          ""
        }

      </div>
    `;


    container.appendChild(card);

  });

}


/* =========================
   SEARCH
========================= */

function searchListings(){

  const query =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  if(!query){

    renderListings(
      listings
    );

    return;

  }


  const result =
    listings.filter(item=>{

      const game =
        String(item.game || "")
          .toLowerCase();

      const title =
        String(item.title || "")
          .toLowerCase();

      const description =
        String(item.description || "")
          .toLowerCase();


      return (
        game.includes(query) ||
        title.includes(query) ||
        description.includes(query)
      );

    });


  renderListings(
    result
  );

}


/* =========================
   CREATE LISTING
========================= */

async function createListing(){

  if(!currentUser){

    showAuthGate();

    return;

  }


  const game =
    document
      .getElementById("sellGame")
      .value
      .trim();


  const title =
    document
      .getElementById("sellTitle")
      .value
      .trim();


  const description =
    document
      .getElementById("sellDescription")
      .value
      .trim();


  const price =
    document
      .getElementById("sellPrice")
      .value;


  const image =
    document
      .getElementById("sellImage")
      .value
      .trim();


  if(!game || !title || !price){

    alert(
      "Заполни игру, название и цену."
    );

    return;

  }


  const {
    error
  } =
    await sb
      .from("listings")
      .insert({

        seller_id:currentUser.id,

        game:game,

        title:title,

        description:description,

        price:Number(price),

        image_url:image || null

      });


  if(error){

    console.error(error);

    alert(
      "Ошибка публикации:\n\n" +
      error.message
    );

    return;

  }


  document
    .getElementById("sellGame")
    .value = "";


  document
    .getElementById("sellTitle")
    .value = "";


  document
    .getElementById("sellDescription")
    .value = "";


  document
    .getElementById("sellPrice")
    .value = "";


  document
    .getElementById("sellImage")
    .value = "";


  alert(
    "Объявление опубликовано!"
  );


  await loadListings();

  showSection("home");

}


/* =========================
   CHATS
========================= */

async function loadChats(){

  if(!currentUser){

    return;

  }


  const container =
    document
      .getElementById(
        "chatsContainer"
      );


  container.innerHTML =
    `<div class="empty">
      Загрузка чатов...
    </div>`;


  const {
    data,
    error
  } =
    await sb
      .from("messages")
      .select("*")
      .or(
        `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(error);

    container.innerHTML =
      `<div class="empty">
        Не удалось загрузить чаты.
      </div>`;

    return;

  }


  if(!data?.length){

    container.innerHTML =
      `<div class="empty">
        У тебя пока нет сообщений.
      </div>`;

    return;

  }


  const chats = new Map();


  data.forEach(message=>{

    const other =
      message.sender_id === currentUser.id
        ? message.receiver_id
        : message.sender_id;


    if(!chats.has(other)){

      chats.set(
        other,
        message
      );

    }

  });


  container.innerHTML = "";


  chats.forEach(
    (message,otherId)=>{

      const item =
        document.createElement("div");


      item.className =
        "chat-item";


      item.innerHTML = `

        <strong>
          Чат
        </strong>

        <div style="
          color:#999;
          margin-top:6px;
        ">
          ${escapeHtml(message.message)}
        </div>

      `;


      item.onclick = ()=>{

        openChat(
          message.listing_id,
          otherId,
          "Чат"
        );

      };


      container.appendChild(item);

    }
  );

}


/* =========================
   OPEN CHAT
========================= */

async function openChat(
  listingId,
  receiverId,
  title
){

  currentChat =
    listingId;

  currentReceiver =
    receiverId;

  currentListing =
    listingId;


  document
    .getElementById("chatTitle")
    .textContent =
      title || "Чат";


  showSection(
    "chatWindow"
  );


  await loadMessages();

}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages(){

  const container =
    document
      .getElementById(
        "chatMessages"
      );


  container.innerHTML =
    `<div class="empty">
      Загрузка...
    </div>`;


  const {
    data,
    error
  } =
    await sb
      .from("messages")
      .select("*")
      .eq(
        "listing_id",
        currentChat
      )
      .or(
        `and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentReceiver}),and(sender_id.eq.${currentReceiver},receiver_id.eq.${currentUser.id})`
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(error){

    console.error(error);

    container.innerHTML =
      `<div class="empty">
        Ошибка загрузки сообщений.
      </div>`;

    return;

  }


  container.innerHTML = "";


  if(!data?.length){

    container.innerHTML =
      `<div class="empty">
        Начни общение.
      </div>`;

    return;

  }


  data.forEach(message=>{

    const div =
      document.createElement("div");


    div.className =
      "message " +
      (
        message.sender_id === currentUser.id
          ? "mine"
          : "theirs"
      );


    div.textContent =
      message.message;


    container.appendChild(div);

  });


  container.scrollTop =
    container.scrollHeight;

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  if(!currentUser || !currentReceiver){

    return;

  }


  const input =
    document
      .getElementById(
        "chatInput"
      );


  const message =
    input.value.trim();


  if(!message){

    return;

  }


  const {
    error
  } =
    await sb
      .from("messages")
      .insert({

        listing_id:
          currentListing,

        sender_id:
          currentUser.id,

        receiver_id:
          currentReceiver,

        message:
          message

      });


  if(error){

    console.error(error);

    alert(
      "Ошибка отправки:\n\n" +
      error.message
    );

    return;

  }


  input.value = "";


  await loadMessages();

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await sb.auth.signOut();

  currentUser =
    null;

  showAuthGate();

}


/* =========================
   HELPERS
========================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeJs(value){

  return String(value)
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'")
    .replaceAll("\n"," ");

}


/* =========================
   START
========================= */

initialize();
